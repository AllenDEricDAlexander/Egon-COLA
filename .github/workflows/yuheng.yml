name: Yuheng CI

on:
  push:
    paths:
      - ".github/workflows/yuheng.yml"
      - "pom.xml"
      - "egon-cola-components/pom.xml"
      - "egon-cola-components/egon-cola-components-bom/pom.xml"
      - "egon-cola-xingyuan/egon-cola-tianshu/**"
      - "egon-cola-components/egon-cola-component-rpc/**"
      - "egon-cola-xingyuan/pom.xml"
      - "egon-cola-xingyuan/egon-cola-yuheng/**"
  pull_request:
    paths:
      - ".github/workflows/yuheng.yml"
      - "pom.xml"
      - "egon-cola-components/pom.xml"
      - "egon-cola-components/egon-cola-components-bom/pom.xml"
      - "egon-cola-xingyuan/egon-cola-tianshu/**"
      - "egon-cola-components/egon-cola-component-rpc/**"
      - "egon-cola-xingyuan/pom.xml"
      - "egon-cola-xingyuan/egon-cola-yuheng/**"
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the Docker-backed live topology
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YUHENG_ROOT: egon-cola-xingyuan/egon-cola-yuheng
  YUHENG_TEST_SUITE: egon-cola-xingyuan/egon-cola-yuheng/yuheng-test/yuheng-test-suite

jobs:
  yuheng-fast:
    name: Yuheng fast verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: Verify Yuheng Java reactor
        run: |
          ./mvnw -B -ntp \
            -pl "${YUHENG_TEST_SUITE}" \
            -am test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "${{ env.YUHENG_ROOT }}/yuheng-admin-web/.node-version"
          cache: npm
          cache-dependency-path: "${{ env.YUHENG_ROOT }}/yuheng-admin-web/package-lock.json"

      - name: Verify Yuheng Admin Web
        working-directory: ${{ env.YUHENG_ROOT }}/yuheng-admin-web
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run lint
          npm run build

  yuheng-admin-e2e:
    name: Yuheng Admin browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "${{ env.YUHENG_ROOT }}/yuheng-admin-web/.node-version"
          cache: npm
          cache-dependency-path: "${{ env.YUHENG_ROOT }}/yuheng-admin-web/package-lock.json"

      - name: Install dependencies and Chromium
        working-directory: ${{ env.YUHENG_ROOT }}/yuheng-admin-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Yuheng Admin acceptance
        working-directory: ${{ env.YUHENG_ROOT }}/yuheng-admin-web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-admin-playwright-report
          path: ${{ env.YUHENG_ROOT }}/yuheng-admin-web/playwright-report
          if-no-files-found: ignore

  yuheng-live:
    name: Yuheng real topology
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live)
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: Run Docker-backed live topology
        run: |
          ./mvnw -B -ntp \
            -pl "${YUHENG_TEST_SUITE}" \
            -am -Pyuheng-live verify

      - name: Upload process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-live-process-evidence
          path: |
            ${{ env.YUHENG_TEST_SUITE }}/target/yuheng-process-it
            ${{ env.YUHENG_TEST_SUITE }}/target/failsafe-reports
          if-no-files-found: ignore

  yuheng-performance:
    name: Yuheng nightly performance
    if: github.event_name == 'schedule' && vars.YUHENG_PERFORMANCE_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 1500
    env:
      YUHENG_PERF_PROFILE: soak
      YUHENG_SOAK_DURATION_SECONDS: "43200"
      YUHENG_PUBLIC_BASE_URL: ${{ vars.YUHENG_PUBLIC_BASE_URL }}
      YUHENG_INTERNAL_BASE_URL: ${{ vars.YUHENG_INTERNAL_BASE_URL }}
      YUHENG_RPC_CONSUMER_BASE_URL: ${{ vars.YUHENG_RPC_CONSUMER_BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run HTTP and RPC soak
        working-directory: ${{ env.YUHENG_ROOT }}/performance
        run: ./soak.sh

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-performance-evidence
          path: ${{ env.YUHENG_ROOT }}/performance/artifacts
          if-no-files-found: ignore
