name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "all"
        type: choice
        options:
          - all

      skip_tests:
        description: "Skip tests"
        required: true
        default: true
        type: boolean

      dry_run:
        description: "Only run release verification, do not deploy"
        required: true
        default: false
        type: boolean

      confirm_release:
        description: "Confirm publishing immutable release artifacts to Maven Central"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish / ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Guard release branch
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          if [[ "${BRANCH}" != "main" && "${BRANCH}" != "master" ]]; then
            echo "Maven Central release is only allowed from main/master."
            echo "Current branch: ${BRANCH}"
            exit 1
          fi

      - name: Validate release confirmation
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_release }}" != "true" ]]; then
            echo "confirm_release must be true before publishing to Maven Central."
            exit 1
          fi

      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0

          if [[ -z "${CENTRAL_USERNAME:-}" ]]; then
            echo "Missing secret: CENTRAL_USERNAME"
            missing=1
          fi

          if [[ -z "${CENTRAL_PASSWORD:-}" ]]; then
            echo "Missing secret: CENTRAL_PASSWORD"
            missing=1
          fi

          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "Missing secret: GPG_PRIVATE_KEY"
            missing=1
          fi

          if [[ -z "${GPG_PASSPHRASE:-}" ]]; then
            echo "Missing secret: GPG_PASSPHRASE"
            missing=1
          fi

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Prepare Maven Wrapper
        run: |
          set -euo pipefail

          chmod +x ./mvnw
          java -version
          ./mvnw -version

      - name: Resolve publish target
        id: target
        run: |
          set -euo pipefail

          TARGET="${{ inputs.target }}"

          if [[ "${TARGET}" != "all" ]]; then
            echo "Unsupported publish target: ${TARGET}"
            exit 1
          fi

          MAVEN_PROJECT_ARGS=""
          VERSION_PROJECT_ARGS="-N"

          echo "maven_project_args=${MAVEN_PROJECT_ARGS}" >> "${GITHUB_OUTPUT}"
          echo "version_project_args=${VERSION_PROJECT_ARGS}" >> "${GITHUB_OUTPUT}"

          echo "Publish target: ${TARGET}"
          echo "Maven project args: ${MAVEN_PROJECT_ARGS:-<root reactor>}"

      - name: Validate release version
        run: |
          set -euo pipefail

          VERSION="$(./mvnw ${{ steps.target.outputs.version_project_args }} \
            -q help:evaluate \
            -Dexpression=project.version \
            -DforceStdout)"

          echo "Resolved project version: ${VERSION}"

          if [[ -z "${VERSION}" ]]; then
            echo "Cannot resolve project.version."
            exit 1
          fi

          if [[ "${VERSION}" == *"-SNAPSHOT" ]]; then
            echo "Maven Central release version must not be a SNAPSHOT version."
            echo "Current version: ${VERSION}"
            exit 1
          fi

          echo "PROJECT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run source-to-archetype preflight
        run: |
          set -euo pipefail

          ./mvnw -B -ntp -N install
          ./mvnw -B -ntp -N -f egon-cola-archetypes/pom.xml install
          ./mvnw -B -ntp -f egon-cola-archetypes/source-projects/pom.xml clean install
          ./scripts/generate_archetypes.sh generate
          ./scripts/generate_archetypes.sh check
          test -z "$(git ls-files -- egon-cola-archetypes/.generated)"
          ./mvnw -B -ntp -f egon-cola-archetypes/pom.xml clean integration-test

      - name: Verify release shape (dry run)
        if: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail

          MVN_ARGS=(
            -B
            -ntp
            -Prelease
            -DtrimStackTrace=false
            -Dgpg.skip=true
          )

          ./mvnw -f pom.xml "${MVN_ARGS[@]}" clean verify

      - name: Build and inspect signed release artifacts before deploy
        if: ${{ inputs.dry_run == false }}
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          MVN_ARGS=(
            -B
            -ntp
            -Prelease
            -DtrimStackTrace=false
            "-Dgpg.passphrase=${GPG_PASSPHRASE}"
          )

          if [[ "${{ inputs.skip_tests }}" == "true" ]]; then
            MVN_ARGS+=("-DskipTests")
          fi

          ./mvnw -f pom.xml "${MVN_ARGS[@]}" clean verify

          mapfile -t MANIFESTS < <(
            find egon-cola-archetypes -type f \
              -path '*/src/main/archetype/archetype.properties' \
              -print | sort
          )
          EXPECTED_MANIFESTS=0
          while IFS= read -r PACKAGE_POM; do
            if grep -Fq '<packaging>maven-archetype</packaging>' "${PACKAGE_POM}"; then
              EXPECTED_MANIFESTS=$((EXPECTED_MANIFESTS + 1))
            fi
          done < <(
            find egon-cola-archetypes -mindepth 2 -maxdepth 2 -type f \
              -name pom.xml -print | sort
          )
          if [[ "${#MANIFESTS[@]}" -eq 0 || "${#MANIFESTS[@]}" -ne "${EXPECTED_MANIFESTS}" ]]; then
            echo "Manifest/package count mismatch: manifests=${#MANIFESTS[@]}, packages=${EXPECTED_MANIFESTS}." >&2
            exit 1
          fi

          for manifest in "${MANIFESTS[@]}"; do
            TARGET_ARTIFACT_ID="$(sed -n 's/^targetArtifactId=//p' "${manifest}" | tr -d '\r')"
            MODULE_DIR="egon-cola-archetypes/${TARGET_ARTIFACT_ID}"
            test -f "${MODULE_DIR}/pom.xml"
            grep -Fq "<artifactId>${TARGET_ARTIFACT_ID}</artifactId>" "${MODULE_DIR}/pom.xml"
            for classifier in jar sources.jar javadoc.jar; do
              case "${classifier}" in
                jar) artifact="${MODULE_DIR}/target/${TARGET_ARTIFACT_ID}-${PROJECT_VERSION}.jar" ;;
                sources.jar) artifact="${MODULE_DIR}/target/${TARGET_ARTIFACT_ID}-${PROJECT_VERSION}-sources.jar" ;;
                javadoc.jar) artifact="${MODULE_DIR}/target/${TARGET_ARTIFACT_ID}-${PROJECT_VERSION}-javadoc.jar" ;;
              esac
              test -s "${artifact}"
              test -s "${artifact}.asc"
            done
          done
          echo "Verified signed main/sources/javadoc artifacts for ${#MANIFESTS[@]} archetypes."

      - name: Publish to Maven Central
        if: ${{ inputs.dry_run == false }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          MVN_ARGS=(
            -B
            -ntp
            -Prelease
            -DtrimStackTrace=false
            "-Dgpg.passphrase=${GPG_PASSPHRASE}"
          )

          if [[ "${{ inputs.skip_tests }}" == "true" ]]; then
            MVN_ARGS+=("-DskipTests")
          fi

          ./mvnw ${{ steps.target.outputs.maven_project_args }} "${MVN_ARGS[@]}" clean deploy

      - name: Remove self-installed Maven artifacts
        if: always()
        run: |
          rm -rf \
            "$HOME/.m2/repository/top/egon" \
            "$HOME/.m2/repository/com/alibaba/cola" \
            "$HOME/.m2/repository/com/alibaba/craftsman"
