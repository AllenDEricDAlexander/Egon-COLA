name: Fast CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Fast CI / Backend compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: Compile and test the full backend reactor
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test

      - name: Remove self-installed Maven artifacts
        if: always()
        run: |
          rm -rf \
            "$HOME/.m2/repository/top/egon" \
            "$HOME/.m2/repository/com/alibaba/cola" \
            "$HOME/.m2/repository/com/alibaba/craftsman"

  frontend:
    name: Fast CI / Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build xingyuan admin portal
        working-directory: egon-cola-xingyuan/egon-cola-xingyuan-admin-portal
        run: |
          npm ci
          npm run build

      - name: Build tianquan-jianshen frontend workspaces
        working-directory: egon-cola-xingyuan/egon-cola-tianquan-jianshen
        run: |
          npm ci
          npm run build

      - name: Build yuheng admin web
        working-directory: egon-cola-xingyuan/egon-cola-yuheng/yuheng-admin-web
        run: |
          npm ci
          npm run build
