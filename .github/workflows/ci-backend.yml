name: CI Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      # Compiles main and test sources of the whole reactor without running tests,
      # packaging, or installing anything into the local repository.
      - name: Compile the backend reactor
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test-compile

      - name: Remove self-installed Maven artifacts
        if: always()
        # Keep our own artifacts out of the shared `cache: maven` entry, so stale
        # copies from older runs can never shadow the reactor modules.
        run: |
          rm -rf \
            "$HOME/.m2/repository/top/egon" \
            "$HOME/.m2/repository/com/alibaba/cola" \
            "$HOME/.m2/repository/com/alibaba/craftsman"
