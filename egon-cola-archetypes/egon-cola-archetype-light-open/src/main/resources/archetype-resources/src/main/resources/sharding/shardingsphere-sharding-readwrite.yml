#set( $symbol_dollar = '$' )
databaseName: ${symbol_dollar}{app.sharding.database-name:${symbol_dollar}{LIGHT_SHARDING_DATABASE_NAME:student_management}}

rules:
  - !READWRITE_SPLITTING
    dataSourceGroups:
      master_data:
        writeDataSourceName: master_data_primary
        readDataSourceNames:
          - master_data_replica_0
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: round_robin
      shard_0:
        writeDataSourceName: shard_0_primary
        readDataSourceNames:
          - shard_0_replica_0
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: round_robin
      shard_1:
        writeDataSourceName: shard_1_primary
        readDataSourceNames:
          - shard_1_replica_0
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: round_robin
    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

  - !SHARDING
    tables:
      users:
        actualDataNodes: master_data.users
        databaseStrategy:
          none:
        tableStrategy:
          none:
      roles:
        actualDataNodes: master_data.roles
        databaseStrategy:
          none:
        tableStrategy:
          none:
      permissions:
        actualDataNodes: master_data.permissions
        databaseStrategy:
          none:
        tableStrategy:
          none:
      user_roles:
        actualDataNodes: master_data.user_roles
        databaseStrategy:
          none:
        tableStrategy:
          none:
      role_permissions:
        actualDataNodes: master_data.role_permissions
        databaseStrategy:
          none:
        tableStrategy:
          none:
      courses:
        actualDataNodes: master_data.courses
        databaseStrategy:
          none:
        tableStrategy:
          none:
      school_classes:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.school_classes_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: snowflake_long_database_bucket
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: snowflake_long_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      class_course_schedules:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.class_course_schedules_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: school_class_id
            shardingAlgorithmName: snowflake_long_database_bucket
        tableStrategy:
          standard:
            shardingColumn: school_class_id
            shardingAlgorithmName: snowflake_long_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
    bindingTables:
      - school_classes,class_course_schedules
    shardingAlgorithms:
      snowflake_long_database_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.SnowflakeLongShardingAlgorithm
          target: database
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
      snowflake_long_table_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.SnowflakeLongShardingAlgorithm
          target: table
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
    auditors:
      sharding_key_required_auditor:
        type: DML_SHARDING_CONDITIONS

props:
  sql-show: ${symbol_dollar}{SHARDING_SQL_SHOW:false}
