#set( $symbol_dollar = '$' )
spring:
  profiles:
    default: dev
  sql:
    init:
      mode: never
  config:
    import:
      - classpath:datasource/sharding.yml
      - classpath:datasource/sharding-readwrite.yml
      - optional:file:./config/application-secrets.yml
      - optional:configtree:/run/secrets/
  threads:
    virtual:
      enabled: ${symbol_dollar}{SPRING_THREADS_VIRTUAL_ENABLED:false}
  lifecycle:
    timeout-per-shutdown-phase: ${symbol_dollar}{SHUTDOWN_TIMEOUT:30s}
  task:
    execution:
      thread-name-prefix: ${symbol_dollar}{ASYNC_THREAD_NAME_PREFIX:egon-async-}
      shutdown:
        await-termination: true
        await-termination-period: ${symbol_dollar}{ASYNC_AWAIT_TERMINATION:30s}
      pool:
        core-size: ${symbol_dollar}{ASYNC_CORE_SIZE:8}
        max-size: ${symbol_dollar}{ASYNC_MAX_SIZE:32}
        queue-capacity: ${symbol_dollar}{ASYNC_QUEUE_CAPACITY:1000}
        keep-alive: ${symbol_dollar}{ASYNC_KEEP_ALIVE:60s}
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${symbol_dollar}{SCHEDULING_AWAIT_TERMINATION:30s}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: ${symbol_dollar}{APP_TIME_ZONE:Asia/Shanghai}
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${symbol_dollar}{SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${symbol_dollar}{TOMCAT_THREADS_MAX:200}
      min-spare: ${symbol_dollar}{TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${symbol_dollar}{TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${symbol_dollar}{TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${symbol_dollar}{TOMCAT_CONNECTION_TIMEOUT:20s}
    keep-alive-timeout: ${symbol_dollar}{TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${symbol_dollar}{TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
    max-http-form-post-size: ${symbol_dollar}{TOMCAT_MAX_HTTP_FORM_POST_SIZE:2MB}
    max-swallow-size: ${symbol_dollar}{TOMCAT_MAX_SWALLOW_SIZE:2MB}
    processor-cache: ${symbol_dollar}{TOMCAT_PROCESSOR_CACHE:200}
    mbeanregistry:
      enabled: ${symbol_dollar}{TOMCAT_MBEAN_REGISTRY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${symbol_dollar}{MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${symbol_dollar}{MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

egon:
  cola:
    component:
      id:
        machine-id: ${symbol_dollar}{EGON_ID_MACHINE_ID}
      dtp:
        enabled: ${symbol_dollar}{DTP_ENABLED:true}
        app-name: ${symbol_dollar}{DTP_APP_NAME:${symbol_dollar}{spring.application.name}}
        instance-id: ${symbol_dollar}{DTP_INSTANCE_ID:${symbol_dollar}{INSTANCE_ID:${symbol_dollar}{HOSTNAME:local}}}
        registry:
          type: redis
          redis:
            host: ${symbol_dollar}{DTP_REDIS_HOST:${symbol_dollar}{SPRING_DATA_REDIS_HOST:127.0.0.1}}
            port: ${symbol_dollar}{DTP_REDIS_PORT:${symbol_dollar}{SPRING_DATA_REDIS_PORT:6379}}
            password: ${symbol_dollar}{DTP_REDIS_PASSWORD:${symbol_dollar}{SPRING_DATA_REDIS_PASSWORD:}}
        report:
          enabled: ${symbol_dollar}{DTP_REPORT_ENABLED:true}
          interval: ${symbol_dollar}{DTP_REPORT_INTERVAL:20s}
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    path: ${symbol_dollar}{LOG_HOME:./logs}
  group:
    web-stack: org.springframework.web,org.springframework.http,org.apache.catalina,org.apache.coyote
    persistence: org.mybatis,org.mybatis.spring,com.baomidou.mybatisplus,org.springframework.jdbc
    messaging: org.springframework.kafka,org.springframework.amqp
  level:
    root: info
    web-stack: info
    persistence: warn
    messaging: info
    ${groupId}: info
  logback:
    rollingpolicy:
      max-file-size: ${symbol_dollar}{LOG_MAX_FILE_SIZE:100MB}
      max-history: ${symbol_dollar}{LOG_MAX_HISTORY:30}
      total-size-cap: ${symbol_dollar}{LOG_TOTAL_SIZE_CAP:10GB}
      clean-history-on-start: ${symbol_dollar}{LOG_CLEAN_HISTORY_ON_START:false}

app:
  datasource:
    mode: ${symbol_dollar}{APP_DATASOURCE_MODE:SHARDING}
  logging:
    instance-name: ${symbol_dollar}{INSTANCE_ID:${symbol_dollar}{HOSTNAME:local}}
    error-total-size-cap: ${symbol_dollar}{LOG_ERROR_TOTAL_SIZE_CAP:2GB}
    async:
      queue-size: ${symbol_dollar}{LOG_ASYNC_QUEUE_SIZE:8192}
      discarding-threshold: ${symbol_dollar}{LOG_ASYNC_DISCARDING_THRESHOLD:0}
      never-block: ${symbol_dollar}{LOG_ASYNC_NEVER_BLOCK:false}
      max-flush-time: ${symbol_dollar}{LOG_ASYNC_MAX_FLUSH_TIME:5000}
  integrations:
    rabbitmq:
      enabled: false
      exchange: ${symbol_dollar}{spring.application.name}.domain
    redis:
      enabled: false
      ttl: 10m
    external-http:
      enabled: false
      user-base-url: http://localhost:18081
      teaching-base-url: http://localhost:18082
