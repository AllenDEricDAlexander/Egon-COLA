name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

services:
  application:
    image: ${IMAGE_NAME:?Set IMAGE_NAME}:${IMAGE_TAG:-local}
    stop_grace_period: ${STOP_GRACE_PERIOD:-40s}
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      args:
        CONTAINER_ENGINE: podman
    environment:
      APPLICATION_PORT: ${APPLICATION_PORT:-8080}
      SPRING_PROFILES_ACTIVE: dev
      APP_DATASOURCE_MODE: "SHARDING"
      SERVER_PORT: ${APPLICATION_PORT:-8080}
      RPC_PORT: ${RPC_PORT:-50051}
      LIGHT_SHARDING_MASTER_DATA_URL: jdbc:postgresql://postgres-master-data:5432/${POSTGRES_DB}
      LIGHT_SHARDING_SHARD_0_URL: jdbc:postgresql://postgres-shard-0:5432/${POSTGRES_DB}
      LIGHT_SHARDING_SHARD_1_URL: jdbc:postgresql://postgres-shard-1:5432/${POSTGRES_DB}
      LIGHT_SHARDING_USERNAME: ${POSTGRES_USER}
      LIGHT_SHARDING_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_ENABLED: "true"
      RABBITMQ_ENABLED: "true"
      EXTERNAL_HTTP_ENABLED: "false"
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL}
      TEACHING_SERVICE_BASE_URL: ${TEACHING_SERVICE_BASE_URL}
      RPC_ENABLED: "true"
      RPC_ADVERTISED_HOST: ${RPC_ADVERTISED_HOST:?Set RPC_ADVERTISED_HOST}
      DDC_ENABLED: "true"
      DDC_REGISTRY_ENABLED: "true"
      DDC_HTTP_REGISTRATION_ENABLED: "true"
      DDC_RPC_TARGET: ${DDC_RPC_TARGET:?Set DDC_RPC_TARGET}
      DDC_BIZ_CODE: ${DDC_BIZ_CODE:-student-management}
      DDC_APP_CODE: ${DDC_APP_CODE:-egon-cola-source-light}
      DDC_NAMESPACE: ${DDC_NAMESPACE:-default}
      DDC_REGISTRATION_RESOURCE_URI: ${DDC_REGISTRATION_RESOURCE_URI:?Set DDC_REGISTRATION_RESOURCE_URI}
      DDC_REDIS_HOST: ${DDC_REDIS_HOST:?Set DDC_REDIS_HOST}
      DDC_REDIS_PORT: ${DDC_REDIS_PORT:-6379}
      DDC_REDIS_PASSWORD: ${DDC_REDIS_PASSWORD}
      DDC_RUNTIME_ACCESS_KEY: ${DDC_RUNTIME_ACCESS_KEY}
      DDC_RUNTIME_SECRET_KEY: ${DDC_RUNTIME_SECRET_KEY}
      DDC_REGISTRY_ACCESS_KEY: ${DDC_REGISTRY_ACCESS_KEY}
      DDC_REGISTRY_SECRET_KEY: ${DDC_REGISTRY_SECRET_KEY}
      HTTP_ADVERTISED_HOST: ${HTTP_ADVERTISED_HOST:?Set HTTP_ADVERTISED_HOST}
      RPC_TLS_ENABLED: ${RPC_TLS_ENABLED}
      RPC_DEVELOPMENT_PLAINTEXT: ${RPC_DEVELOPMENT_PLAINTEXT}
      RPC_CERTIFICATE_CHAIN_PATH: ${RPC_CERTIFICATE_CHAIN_PATH}
      RPC_PRIVATE_KEY_PATH: ${RPC_PRIVATE_KEY_PATH}
      RPC_TRUST_CERTIFICATE_COLLECTION_PATH: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH}
      DDC_RPC_TLS_ENABLED: ${DDC_RPC_TLS_ENABLED}
      DDC_RPC_DEVELOPMENT_PLAINTEXT: ${DDC_RPC_DEVELOPMENT_PLAINTEXT}
      DDC_RPC_CERTIFICATE_CHAIN_PATH: ${DDC_RPC_CERTIFICATE_CHAIN_PATH}
      DDC_RPC_PRIVATE_KEY_PATH: ${DDC_RPC_PRIVATE_KEY_PATH}
      DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: ${DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH}
      IDP_ENABLED: "true"
      IDP_ISSUER: ${IDP_ISSUER}
      IDP_JWK_SET_URI: ${IDP_JWK_SET_URI}
      IDP_RESOURCE_SERVER_ID: ${IDP_RESOURCE_SERVER_ID}
      IDP_RESOURCE_URI: ${IDP_RESOURCE_URI}
      IDP_SERVICE_APP_ID: ${IDP_SERVICE_APP_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_PROVIDER: ddcregistration
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_CLIENTID: ${IDP_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_CLIENTSECRET: ${IDP_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_AUTHORIZATIONGRANTTYPE: client_credentials
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_CLIENTAUTHENTICATIONMETHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DDCREGISTRATION_TOKENURI: ${IDP_TOKEN_URI}
    ports:
      - "${APPLICATION_PORT:-8080}:${APPLICATION_PORT:-8080}"
      - "${RPC_PORT:-50051}:${RPC_PORT:-50051}"
    volumes:
      - application_logs:/app/logs
    depends_on:
      postgres-master-data:
        condition: service_healthy
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${APPLICATION_PORT}/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks: [application]

  postgres-master-data:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_MASTER_DATA_PORT:-5432}:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  postgres-shard-0:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_SHARD_0_PORT:-5433}:5432"
    volumes:
      - postgres_shard_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  postgres-shard-1:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_SHARD_1_PORT:-5434}:5432"
    volumes:
      - postgres_shard_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Set RABBITMQ_IMAGE}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks: [application]


networks:
  application:
    driver: bridge

volumes:
  application_logs:
  postgres_master_data:
  postgres_shard_0:
  postgres_shard_1:
  redis_data:
  rabbitmq_data:
