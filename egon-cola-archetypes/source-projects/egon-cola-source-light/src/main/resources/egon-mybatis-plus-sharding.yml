egon:
  cola:
    component:
      mybatis-plus:
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING}
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_MASTER_DATA_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_0_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_1_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
          tables:
            users:
              type: SINGLE
              data-source: master_data
            roles:
              type: SINGLE
              data-source: master_data
            permissions:
              type: SINGLE
              data-source: master_data
            user_roles:
              type: SINGLE
              data-source: master_data
            role_permissions:
              type: SINGLE
              data-source: master_data
            courses:
              type: SINGLE
              data-source: master_data
            school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            class_course_schedules:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
