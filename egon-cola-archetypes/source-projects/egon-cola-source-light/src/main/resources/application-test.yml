spring:
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    clean-disabled: false
    validate-on-migrate: true
    validate-migration-naming: true
management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

dubbo:
  provider:
    export: false

app:
  datasource:
    mode: ${APP_DATASOURCE_MODE:SHARDING}
  sharding:
    database-name: PUBLIC
    physical-data-sources:
      - name: master_data
        logical-name: master_data
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${LIGHT_SHARDING_MASTER_DATA_URL:jdbc:h2:mem:egon-cola-source-light-test-master-data;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${LIGHT_SHARDING_USERNAME:sa}
        password: "${LIGHT_SHARDING_PASSWORD:}"
      - name: shard_0
        logical-name: shard_0
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${LIGHT_SHARDING_SHARD_0_URL:jdbc:h2:mem:egon-cola-source-light-test-shard-0;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${LIGHT_SHARDING_USERNAME:sa}
        password: "${LIGHT_SHARDING_PASSWORD:}"
      - name: shard_1
        logical-name: shard_1
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${LIGHT_SHARDING_SHARD_1_URL:jdbc:h2:mem:egon-cola-source-light-test-shard-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${LIGHT_SHARDING_USERNAME:sa}
        password: "${LIGHT_SHARDING_PASSWORD:}"
    flyway:
      targets:
        - data-source-name: master_data
          locations:
            - classpath:db/migration/sharding/master-data
        - data-source-name: shard_0
          locations:
            - classpath:db/migration/sharding/shard
        - data-source-name: shard_1
          locations:
            - classpath:db/migration/sharding/shard
  integrations:
    rabbitmq:
      enabled: false
    redis:
      enabled: false
    external-http:
      enabled: false
