app:
  sharding-readwrite:
    config: classpath:sharding/shardingsphere-sharding-readwrite.yml
    physical-data-sources:
      - name: master_data_primary
        logical-name: master_data
        role: PRIMARY
        driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
        jdbc-url: ${LIGHT_MASTER_DATA_PRIMARY_URL}
        username: ${LIGHT_MASTER_DATA_PRIMARY_USERNAME}
        password: "${LIGHT_MASTER_DATA_PRIMARY_PASSWORD:}"
      - name: master_data_replica_0
        logical-name: master_data
        role: REPLICA
        driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
        jdbc-url: ${LIGHT_MASTER_DATA_REPLICA_0_URL}
        username: ${LIGHT_MASTER_DATA_REPLICA_0_USERNAME}
        password: "${LIGHT_MASTER_DATA_REPLICA_0_PASSWORD:}"
      - name: shard_0_primary
        logical-name: shard_0
        role: PRIMARY
        driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
        jdbc-url: ${LIGHT_SHARD_0_PRIMARY_URL}
        username: ${LIGHT_SHARD_0_PRIMARY_USERNAME}
        password: "${LIGHT_SHARD_0_PRIMARY_PASSWORD:}"
      - name: shard_0_replica_0
        logical-name: shard_0
        role: REPLICA
        driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
        jdbc-url: ${LIGHT_SHARD_0_REPLICA_0_URL}
        username: ${LIGHT_SHARD_0_REPLICA_0_USERNAME}
        password: "${LIGHT_SHARD_0_REPLICA_0_PASSWORD:}"
      - name: shard_1_primary
        logical-name: shard_1
        role: PRIMARY
        driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
        jdbc-url: ${LIGHT_SHARD_1_PRIMARY_URL}
        username: ${LIGHT_SHARD_1_PRIMARY_USERNAME}
        password: "${LIGHT_SHARD_1_PRIMARY_PASSWORD:}"
      - name: shard_1_replica_0
        logical-name: shard_1
        role: REPLICA
        driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
        jdbc-url: ${LIGHT_SHARD_1_REPLICA_0_URL}
        username: ${LIGHT_SHARD_1_REPLICA_0_USERNAME}
        password: "${LIGHT_SHARD_1_REPLICA_0_PASSWORD:}"
