spring:
  sql:
    init:
      mode: never

egon:
  cola:
    component:
      cache:
        enabled: false
        node-id: ""
        key-prefix: egon:cola:cache
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          expire: PT30M
          null-expire: PT60S
          jitter-ratio: 0.1
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/light_open_test_master_data
              username: test
              password: test
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/light_open_test_shard_0
              username: test
              password: test
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/light_open_test_shard_1
              username: test
              password: test
          tables:
            light_users:
              type: SINGLE
              data-source: master_data
            light_roles:
              type: SINGLE
              data-source: master_data
            light_permissions:
              type: SINGLE
              data-source: master_data
            light_user_roles:
              type: SINGLE
              data-source: master_data
            light_role_permissions:
              type: SINGLE
              data-source: master_data
            light_courses:
              type: SINGLE
              data-source: master_data
            light_school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            light_class_course_schedules:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
      dtp:
        enabled: false
        report:
          enabled: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

app:
  integrations:
    rabbitmq:
      enabled: false
    redis:
      enabled: false
    external-http:
      enabled: false

logging:
  level:
