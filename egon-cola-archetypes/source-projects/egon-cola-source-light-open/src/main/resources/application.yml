spring:
  profiles:
    default: dev
  sql:
    init:
      mode: never
  config:
    import:
      - classpath:egon-mybatis-plus-sharding.yml
      - optional:file:./config/application-secrets.yml
      - optional:configtree:/run/secrets/
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:false}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  task:
    execution:
      thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX:egon-async-}
      shutdown:
        await-termination: true
        await-termination-period: ${ASYNC_AWAIT_TERMINATION:30s}
      pool:
        core-size: ${ASYNC_CORE_SIZE:8}
        max-size: ${ASYNC_MAX_SIZE:32}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:1000}
        keep-alive: ${ASYNC_KEEP_ALIVE:60s}
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SCHEDULING_AWAIT_TERMINATION:30s}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20s}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
    max-http-form-post-size: ${TOMCAT_MAX_HTTP_FORM_POST_SIZE:2MB}
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE:2MB}
    processor-cache: ${TOMCAT_PROCESSOR_CACHE:200}
    mbeanregistry:
      enabled: ${TOMCAT_MBEAN_REGISTRY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      dtp:
        enabled: ${DTP_ENABLED:true}
        app-name: ${DTP_APP_NAME:${spring.application.name}}
        instance-id: ${DTP_INSTANCE_ID:${INSTANCE_ID:${HOSTNAME:local}}}
        registry:
          type: redis
          redis:
            host: ${DTP_REDIS_HOST:${SPRING_DATA_REDIS_HOST:127.0.0.1}}
            port: ${DTP_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
            password: ${DTP_REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
        report:
          enabled: ${DTP_REPORT_ENABLED:true}
          interval: ${DTP_REPORT_INTERVAL:20s}
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        data-change-recorder:
          enabled: false
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING}
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_MASTER_DATA_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_0_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_1_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
          tables:
            light_users:
              type: SINGLE
              data-source: master_data
            light_roles:
              type: SINGLE
              data-source: master_data
            light_permissions:
              type: SINGLE
              data-source: master_data
            light_user_roles:
              type: SINGLE
              data-source: master_data
            light_role_permissions:
              type: SINGLE
              data-source: master_data
            light_courses:
              type: SINGLE
              data-source: master_data
            light_school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            light_class_course_schedules:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
mybatis-plus:
  mapper-locations: classpath*:/mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    path: ${LOG_HOME:./logs}
  group:
    web-stack: org.springframework.web,org.springframework.http,org.apache.catalina,org.apache.coyote
    persistence: org.mybatis,org.mybatis.spring,com.baomidou.mybatisplus,org.springframework.jdbc
    messaging: org.springframework.kafka,org.springframework.amqp
  level:
    top.egon.cola.component.common.mybatis.interceptor.EgonColaDataChangeRecorderInnerInterceptor: 'OFF'
    top.egon.cola.component.common.mybatis.change-summary: INFO
    root: info
    web-stack: info
    persistence: warn
    messaging: info
    top.egon.internal.archetype.source: info
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:10GB}
      clean-history-on-start: ${LOG_CLEAN_HISTORY_ON_START:false}

app:
  logging:
    instance-name: ${INSTANCE_ID:${HOSTNAME:local}}
    error-total-size-cap: ${LOG_ERROR_TOTAL_SIZE_CAP:2GB}
    async:
      queue-size: ${LOG_ASYNC_QUEUE_SIZE:8192}
      discarding-threshold: ${LOG_ASYNC_DISCARDING_THRESHOLD:0}
      never-block: ${LOG_ASYNC_NEVER_BLOCK:false}
      max-flush-time: ${LOG_ASYNC_MAX_FLUSH_TIME:5000}
  integrations:
    rabbitmq:
      enabled: false
      exchange: ${spring.application.name}.domain
    redis:
      enabled: false
      ttl: 10m
    external-http:
      enabled: false
      user-base-url: http://localhost:18081
      teaching-base-url: http://localhost:18082
