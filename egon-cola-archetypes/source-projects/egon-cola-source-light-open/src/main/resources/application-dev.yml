spring:
  sql:
    init:
      mode: never

app:
  integrations:
    rabbitmq:
      enabled: ${RABBITMQ_ENABLED:true}
    redis:
      enabled: ${REDIS_ENABLED:true}
    external-http:
      enabled: ${EXTERNAL_HTTP_ENABLED:true}
      user-base-url: ${USER_SERVICE_BASE_URL:http://localhost:18081}
      teaching-base-url: ${TEACHING_SERVICE_BASE_URL:http://localhost:18082}

logging:
  level:
    top.egon.cola.component.common.mybatis.interceptor.EgonColaDataChangeRecorderInnerInterceptor: 'OFF'
    top.egon.cola.component.common.mybatis.change-summary: DEBUG

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        data-change-recorder:
          enabled: true
        illegal-sql:
          enabled: true
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING}
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_MASTER_DATA_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_0_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_1_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
          tables:
            light_users:
              type: SINGLE
              data-source: master_data
            light_roles:
              type: SINGLE
              data-source: master_data
            light_permissions:
              type: SINGLE
              data-source: master_data
            light_user_roles:
              type: SINGLE
              data-source: master_data
            light_role_permissions:
              type: SINGLE
              data-source: master_data
            light_courses:
              type: SINGLE
              data-source: master_data
            light_school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            light_class_course_schedules:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
