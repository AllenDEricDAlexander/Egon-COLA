spring:
  sql:
    init:
      mode: never

management:
  endpoint:
    health:
      show-details: never

app:
  integrations:
    rabbitmq:
      enabled: ${RABBITMQ_ENABLED:true}
    redis:
      enabled: ${REDIS_ENABLED:true}
    external-http:
      enabled: ${EXTERNAL_HTTP_ENABLED:true}
      user-base-url: ${USER_SERVICE_BASE_URL:http://localhost:18081}
      teaching-base-url: ${TEACHING_SERVICE_BASE_URL:http://localhost:18082}

logging:
  level:
    top.egon.cola.component.common.mybatis.interceptor.EgonColaDataChangeRecorderInnerInterceptor: 'OFF'
    top.egon.cola.component.common.mybatis.change-summary: INFO

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        data-change-recorder:
          enabled: false
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
