spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

organization:
  integrations:
    evaluation:
      enabled: ${EVALUATION_FACADE_ENABLED:true}
      biz-code: ${EVALUATION_FACADE_BIZ_CODE:student-management}
      app-code: ${EVALUATION_FACADE_APP_CODE:}
      course-group: ${EVALUATION_COURSE_FACADE_GROUP:course}
      exam-group: ${EVALUATION_EXAM_FACADE_GROUP:exam}
      score-group: ${EVALUATION_SCORE_FACADE_GROUP:score}
      version: ${EVALUATION_FACADE_SERVICE_VERSION:1.0}
      timeout-ms: ${EVALUATION_FACADE_TIMEOUT_MS:3000}
    redis:
      enabled: ${ORGANIZATION_REDIS_ENABLED:true}
    rabbit:
      enabled: ${ORGANIZATION_RABBIT_ENABLED:true}
  cache:
    user-ttl: ${ORGANIZATION_USER_CACHE_TTL:PT10M}
    grade-ttl: ${ORGANIZATION_GRADE_CACHE_TTL:PT30M}
    school-class-ttl: ${ORGANIZATION_SCHOOL_CLASS_CACHE_TTL:PT10M}
  command:
    idempotency-ttl: ${ORGANIZATION_IDEMPOTENCY_TTL:PT24H}

management:
  endpoint:
    health:
      show-details: never

egon:
  cola:
    component:
      rpc:
        enabled: ${RPC_ENABLED:true}
        identity:
          env: ${APP_ENV:prod}
          host: ${RPC_ADVERTISED_HOST:localhost}
          instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
        provider:
          enabled: ${RPC_ENABLED:true}
          port: ${RPC_PORT:50051}
          advertised-host: ${RPC_ADVERTISED_HOST:localhost}
          registration-fail-fast: true
        consumer:
          enabled: ${RPC_CONSUMER_ENABLED:true}
          default-timeout-ms: 3000
          max-retries: 0
        tls:
          enabled: ${RPC_TLS_ENABLED:true}
          development-plaintext: ${RPC_DEVELOPMENT_PLAINTEXT:false}
          certificate-chain-path: ${RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      ddc:
        enabled: ${DDC_ENABLED:true}
        biz-code: ${DDC_BIZ_CODE:student-management}
        app-code: ${DDC_APP_CODE:${spring.application.name}}
        env: ${APP_ENV:prod}
        namespace: ${DDC_NAMESPACE:default}
        registration-resource-uri: ${DDC_REGISTRATION_RESOURCE_URI:}
        redis:
          enabled: ${DDC_REDIS_ENABLED:true}
          host: ${DDC_REDIS_HOST:localhost}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        consistency:
          fail-fast: true
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:true}
          http:
            enabled: ${DDC_HTTP_REGISTRATION_ENABLED:true}
            env: ${APP_ENV:prod}
            namespace: ${DDC_NAMESPACE:default}
            instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
            service-name: ${spring.application.name}
            version: 1.0.0
            advertised-host: ${HTTP_ADVERTISED_HOST:localhost}
            port: ${server.port:8080}
            fail-fast: true
        rpc:
          target: ${DDC_RPC_TARGET:}
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:true}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
            certificate-chain-path: ${DDC_RPC_CERTIFICATE_CHAIN_PATH:}
            private-key-path: ${DDC_RPC_PRIVATE_KEY_PATH:}
            trust-certificate-collection-path: ${DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
          auth:
            enabled: ${DDC_RPC_AUTH_ENABLED:true}
            runtime:
              access-key: ${DDC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_REGISTRY_SECRET_KEY:}
      gateway:
        openapi:
          enabled: ${OPENAPI_GOVERNANCE_ENABLED:false}
          publish-to-ddc: ${OPENAPI_PUBLISH_TO_DDC:false}
    platform:
      idp:
        enabled: ${IDP_ENABLED:true}
        register-filter: false
        issuer: ${IDP_ISSUER:}
        jwk-set-uri: ${IDP_JWK_SET_URI:}
        resource-server-id: ${IDP_RESOURCE_SERVER_ID:}
        resource-uri: ${IDP_RESOURCE_URI:}
        service-client:
          app-id: ${IDP_SERVICE_APP_ID:}
          registration-id: ddcregistration
