spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    clean-disabled: false
    validate-on-migrate: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

organization:
  integrations:
    evaluation:
      enabled: false
      biz-code: ${EVALUATION_FACADE_BIZ_CODE:student-management}
      app-code: ${EVALUATION_FACADE_APP_CODE:}
      course-group: ${EVALUATION_COURSE_FACADE_GROUP:course}
      exam-group: ${EVALUATION_EXAM_FACADE_GROUP:exam}
      score-group: ${EVALUATION_SCORE_FACADE_GROUP:score}
      version: ${EVALUATION_FACADE_SERVICE_VERSION:1.0}
      timeout-ms: ${EVALUATION_FACADE_TIMEOUT_MS:3000}
    redis:
      enabled: false
    rabbit:
      enabled: false
  cache:
    user-ttl: PT10M
    grade-ttl: PT30M
    school-class-ttl: PT10M
  command:
    idempotency-ttl: PT24H

app:
  datasource:
    mode: ${APP_DATASOURCE_MODE:SHARDING}
  sharding:
    database-name: PUBLIC
    physical-data-sources:
      - name: master_data
        logical-name: master_data
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${ORGANIZATION_SHARDING_MASTER_DATA_URL:jdbc:h2:mem:egon-cola-source-web-test-master-data;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${ORGANIZATION_SHARDING_USERNAME:sa}
        password: "${ORGANIZATION_SHARDING_PASSWORD:}"
      - name: shard_0
        logical-name: shard_0
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${ORGANIZATION_SHARDING_SHARD_0_URL:jdbc:h2:mem:egon-cola-source-web-test-shard-0;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${ORGANIZATION_SHARDING_USERNAME:sa}
        password: "${ORGANIZATION_SHARDING_PASSWORD:}"
      - name: shard_1
        logical-name: shard_1
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${ORGANIZATION_SHARDING_SHARD_1_URL:jdbc:h2:mem:egon-cola-source-web-test-shard-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${ORGANIZATION_SHARDING_USERNAME:sa}
        password: "${ORGANIZATION_SHARDING_PASSWORD:}"
    flyway:
      targets:
        - data-source-name: master_data
          locations:
            - classpath:db/migration/sharding/master-data
        - data-source-name: shard_0
          locations:
            - classpath:db/migration/sharding/shard
        - data-source-name: shard_1
          locations:
            - classpath:db/migration/sharding/shard

egon:
  cola:
    component:
      rpc:
        enabled: false
        identity:
          env: ${APP_ENV:test}
          host: ${RPC_ADVERTISED_HOST:localhost}
          instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
        provider:
          enabled: false
          port: ${RPC_PORT:50051}
          advertised-host: ${RPC_ADVERTISED_HOST:localhost}
          registration-fail-fast: true
        consumer:
          enabled: false
          default-timeout-ms: 3000
          max-retries: 0
        tls:
          enabled: false
          development-plaintext: true
          certificate-chain-path: ${RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      tianshu:
        enabled: false
        biz-code: ${TIANSHU_BIZ_CODE:student-management}
        app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
        env: ${APP_ENV:test}
        namespace: ${TIANSHU_NAMESPACE:default}
        registration-resource-uri: ${TIANSHU_REGISTRATION_RESOURCE_URI:}
        redis:
          enabled: false
          host: ${TIANSHU_REDIS_HOST:localhost}
          port: ${TIANSHU_REDIS_PORT:6379}
          password: ${TIANSHU_REDIS_PASSWORD:}
          database: ${TIANSHU_REDIS_DATABASE:0}
        consistency:
          fail-fast: true
        registry:
          enabled: false
          http:
            enabled: false
            env: ${APP_ENV:test}
            namespace: ${TIANSHU_NAMESPACE:default}
            instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
            service-name: ${spring.application.name}
            version: 1.0.0
            advertised-host: ${HTTP_ADVERTISED_HOST:localhost}
            port: ${server.port:8080}
            fail-fast: true
        rpc:
          target: ${TIANSHU_RPC_TARGET:}
          tls:
            enabled: false
            development-plaintext: true
            certificate-chain-path: ${TIANSHU_RPC_CERTIFICATE_CHAIN_PATH:}
            private-key-path: ${TIANSHU_RPC_PRIVATE_KEY_PATH:}
            trust-certificate-collection-path: ${TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
          auth:
            enabled: false
            runtime:
              access-key: ${TIANSHU_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_REGISTRY_SECRET_KEY:}
      yuheng:
        openapi:
          enabled: false
          publish-to-tianshu: false
    platform:
      tianquan-shoubing:
        enabled: false
        register-filter: false
        issuer: ${TIANQUAN_SHOUBING_ISSUER:}
        jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
        resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
        resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
        service-client:
          app-id: ${TIANQUAN_SHOUBING_SERVICE_APP_ID:}
          registration-id: tianshuregistration
