spring:
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          tianshuregistration:
            provider: native-control
            client-id: ${NATIVE_CONTROL_CLIENT_ID:}
            client-secret: ${NATIVE_CONTROL_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_CONTROL_SCOPES:}
          native-tenant-one:
            provider: native-tenant-one
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
          native-tenant-two:
            provider: native-tenant-two
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
        provider:
          native-control:
            token-uri: ${NATIVE_CONTROL_TOKEN_URI:}
          native-tenant-one:
            token-uri: ${NATIVE_TENANT_ONE_TOKEN_URI:}
          native-tenant-two:
            token-uri: ${NATIVE_TENANT_TWO_TOKEN_URI:}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

organization:
  integrations:
    evaluation:
      enabled: false
      biz-code: ${EVALUATION_FACADE_BIZ_CODE:student-management}
      app-code: ${EVALUATION_FACADE_APP_CODE:}
      course-group: ${EVALUATION_COURSE_FACADE_GROUP:course}
      exam-group: ${EVALUATION_EXAM_FACADE_GROUP:exam}
      score-group: ${EVALUATION_SCORE_FACADE_GROUP:score}
      version: ${EVALUATION_FACADE_SERVICE_VERSION:1.0.0}
      timeout-ms: ${EVALUATION_FACADE_TIMEOUT_MS:3000}
      application-namespace: ${EVALUATION_APPLICATION_NAMESPACE:fixture-evaluation}
    redis:
      enabled: false
    rabbit:
      enabled: false
  cache:
    user-ttl: PT10M
    grade-ttl: PT30M
    school-class-ttl: PT10M
  command:
    idempotency-ttl: PT24H

app:

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
      cache:
        enabled: false
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/organization_test_master_data
              username: test
              password: test
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/organization_test_shard_0
              username: test
              password: test
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/organization_test_shard_1
              username: test
              password: test
          tables:
            users:
              type: SINGLE
              data-source: master_data
            roles:
              type: SINGLE
              data-source: master_data
            permissions:
              type: SINGLE
              data-source: master_data
            user_roles:
              type: SINGLE
              data-source: master_data
            role_permissions:
              type: SINGLE
              data-source: master_data
            grades:
              type: SINGLE
              data-source: master_data
            school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            school_class_users:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
      rpc:
        enabled: false
        identity:
          env: ${APP_ENV:test}
          host: ${RPC_ADVERTISED_HOST:localhost}
          instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
        provider:
          enabled: false
          port: ${RPC_PORT:50051}
          advertised-host: ${RPC_ADVERTISED_HOST:localhost}
          registration-fail-fast: true
        consumer:
          enabled: false
          default-timeout-ms: 3000
          max-retries: 0
        tls:
          enabled: false
          development-plaintext: true
          certificate-chain-path: ${RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        enabled: false
        biz-code: ${TIANSHU_BIZ_CODE:student-management}
        app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
        env: ${APP_ENV:test}
        namespace: ${TIANSHU_NAMESPACE:default}
        registration-resource-uri: ${TIANSHU_REGISTRATION_RESOURCE_URI:}
        redis:
          username: ${TIANSHU_REDIS_USERNAME:}
          enabled: false
          host: ${TIANSHU_REDIS_HOST:localhost}
          port: ${TIANSHU_REDIS_PORT:6379}
          password: ${TIANSHU_REDIS_PASSWORD:}
          database: ${TIANSHU_REDIS_DATABASE:0}
        consistency:
          fail-fast: true
        registry:
          enabled: false
          http:
            enabled: false
            env: ${APP_ENV:test}
            namespace: ${TIANSHU_NAMESPACE:default}
            instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
            service-name: ${spring.application.name}
            version: 1.0.0
            advertised-host: ${HTTP_ADVERTISED_HOST:localhost}
            port: ${server.port:8080}
            fail-fast: true
        rpc:
          target: ${TIANSHU_RPC_TARGET:}
          tls:
            enabled: false
            development-plaintext: true
            certificate-chain-path: ${TIANSHU_RPC_CERTIFICATE_CHAIN_PATH:}
            private-key-path: ${TIANSHU_RPC_PRIVATE_KEY_PATH:}
            trust-certificate-collection-path: ${TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
          auth:
            enabled: false
            runtime:
              access-key: ${TIANSHU_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_REGISTRY_SECRET_KEY:}
      yuheng:
        openapi:
          enabled: false
          publish-to-tianshu: false
    platform:
      tianquan:
        shoubing:
          enabled: false
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_ISSUER:}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
          resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
          clock-skew: PT30S
          trusted-issuers:
            tenant-one:
              issuer: ${NATIVE_TENANT_ONE_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_ONE_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_ONE_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_ONE_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_ONE_TRUST_VERSION:1}
            tenant-two:
              issuer: ${NATIVE_TENANT_TWO_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_TWO_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_TWO_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_TWO_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_TWO_TRUST_VERSION:1}
          revocation:
            mode: STRICT_SHARED
            primary-endpoint: ${OAUTH_REVOCATION_PRIMARY_ENDPOINT:}
            timeout: PT0.5S
            epoch: ${OAUTH_REVOCATION_EPOCH:}
          jwks-cache:
            ttl: PT300S
            max-issuers: 1000
            connect-timeout: PT2S
            read-timeout: PT5S
          usage-observation:
            enabled: false
            receiver: APPLICATION
            fallback-issuer: ${TIANQUAN_SHOUBING_ISSUER:}
            allow-local-plaintext: false
          audit:
            stream: egon:oauth:audit:v1
            spool-directory: ${NATIVE_OAUTH_AUDIT_SPOOL_DIRECTORY:}
            spool-max-bytes: 1073741824
            hmac-key-file: ${NATIVE_OAUTH_AUDIT_HMAC_KEY_FILE:}
            replay-initial-delay: 5000
            replay-delay: 5000
            delivery:
              receipt-ttl: PT1H
              confirmation-timeout: PT30S
              batch-size: 100
          service-client:
            app-id: egon-cola-source-web
            registration-id: tianshuregistration
            credential-versions:
              tianshuregistration: ${NATIVE_CONTROL_CREDENTIAL_VERSION:1}
              native-tenant-one: ${NATIVE_TENANT_ONE_CREDENTIAL_VERSION:1}
              native-tenant-two: ${NATIVE_TENANT_TWO_CREDENTIAL_VERSION:1}
            # Deployment manifest supplies exact positive tenant IDs; there is no default tenant selection.
            tenant-registration-ids: {}
            renewal-skew: PT60S
          rpc:
            enabled: false
            consumer:
              enabled: false
              bindings:
                evaluation-course-read:
                  service-name: top.egon.cola.evaluation.facade.rpc.v1.CourseService
                  group: ${organization.integrations.evaluation.course-group}
                  version: ${organization.integrations.evaluation.version}
                  full-method-name: top.egon.cola.evaluation.facade.rpc.v1.CourseService/GetCourse
                  process-identity:
                    "[applicationName]": ${spring.application.name}
                    "[env]": ${APP_ENV:dev}
                  mode: SERVICE
                  app-id: egon-cola-source-web
                  resource-uri: ${EVALUATION_RESOURCE_URI:https://evaluation.example.test}
                  scope-context: TENANT
                  tenant-registration-ids:
                    "[1001]": native-tenant-one
                    "[1002]": native-tenant-two
                  scopes: ["${organization.integrations.evaluation.application-namespace}:course:read"]
                evaluation-exam-read:
                  service-name: top.egon.cola.evaluation.facade.rpc.v1.ExamService
                  group: ${organization.integrations.evaluation.exam-group}
                  version: ${organization.integrations.evaluation.version}
                  full-method-name: top.egon.cola.evaluation.facade.rpc.v1.ExamService/GetExam
                  process-identity:
                    "[applicationName]": ${spring.application.name}
                    "[env]": ${APP_ENV:dev}
                  mode: SERVICE
                  app-id: egon-cola-source-web
                  resource-uri: ${EVALUATION_RESOURCE_URI:https://evaluation.example.test}
                  scope-context: TENANT
                  tenant-registration-ids:
                    "[1001]": native-tenant-one
                    "[1002]": native-tenant-two
                  scopes: ["${organization.integrations.evaluation.application-namespace}:exam:read"]
                evaluation-score-read:
                  service-name: top.egon.cola.evaluation.facade.rpc.v1.ScoreService
                  group: ${organization.integrations.evaluation.score-group}
                  version: ${organization.integrations.evaluation.version}
                  full-method-name: top.egon.cola.evaluation.facade.rpc.v1.ScoreService/GetScore
                  process-identity:
                    "[applicationName]": ${spring.application.name}
                    "[env]": ${APP_ENV:dev}
                  mode: SERVICE
                  app-id: egon-cola-source-web
                  resource-uri: ${EVALUATION_RESOURCE_URI:https://evaluation.example.test}
                  scope-context: TENANT
                  tenant-registration-ids:
                    "[1001]": native-tenant-one
                    "[1002]": native-tenant-two
                  scopes: ["${organization.integrations.evaluation.application-namespace}:score:read"]
            provider:
              enabled: false
              methods:
                "[top.egon.cola.organization.facade.rpc.v1.UserService/CreateUser]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:user:create"]
                "[top.egon.cola.organization.facade.rpc.v1.UserService/GetUser]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:user:read"]
                "[top.egon.cola.organization.facade.rpc.v1.RoleService/AssignRole]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:role:assign"]
                "[top.egon.cola.organization.facade.rpc.v1.PermissionService/GrantPermission]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:permission:grant"]
                "[top.egon.cola.organization.facade.rpc.v1.PermissionService/GetPermissionTree]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:permission:read"]
                "[top.egon.cola.organization.facade.rpc.v1.GradeService/CreateGrade]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:grade:create"]
                "[top.egon.cola.organization.facade.rpc.v1.GradeService/GetGrade]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:grade:read"]
                "[top.egon.cola.organization.facade.rpc.v1.SchoolClassService/CreateSchoolClass]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:school-class:create"]
                "[top.egon.cola.organization.facade.rpc.v1.SchoolClassService/GetSchoolClass]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:school-class:read"]
                "[top.egon.cola.organization.facade.rpc.v1.SchoolClassService/AssignUser]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
                  required-scopes: ["egon-cola-source-web:school-class:assign-user"]
        jianshen:
          enabled: false
          register-filter: false
          system-code: egon-cola-source-web
          user-scope-policy:
            enabled: true
            permission-scopes:
              "[egon-cola-source-web:user:create]": ["egon-cola-source-web:user:create"]
              "[egon-cola-source-web:user:read]": ["egon-cola-source-web:user:read"]
              "[egon-cola-source-web:role:assign]": ["egon-cola-source-web:role:assign"]
              "[egon-cola-source-web:permission:grant]": ["egon-cola-source-web:permission:grant"]
              "[egon-cola-source-web:permission:read]": ["egon-cola-source-web:permission:read"]
              "[egon-cola-source-web:grade:create]": ["egon-cola-source-web:grade:create"]
              "[egon-cola-source-web:grade:read]": ["egon-cola-source-web:grade:read"]
              "[egon-cola-source-web:school-class:create]": ["egon-cola-source-web:school-class:create"]
              "[egon-cola-source-web:school-class:read]": ["egon-cola-source-web:school-class:read"]
              "[egon-cola-source-web:school-class:assign-user]": ["egon-cola-source-web:school-class:assign-user"]
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:}
            cache-ttl: PT5M
            maximum-jitter: PT30S
            near-cache-ttl: PT5S
            fetch-timeout: PT1S
            service-token:
              enabled: true
              resource-uri: ${TIANQUAN_JIANSHEN_RESOURCE_URI:}
              scopes: service:authorization:snapshot
              renewal-skew: PT60S
          runtime:
            redis-enabled: false
            redis-address: ${RBAC3_RUNTIME_REDIS_ADDRESS:}
            database: ${RBAC3_RUNTIME_REDIS_DATABASE:0}
            password-file: ${RBAC3_RUNTIME_REDIS_PASSWORD_FILE:}
            timeout: PT2S
logging:
  level:

server:
  ssl:
    enabled: ${NATIVE_TLS_ENABLED:true}
    key-store: ${NATIVE_TLS_KEY_STORE:}
    key-store-password: ${NATIVE_TLS_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
