syntax = "proto3";

package egon.organization.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "top.egon.cola.archetype.source.webopen.facade.organization.v1";

service GradeService {
  rpc CreateGrade(CreateGradeRequest) returns (Grade);
  rpc GetGrade(GetGradeRequest) returns (Grade);
}

service SchoolClassService {
  rpc CreateSchoolClass(CreateSchoolClassRequest) returns (SchoolClass);
  rpc GetSchoolClass(GetSchoolClassRequest) returns (SchoolClass);
  rpc AssignUser(AssignUserRequest) returns (google.protobuf.Empty);
}

message CreateGradeRequest {
  string code = 1;
  string name = 2;
}

message GetGradeRequest {
  int64 grade_id = 1;
}

message CreateSchoolClassRequest {
  string name = 1;
  string grade_code = 2;
}

message GetSchoolClassRequest {
  int64 grade_id = 1;
  int64 school_class_id = 2;
}

message AssignUserRequest {
  int64 grade_id = 1;
  int64 user_id = 2;
  int64 school_class_id = 3;
}

message Grade {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string status = 4;
}

message SchoolClass {
  int64 id = 1;
  string name = 2;
  string grade_code = 3;
  string grade_name = 4;
  string status = 5;
  repeated int64 user_ids = 6;
}
