syntax = "proto3";

package egon.evaluation.v1;

option java_multiple_files = true;
option java_package = "top.egon.cola.archetype.source.webopen.facade.evaluation.v1";

service ScoreService {
  rpc RecordScore(RecordScoreRequest) returns (Score);
  rpc GetScore(GetScoreRequest) returns (Score);
  rpc PageScores(PageScoresRequest) returns (PageScoreResponse);
}

message RecordScoreRequest {
  int64 exam_id = 1;
  int64 student_id = 2;
  int32 points = 3;
}

message GetScoreRequest {
  int64 exam_id = 1;
  int64 score_id = 2;
}

message PageScoresRequest {
  int64 exam_id = 1;
  int32 current_page = 2;
  int32 page_size = 3;
}

message Score {
  int64 id = 1;
  int64 exam_id = 2;
  int64 course_id = 3;
  int64 student_id = 4;
  int32 points = 5;
  string status = 6;
}

message PageScoreResponse {
  repeated Score records = 1;
  int32 current_page = 2;
  int32 total_pages = 3;
  int32 page_size = 4;
  int64 total_count = 5;
}
