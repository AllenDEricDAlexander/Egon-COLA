spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

dubbo:
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:50051}

organization:
  integrations:
    evaluation:
      enabled: ${EVALUATION_FACADE_ENABLED:true}
      course-group: ${EVALUATION_COURSE_FACADE_GROUP:course}
      exam-group: ${EVALUATION_EXAM_FACADE_GROUP:exam}
      score-group: ${EVALUATION_SCORE_FACADE_GROUP:score}
      version: ${EVALUATION_FACADE_SERVICE_VERSION:1.0.0}
      grpc-target: ${EVALUATION_GRPC_TARGET:localhost:50051}
      grpc-deadline: ${EVALUATION_GRPC_DEADLINE:PT3S}
    redis:
      enabled: ${ORGANIZATION_REDIS_ENABLED:true}
    rabbit:
      enabled: ${ORGANIZATION_RABBIT_ENABLED:true}
  cache:
    user-ttl: ${ORGANIZATION_USER_CACHE_TTL:PT10M}
    grade-ttl: ${ORGANIZATION_GRADE_CACHE_TTL:PT30M}
    school-class-ttl: ${ORGANIZATION_SCHOOL_CLASS_CACHE_TTL:PT10M}
  command:
    idempotency-ttl: ${ORGANIZATION_IDEMPOTENCY_TTL:PT24H}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    top.egon.cola.component.common.mybatis.interceptor.EgonColaDataChangeRecorderInnerInterceptor: 'OFF'
    top.egon.cola.component.common.mybatis.change-summary: INFO

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        data-change-recorder:
          enabled: false
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
