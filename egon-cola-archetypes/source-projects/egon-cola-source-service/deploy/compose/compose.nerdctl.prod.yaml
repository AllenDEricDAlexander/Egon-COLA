name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  application:
    image: ${REGISTRY:?Set REGISTRY}/${REGISTRY_NAMESPACE:?Set REGISTRY_NAMESPACE}/${IMAGE_NAME:?Set IMAGE_NAME}:${IMAGE_TAG:?Set IMAGE_TAG}
    stop_grace_period: ${STOP_GRACE_PERIOD:-40s}
    environment:
      APPLICATION_PORT: ${APPLICATION_PORT:-8081}
      SPRING_PROFILES_ACTIVE: prod
      APP_DATASOURCE_MODE: "SHARDING"
      MANAGEMENT_SERVER_PORT: ${APPLICATION_PORT:-8081}
      RPC_PORT: ${RPC_PORT:-50051}
      EVALUATION_SHARDING_MASTER_DATA_URL: jdbc:postgresql://postgres-master-data:5432/${POSTGRES_DB}
      EVALUATION_SHARDING_SHARD_0_URL: jdbc:postgresql://postgres-shard-0:5432/${POSTGRES_DB}
      EVALUATION_SHARDING_SHARD_1_URL: jdbc:postgresql://postgres-shard-1:5432/${POSTGRES_DB}
      EVALUATION_SHARDING_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      EVALUATION_SHARDING_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_LISTENER_AUTO_STARTUP: "true"
      ORGANIZATION_FACADE_ENABLED: "${ORGANIZATION_FACADE_ENABLED:?Set ORGANIZATION_FACADE_ENABLED to true or false}"
      RPC_ENABLED: "true"
      RPC_ADVERTISED_HOST: ${RPC_ADVERTISED_HOST:?Set RPC_ADVERTISED_HOST}
      DDC_ENABLED: "true"
      DDC_REGISTRY_ENABLED: "true"
      DDC_HTTP_REGISTRATION_ENABLED: "true"
      DDC_RPC_TARGET: ${DDC_RPC_TARGET:?Set DDC_RPC_TARGET}
      DDC_BIZ_CODE: ${DDC_BIZ_CODE:-student-management}
      DDC_APP_CODE: ${DDC_APP_CODE:-egon-cola-source-service}
      DDC_NAMESPACE: ${DDC_NAMESPACE:-default}
      DDC_REGISTRATION_RESOURCE_URI: ${DDC_REGISTRATION_RESOURCE_URI:?Set DDC_REGISTRATION_RESOURCE_URI}
      DDC_REDIS_HOST: ${DDC_REDIS_HOST:?Set DDC_REDIS_HOST}
      DDC_REDIS_PORT: ${DDC_REDIS_PORT:-6379}
      DDC_REDIS_PASSWORD: ${DDC_REDIS_PASSWORD}
      DDC_RUNTIME_ACCESS_KEY: ${DDC_RUNTIME_ACCESS_KEY}
      DDC_RUNTIME_SECRET_KEY: ${DDC_RUNTIME_SECRET_KEY}
      DDC_REGISTRY_ACCESS_KEY: ${DDC_REGISTRY_ACCESS_KEY}
      DDC_REGISTRY_SECRET_KEY: ${DDC_REGISTRY_SECRET_KEY}
      HTTP_ADVERTISED_HOST: ${HTTP_ADVERTISED_HOST:?Set HTTP_ADVERTISED_HOST}
      RPC_TLS_ENABLED: ${RPC_TLS_ENABLED}
      RPC_DEVELOPMENT_PLAINTEXT: ${RPC_DEVELOPMENT_PLAINTEXT}
      RPC_CERTIFICATE_CHAIN_PATH: ${RPC_CERTIFICATE_CHAIN_PATH}
      RPC_PRIVATE_KEY_PATH: ${RPC_PRIVATE_KEY_PATH}
      RPC_TRUST_CERTIFICATE_COLLECTION_PATH: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH}
      DDC_RPC_TLS_ENABLED: ${DDC_RPC_TLS_ENABLED}
      DDC_RPC_DEVELOPMENT_PLAINTEXT: ${DDC_RPC_DEVELOPMENT_PLAINTEXT}
      DDC_RPC_CERTIFICATE_CHAIN_PATH: ${DDC_RPC_CERTIFICATE_CHAIN_PATH}
      DDC_RPC_PRIVATE_KEY_PATH: ${DDC_RPC_PRIVATE_KEY_PATH}
      DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: ${DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH}
      IDP_ENABLED: "true"
      IDP_ISSUER: ${IDP_ISSUER}
      IDP_JWK_SET_URI: ${IDP_JWK_SET_URI}
      IDP_RESOURCE_SERVER_ID: ${IDP_RESOURCE_SERVER_ID}
      IDP_RESOURCE_URI: ${IDP_RESOURCE_URI}
      IDP_SERVICE_APP_ID: ${IDP_SERVICE_APP_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_PROVIDER: ddcregistration
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_CLIENTID: ${IDP_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_CLIENTSECRET: ${IDP_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_AUTHORIZATIONGRANTTYPE: client_credentials
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DDCREGISTRATION_CLIENTAUTHENTICATIONMETHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DDCREGISTRATION_TOKENURI: ${IDP_TOKEN_URI}
      RPC_CONSUMER_ENABLED: "true"
      ORGANIZATION_FACADE_BIZ_CODE: ${ORGANIZATION_FACADE_BIZ_CODE:-student-management}
      ORGANIZATION_FACADE_APP_CODE: ${ORGANIZATION_FACADE_APP_CODE:?Set ORGANIZATION_FACADE_APP_CODE}
      ORGANIZATION_FACADE_SERVICE_VERSION: ${ORGANIZATION_FACADE_SERVICE_VERSION:-1.0}
      ORGANIZATION_FACADE_TIMEOUT_MS: ${ORGANIZATION_FACADE_TIMEOUT_MS:-3000}
      ORGANIZATION_FACADE_GROUP: ${ORGANIZATION_FACADE_GROUP:-student-management-organization}
    ports:
      - "${APPLICATION_PORT:-8081}:${APPLICATION_PORT:-8081}"
      - "${RPC_PORT:-50051}:${RPC_PORT:-50051}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - application_logs:/app/logs
    depends_on:
      postgres-master-data:
        condition: service_healthy
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${APPLICATION_PORT}/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    cpus: "${APP_CPUS:-1.0}"
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  postgres-master-data:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  postgres-shard-0:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_shard_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  postgres-shard-1:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_shard_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Set RABBITMQ_IMAGE}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [application]


networks:
  application:
    driver: bridge

volumes:
  application_logs:
  postgres_master_data:
  postgres_shard_0:
  postgres_shard_1:
  redis_data:
  rabbitmq_data:
