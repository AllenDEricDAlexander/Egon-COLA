name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

services:
  application:
    image: ${IMAGE_NAME:?Set IMAGE_NAME}:${IMAGE_TAG:-local}
    stop_grace_period: ${STOP_GRACE_PERIOD:-40s}
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      args:
        CONTAINER_ENGINE: podman
    environment:
      APPLICATION_PORT: ${APPLICATION_PORT:-8081}
      SPRING_PROFILES_ACTIVE: dev
      APP_DATASOURCE_MODE: "SHARDING"
      MANAGEMENT_SERVER_PORT: ${APPLICATION_PORT:-8081}
      RPC_PORT: ${RPC_PORT:-50051}
      EVALUATION_SHARDING_MASTER_DATA_URL: jdbc:postgresql://postgres-master-data:5432/${POSTGRES_DB}
      EVALUATION_SHARDING_SHARD_0_URL: jdbc:postgresql://postgres-shard-0:5432/${POSTGRES_DB}
      EVALUATION_SHARDING_SHARD_1_URL: jdbc:postgresql://postgres-shard-1:5432/${POSTGRES_DB}
      EVALUATION_SHARDING_USERNAME: ${POSTGRES_USER}
      EVALUATION_SHARDING_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_LISTENER_AUTO_STARTUP: "true"
      ORGANIZATION_FACADE_ENABLED: "false"
      RPC_ENABLED: "true"
      RPC_ADVERTISED_HOST: ${RPC_ADVERTISED_HOST:?Set RPC_ADVERTISED_HOST}
      TIANSHU_ENABLED: "true"
      TIANSHU_REGISTRY_ENABLED: "true"
      TIANSHU_HTTP_REGISTRATION_ENABLED: "true"
      TIANSHU_RPC_TARGET: ${TIANSHU_RPC_TARGET:?Set TIANSHU_RPC_TARGET}
      TIANSHU_BIZ_CODE: ${TIANSHU_BIZ_CODE:-student-management}
      TIANSHU_APP_CODE: ${TIANSHU_APP_CODE:?Set TIANSHU_APP_CODE}
      TIANSHU_NAMESPACE: ${TIANSHU_NAMESPACE:-default}
      TIANSHU_REGISTRATION_RESOURCE_URI: ${TIANSHU_REGISTRATION_RESOURCE_URI:?Set TIANSHU_REGISTRATION_RESOURCE_URI}
      TIANSHU_REDIS_HOST: ${TIANSHU_REDIS_HOST:?Set TIANSHU_REDIS_HOST}
      TIANSHU_REDIS_PORT: ${TIANSHU_REDIS_PORT:-6379}
      TIANSHU_REDIS_PASSWORD: ${TIANSHU_REDIS_PASSWORD}
      TIANSHU_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      TIANSHU_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      TIANSHU_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      TIANSHU_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      HTTP_ADVERTISED_HOST: ${HTTP_ADVERTISED_HOST:?Set HTTP_ADVERTISED_HOST}
      RPC_TLS_ENABLED: ${RPC_TLS_ENABLED}
      RPC_DEVELOPMENT_PLAINTEXT: ${RPC_DEVELOPMENT_PLAINTEXT}
      RPC_CERTIFICATE_CHAIN_PATH: ${RPC_CERTIFICATE_CHAIN_PATH}
      RPC_PRIVATE_KEY_PATH: ${RPC_PRIVATE_KEY_PATH}
      RPC_TRUST_CERTIFICATE_COLLECTION_PATH: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH}
      TIANSHU_RPC_TLS_ENABLED: ${TIANSHU_RPC_TLS_ENABLED}
      TIANSHU_RPC_DEVELOPMENT_PLAINTEXT: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT}
      TIANSHU_RPC_CERTIFICATE_CHAIN_PATH: ${TIANSHU_RPC_CERTIFICATE_CHAIN_PATH}
      TIANSHU_RPC_PRIVATE_KEY_PATH: ${TIANSHU_RPC_PRIVATE_KEY_PATH}
      TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: ${TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH}
      TIANQUAN_SHOUBING_ENABLED: "true"
      TIANQUAN_SHOUBING_ISSUER: ${TIANQUAN_SHOUBING_ISSUER}
      TIANQUAN_SHOUBING_JWK_SET_URI: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      TIANQUAN_SHOUBING_RESOURCE_SERVER_ID: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID}
      TIANQUAN_SHOUBING_RESOURCE_URI: ${TIANQUAN_SHOUBING_RESOURCE_URI}
      TIANQUAN_SHOUBING_SERVICE_APP_ID: ${TIANQUAN_SHOUBING_SERVICE_APP_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIANSHUREGISTRATION_PROVIDER: tianshuregistration
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIANSHUREGISTRATION_CLIENTID: ${TIANQUAN_SHOUBING_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIANSHUREGISTRATION_CLIENTSECRET: ${TIANQUAN_SHOUBING_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIANSHUREGISTRATION_AUTHORIZATIONGRANTTYPE: client_credentials
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIANSHUREGISTRATION_CLIENTAUTHENTICATIONMETHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_TIANSHUREGISTRATION_TOKENURI: ${TIANQUAN_SHOUBING_TOKEN_URI}
      RPC_CONSUMER_ENABLED: "true"
      ORGANIZATION_FACADE_BIZ_CODE: ${ORGANIZATION_FACADE_BIZ_CODE:-student-management}
      ORGANIZATION_FACADE_APP_CODE: ${ORGANIZATION_FACADE_APP_CODE:?Set ORGANIZATION_FACADE_APP_CODE}
      ORGANIZATION_FACADE_SERVICE_VERSION: ${ORGANIZATION_FACADE_SERVICE_VERSION:-1.0}
      ORGANIZATION_FACADE_TIMEOUT_MS: ${ORGANIZATION_FACADE_TIMEOUT_MS:-3000}
      ORGANIZATION_FACADE_GROUP: ${ORGANIZATION_FACADE_GROUP:-student-management-organization}
    ports:
      - "${APPLICATION_PORT:-8081}:${APPLICATION_PORT:-8081}"
      - "${RPC_PORT:-50051}:${RPC_PORT:-50051}"
    volumes:
      - application_logs:/app/logs
    depends_on:
      postgres-master-data:
        condition: service_healthy
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${APPLICATION_PORT}/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks: [application]

  postgres-master-data:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_MASTER_DATA_PORT:-5432}:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  postgres-shard-0:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_SHARD_0_PORT:-5433}:5432"
    volumes:
      - postgres_shard_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  postgres-shard-1:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_SHARD_1_PORT:-5434}:5432"
    volumes:
      - postgres_shard_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [application]

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Set RABBITMQ_IMAGE}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks: [application]


networks:
  application:
    driver: bridge

volumes:
  application_logs:
  postgres_master_data:
  postgres_shard_0:
  postgres_shard_1:
  redis_data:
  rabbitmq_data:
