spring:
  cloud:
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    nacos:
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD:ENC(v1:replace-with-base64-iv:replace-with-base64-ciphertext:replace-with-base64-tag)}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_CONFIG_GROUP:PROD_GROUP}
        refresh-enabled: ${NACOS_CONFIG_REFRESH_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_DISCOVERY_GROUP:PROD_GROUP}

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://${NACOS_SERVER_ADDR}}
