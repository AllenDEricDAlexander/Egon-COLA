syntax = "proto3";

package egon.evaluation.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "top.egon.cola.archetype.source.serviceopen.facade.evaluation.v1";

service CourseService {
  rpc CreateCourse(CreateCourseRequest) returns (Course);
  rpc ScheduleCourse(ScheduleCourseRequest) returns (CourseSchedule);
  rpc GetCourse(GetCourseRequest) returns (Course);
  rpc PageCourses(PageCoursesRequest) returns (PageCourseResponse);
}

message CreateCourseRequest {
  string code = 1;
  string name = 2;
  int32 credit = 3;
}

message ScheduleCourseRequest {
  int64 course_id = 1;
  int64 class_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
}

message GetCourseRequest {
  int64 course_id = 1;
}

message PageCoursesRequest {
  int32 current_page = 1;
  int32 page_size = 2;
}

message Course {
  int64 id = 1;
  string code = 2;
  string name = 3;
  int32 credit = 4;
  string status = 5;
}

message CourseSchedule {
  int64 id = 1;
  int64 course_id = 2;
  int64 class_id = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  string status = 6;
}

message PageCourseResponse {
  repeated Course records = 1;
  int32 current_page = 2;
  int32 total_pages = 3;
  int32 page_size = 4;
  int64 total_count = 5;
}
