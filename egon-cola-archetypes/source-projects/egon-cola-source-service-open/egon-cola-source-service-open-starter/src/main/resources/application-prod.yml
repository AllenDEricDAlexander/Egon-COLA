spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
app:
  integrations:
    organization:
      enabled: ${ORGANIZATION_FACADE_ENABLED:true}
      group: ${ORGANIZATION_FACADE_GROUP:student-management-organization}
      version: ${ORGANIZATION_FACADE_SERVICE_VERSION:1.0.0}
    rabbitmq:
      enabled: ${RABBITMQ_ENABLED:true}
      listener-auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      cache:
        enabled: true
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING}
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${EVALUATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${EVALUATION_SHARDING_MASTER_DATA_URL}
              username: ${EVALUATION_SHARDING_USERNAME}
              password: "${EVALUATION_SHARDING_PASSWORD:}"
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${EVALUATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${EVALUATION_SHARDING_SHARD_0_URL}
              username: ${EVALUATION_SHARDING_USERNAME}
              password: "${EVALUATION_SHARDING_PASSWORD:}"
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${EVALUATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${EVALUATION_SHARDING_SHARD_1_URL}
              username: ${EVALUATION_SHARDING_USERNAME}
              password: "${EVALUATION_SHARDING_PASSWORD:}"
          tables:
            evaluation_course:
              type: SINGLE
              data-source: master_data
            evaluation_course_schedule:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam_paper:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_score:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
