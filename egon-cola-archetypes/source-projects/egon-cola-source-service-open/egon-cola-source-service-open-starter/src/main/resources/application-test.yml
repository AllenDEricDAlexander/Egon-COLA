spring:
  sql:
    init:
      mode: never

egon:
  cola:
    component:
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/evaluation_open_test_master_data
              username: test
              password: test
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/evaluation_open_test_shard_0
              username: test
              password: test
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/evaluation_open_test_shard_1
              username: test
              password: test
          tables:
            evaluation_course:
              type: SINGLE
              data-source: master_data
            evaluation_course_schedule:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam_paper:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_score:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
      dtp:
        enabled: false
        report:
          enabled: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

app:
  integrations:
    organization:
      enabled: false
    rabbitmq:
      enabled: false
      listener-auto-startup: false

logging:
  level:
