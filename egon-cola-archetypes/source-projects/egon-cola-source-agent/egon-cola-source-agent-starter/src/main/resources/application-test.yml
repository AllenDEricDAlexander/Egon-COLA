# 离线测试 profile：H2 以 PostgreSQL 方言顶替真实库，Flyway 与依赖真实 DDL 的组件一并关闭。
# `create extension vector`、`jsonb`、部分索引与 `lower(...)` 表达式索引只在真实 PostgreSQL 上可执行，
# 因此本 profile 不校验迁移，迁移契约由 KnowledgeSchemaMigrationTest 以文本断言守住。
spring:
  datasource:
    url: jdbc:h2:mem:agent_knowledge;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  flyway:
    enabled: false
    locations: classpath:db/migration

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
      rag:
        enabled: false
        dimensions: 1536
        vector-store-bean-name: knowledgeRagVectorStore
        embedding-models:
          openai-compatible:
            embedding-model-bean-name: knowledgeEmbeddingModel
        default-embedding-model: openai-compatible
        storage:
          type: LOCAL
          local:
            root: ./target/rag-documents
        retrieval:
          default-top-k: 8
          max-top-k: 50
        validation:
          probe-on-startup: false
      transactional-outbox:
        enabled: false
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        data-change-recorder:
          enabled: false
        illegal-sql:
          enabled: false
        ddl:
          enabled: false
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements:
            "[top.egon.cola.archetype.source.agent.infrastructure.knowledge.repo.dao.KnowledgeDocumentDAO.softDeleteByKnowledgeBaseId]": knowledge_base_id
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: primary
              logical-name: primary
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/agent_test
              username: test
              password: test
          tables:
            knowledge_base:
              type: SINGLE
              data-source: primary
            knowledge_document:
              type: SINGLE
              data-source: primary
agent:
  deep-research:
    runtime:
      max-concurrent-runs: 4
      max-duration: PT5M
      max-sources: 20
      heartbeat-interval: PT15S
    model:
      base-url: http://test.invalid
      api-key: test-model-key
      model-name: test-model
    security:
      api-key: test-research-key
    docs:
      enabled: true
    search:
      mcp:
        base-uri: http://test.invalid
        sse-endpoint: /sse
        api-key: test-mcp-key
        request-timeout: PT15S
  knowledge:
    embedding:
      # 离线测试不装配嵌入模型（rag 组件在本 profile 关闭），此处占位以保持四份 profile 的键集合一致。
      base-url: http://test.invalid
      api-key: test-embedding-key
      model-name: text-embedding-ada-002
    tenant:
      default-id: 0
    runtime:
      qa-max-concurrent: 4
      max-upload-bytes: 20971520
      max-documents-per-base: 10000
      qa-max-duration: PT2M

spring.ai.openai:
  base-url: http://test.invalid
  api-key: test-model-key
  chat.options.model: test-model

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true

logging:
  level:
    top.egon.cola.component.common.mybatis.interceptor.EgonColaDataChangeRecorderInnerInterceptor: 'OFF'
    top.egon.cola.component.common.mybatis.change-summary: INFO

mybatis-plus:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml
