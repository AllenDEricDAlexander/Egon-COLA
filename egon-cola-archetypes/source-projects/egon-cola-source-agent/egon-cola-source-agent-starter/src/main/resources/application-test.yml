# 离线测试 profile：H2 以 PostgreSQL 方言顶替真实库，Flyway 与依赖真实 DDL 的组件一并关闭。
# `create extension vector`、`jsonb`、部分索引与 `lower(...)` 表达式索引只在真实 PostgreSQL 上可执行，
# 因此本 profile 不校验迁移，迁移契约由 KnowledgeSchemaMigrationTest 以文本断言守住。
spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          tianshuregistration:
            provider: native-control
            client-id: ${NATIVE_CONTROL_CLIENT_ID:}
            client-secret: ${NATIVE_CONTROL_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_CONTROL_SCOPES:}
          native-tenant-one:
            provider: native-tenant-one
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
          native-tenant-two:
            provider: native-tenant-two
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
        provider:
          native-control:
            token-uri: ${NATIVE_CONTROL_TOKEN_URI:}
          native-tenant-one:
            token-uri: ${NATIVE_TENANT_ONE_TOKEN_URI:}
          native-tenant-two:
            token-uri: ${NATIVE_TENANT_TWO_TOKEN_URI:}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:h2:mem:agent_knowledge;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  flyway:
    enabled: false
    locations: classpath:db/migration

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
      rag:
        enabled: false
        dimensions: 1536
        vector-store-bean-name: knowledgeRagVectorStore
        embedding-models:
          openai-compatible:
            embedding-model-bean-name: knowledgeEmbeddingModel
        default-embedding-model: openai-compatible
        storage:
          type: LOCAL
          local:
            root: ./target/rag-documents
        retrieval:
          default-top-k: 8
          max-top-k: 50
        validation:
          probe-on-startup: false
      transactional-outbox:
        enabled: false
      cache:
        enabled: false
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: false
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements:
            "[top.egon.cola.archetype.source.agent.infrastructure.knowledge.dao.KnowledgeDocumentDAO.softDeleteByKnowledgeBaseId]": knowledge_base_id
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: primary
              logical-name: primary
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/agent_test
              username: test
              password: test
          tables:
            knowledge_base:
              type: SINGLE
              data-source: primary
            knowledge_document:
              type: SINGLE
              data-source: primary
      rpc:
        enabled: false
        identity:
          env: ${APP_ENV:test}
          host: ${RPC_ADVERTISED_HOST:localhost}
          instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
        provider:
          enabled: false
          port: ${RPC_PORT:50051}
          advertised-host: ${RPC_ADVERTISED_HOST:localhost}
          registration-fail-fast: true
        consumer:
          enabled: false
          default-timeout-ms: 3000
          max-retries: 0
        tls:
          enabled: false
          development-plaintext: true
          certificate-chain-path: ${RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        enabled: false
        biz-code: ${TIANSHU_BIZ_CODE:deep-research}
        app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
        env: ${APP_ENV:test}
        namespace: ${TIANSHU_NAMESPACE:default}
        registration-resource-uri: ${TIANSHU_REGISTRATION_RESOURCE_URI:}
        redis:
          username: ${TIANSHU_REDIS_USERNAME:}
          enabled: false
          host: ${TIANSHU_REDIS_HOST:localhost}
          port: ${TIANSHU_REDIS_PORT:6379}
          password: ${TIANSHU_REDIS_PASSWORD:}
          database: ${TIANSHU_REDIS_DATABASE:0}
        consistency:
          fail-fast: true
        registry:
          enabled: false
          http:
            enabled: false
            env: ${APP_ENV:test}
            namespace: ${TIANSHU_NAMESPACE:default}
            instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
            service-name: ${spring.application.name}
            version: 1.0.0
            advertised-host: ${HTTP_ADVERTISED_HOST:localhost}
            port: ${server.port:8080}
            fail-fast: true
        rpc:
          target: ${TIANSHU_RPC_TARGET:}
          tls:
            enabled: false
            development-plaintext: true
            certificate-chain-path: ${TIANSHU_RPC_CERTIFICATE_CHAIN_PATH:}
            private-key-path: ${TIANSHU_RPC_PRIVATE_KEY_PATH:}
            trust-certificate-collection-path: ${TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
          auth:
            enabled: false
            runtime:
              access-key: ${TIANSHU_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_REGISTRY_SECRET_KEY:}
      yuheng:
        openapi:
          enabled: false
          publish-to-tianshu: false
    platform:
      tianquan:
        shoubing:
          enabled: false
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_ISSUER:}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
          resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:https://organization.example.test}
          clock-skew: PT30S
          trusted-issuers:
            tenant-one:
              issuer: ${NATIVE_TENANT_ONE_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_ONE_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_ONE_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_ONE_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_ONE_TRUST_VERSION:1}
            tenant-two:
              issuer: ${NATIVE_TENANT_TWO_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_TWO_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_TWO_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_TWO_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_TWO_TRUST_VERSION:1}
          revocation:
            mode: STRICT_SHARED
            primary-endpoint: ${OAUTH_REVOCATION_PRIMARY_ENDPOINT:}
            timeout: PT0.5S
            epoch: ${OAUTH_REVOCATION_EPOCH:}
          jwks-cache:
            ttl: PT300S
            max-issuers: 1000
            connect-timeout: PT2S
            read-timeout: PT5S
          usage-observation:
            enabled: false
            receiver: APPLICATION
            fallback-issuer: ${TIANQUAN_SHOUBING_ISSUER:}
            allow-local-plaintext: false
          audit:
            stream: egon:oauth:audit:v1
            spool-directory: ${NATIVE_OAUTH_AUDIT_SPOOL_DIRECTORY:}
            spool-max-bytes: 1073741824
            hmac-key-file: ${NATIVE_OAUTH_AUDIT_HMAC_KEY_FILE:}
            replay-initial-delay: 5000
            replay-delay: 5000
            delivery:
              receipt-ttl: PT1H
              confirmation-timeout: PT30S
              batch-size: 100
          service-client:
            app-id: egon-cola-source-agent
            registration-id: tianshuregistration
            credential-versions:
              tianshuregistration: ${NATIVE_CONTROL_CREDENTIAL_VERSION:1}
              native-tenant-one: ${NATIVE_TENANT_ONE_CREDENTIAL_VERSION:1}
              native-tenant-two: ${NATIVE_TENANT_TWO_CREDENTIAL_VERSION:1}
            # Deployment manifest supplies exact positive tenant IDs; there is no default tenant selection.
            tenant-registration-ids: {}
            renewal-skew: PT60S
          rpc:
            enabled: false
            consumer:
              enabled: false
              bindings: {}
            provider:
              methods: {}
        jianshen:
          enabled: false
          register-filter: false
          system-code: egon-cola-source-agent
          user-scope-policy:
            enabled: true
            permission-scopes:
              "[egon-cola-source-agent:research:start]": ["egon-cola-source-agent:research:start"]
              "[egon-cola-source-agent:knowledge-base:create]": ["egon-cola-source-agent:knowledge-base:create"]
              "[egon-cola-source-agent:knowledge-base:list]": ["egon-cola-source-agent:knowledge-base:list"]
              "[egon-cola-source-agent:knowledge-base:read]": ["egon-cola-source-agent:knowledge-base:read"]
              "[egon-cola-source-agent:knowledge-base:update]": ["egon-cola-source-agent:knowledge-base:update"]
              "[egon-cola-source-agent:knowledge-base:delete]": ["egon-cola-source-agent:knowledge-base:delete"]
              "[egon-cola-source-agent:knowledge-document:upload]": ["egon-cola-source-agent:knowledge-document:upload"]
              "[egon-cola-source-agent:knowledge-document:list]": ["egon-cola-source-agent:knowledge-document:list"]
              "[egon-cola-source-agent:knowledge-document:read]": ["egon-cola-source-agent:knowledge-document:read"]
              "[egon-cola-source-agent:knowledge-document:reingest]": ["egon-cola-source-agent:knowledge-document:reingest"]
              "[egon-cola-source-agent:knowledge-document:delete]": ["egon-cola-source-agent:knowledge-document:delete"]
              "[egon-cola-source-agent:knowledge:retrieve]": ["egon-cola-source-agent:knowledge:retrieve"]
              "[egon-cola-source-agent:knowledge:chat]": ["egon-cola-source-agent:knowledge:chat"]
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:}
            cache-ttl: PT5M
            maximum-jitter: PT30S
            near-cache-ttl: PT5S
            fetch-timeout: PT1S
            service-token:
              enabled: true
              resource-uri: ${TIANQUAN_JIANSHEN_RESOURCE_URI:}
              scopes: service:authorization:snapshot
              renewal-skew: PT60S
          runtime:
            redis-enabled: false
            redis-address: ${RBAC3_RUNTIME_REDIS_ADDRESS:}
            database: ${RBAC3_RUNTIME_REDIS_DATABASE:0}
            password-file: ${RBAC3_RUNTIME_REDIS_PASSWORD_FILE:}
            timeout: PT2S

agent:
  deep-research:
    runtime:
      max-concurrent-runs: 4
      max-duration: PT5M
      max-sources: 20
      heartbeat-interval: PT15S
    model:
      base-url: http://test.invalid
      api-key: test-model-key
      model-name: test-model
    docs:
      enabled: true
    search:
      mcp:
        base-uri: http://test.invalid
        sse-endpoint: /sse
        api-key: test-mcp-key
        request-timeout: PT15S
  knowledge:
    embedding:
      # 离线测试不装配嵌入模型（rag 组件在本 profile 关闭），此处占位以保持四份 profile 的键集合一致。
      base-url: http://test.invalid
      api-key: test-embedding-key
      model-name: text-embedding-ada-002
    runtime:
      qa-max-concurrent: 4
      max-upload-bytes: 20971520
      max-documents-per-base: 10000
      qa-max-duration: PT2M

spring.ai.openai:
  base-url: http://test.invalid
  api-key: test-model-key
  chat.options.model: test-model

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true

mybatis-plus:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml

server:
  ssl:
    enabled: false
    key-store: ${NATIVE_HTTP_KEY_STORE:}
    key-store-password: ${NATIVE_HTTP_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
