spring:
  application:
    name: deep-research-agent
  config:
    import:
      - optional:classpath:agent/deep-research-flow.yml
      - classpath:egon-mybatis-plus-sharding.yml
  servlet:
    multipart:
      # 上传上限（20MB）的判定权在 agent.knowledge.runtime.max-upload-bytes：到它为止由用例回答
      # 契约里的 413。容器阈值只作为滥用防线，必须高于该上限，否则合规的上传会在到达用例前被容器拒绝。
      max-file-size: ${AGENT_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${AGENT_MULTIPART_MAX_REQUEST_SIZE:26MB}
      # 延迟解析让容器的超限异常在参数解析时抛出：此时处理器已知，知识域的 advice 才能把它渲染成
      # 契约里的 413；立即解析会在处理器映射之前失败，任何按包限定的 advice 都无法被选中。
      resolve-lazily: true
  datasource:
    url: ${AGENT_DB_URL:}
    username: ${AGENT_DB_USERNAME:}
    password: ${AGENT_DB_PASSWORD:}
  flyway:
    enabled: ${AGENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

egon:
  cola:
    component:
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      rag:
        enabled: true
        dimensions: 1536
        vector-store-bean-name: knowledgeRagVectorStore
        embedding-models:
          openai-compatible:
            embedding-model-bean-name: knowledgeEmbeddingModel
        default-embedding-model: openai-compatible
        storage:
          type: LOCAL
          local:
            root: ${AGENT_RAG_STORAGE_ROOT:./data/rag-documents}
        retrieval:
          default-top-k: 8
          max-top-k: 50
        validation:
          probe-on-startup: false
      transactional-outbox:
        enabled: true
      cache:
        enabled: false
        node-id: ""
        key-prefix: egon:cola:cache
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          expire: PT30M
          null-expire: PT60S
          jitter-ratio: 0.1
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        meta-fill:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: false
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements:
            "[top.egon.cola.archetype.source.agent.infrastructure.knowledge.repo.dao.KnowledgeDocumentDAO.softDeleteByKnowledgeBaseId]": knowledge_base_id
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: primary
              logical-name: primary
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: ${AGENT_DB_URL:jdbc:postgresql://localhost:5432/agent}
              username: ${AGENT_DB_USERNAME:sa}
              password: "${AGENT_DB_PASSWORD:}"
          tables:
            knowledge_base:
              type: SINGLE
              data-source: primary
            knowledge_document:
              type: SINGLE
              data-source: primary
agent:
  deep-research:
    runtime:
      max-concurrent-runs: ${DEEP_RESEARCH_MAX_CONCURRENT_RUNS:4}
      max-duration: ${DEEP_RESEARCH_MAX_DURATION:PT5M}
      max-sources: ${DEEP_RESEARCH_MAX_SOURCES:20}
      heartbeat-interval: ${DEEP_RESEARCH_HEARTBEAT_INTERVAL:PT15S}
    model:
      base-url: ${DEEP_RESEARCH_MODEL_BASE_URL:}
      api-key: ${DEEP_RESEARCH_MODEL_API_KEY:}
      model-name: ${DEEP_RESEARCH_MODEL_NAME:}
    security:
      api-key: ${DEEP_RESEARCH_API_KEY:}
    docs:
      enabled: ${DEEP_RESEARCH_DOCS_ENABLED:true}
    search:
      mcp:
        base-uri: ${DEEP_RESEARCH_MCP_BASE_URI:}
        sse-endpoint: ${DEEP_RESEARCH_MCP_SSE_ENDPOINT:}
        api-key: ${DEEP_RESEARCH_MCP_API_KEY:}
        request-timeout: ${DEEP_RESEARCH_MCP_REQUEST_TIMEOUT:PT15S}
  knowledge:
    embedding:
      # 嵌入模型的供应商端点、凭据与模型名；向量维度只由 egon.cola.component.rag.dimensions 一处给出。
      base-url: ${AGENT_KNOWLEDGE_EMBEDDING_BASE_URL:}
      api-key: ${AGENT_KNOWLEDGE_EMBEDDING_API_KEY:}
      model-name: ${AGENT_KNOWLEDGE_EMBEDDING_MODEL:}
    tenant:
      default-id: ${AGENT_KNOWLEDGE_TENANT_ID:0}
    runtime:
      qa-max-concurrent: ${AGENT_KNOWLEDGE_QA_MAX_CONCURRENT:4}
      max-upload-bytes: ${AGENT_KNOWLEDGE_MAX_UPLOAD_BYTES:20971520}
      max-documents-per-base: ${AGENT_KNOWLEDGE_MAX_DOCUMENTS_PER_BASE:10000}
      qa-max-duration: ${AGENT_KNOWLEDGE_QA_MAX_DURATION:PT2M}

spring.ai.openai:
  base-url: ${DEEP_RESEARCH_MODEL_BASE_URL:}
  api-key: ${DEEP_RESEARCH_MODEL_API_KEY:}
  chat.options.model: ${DEEP_RESEARCH_MODEL_NAME:}

springdoc:
  api-docs.enabled: ${DEEP_RESEARCH_DOCS_ENABLED:true}
  swagger-ui.enabled: ${DEEP_RESEARCH_DOCS_ENABLED:true}

mybatis-plus:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml
