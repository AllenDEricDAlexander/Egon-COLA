#set( $symbol_dollar = '$' )
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  flyway:
    enabled: ${symbol_dollar}{FLYWAY_ENABLED:true}
    clean-disabled: false
    validate-on-migrate: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

dubbo:
  application:
    qos-enable: false
  registry:
    address: N/A
  protocol:
    name: injvm
    port: -1

organization:
  integrations:
    evaluation:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
  cache:
    user-ttl: PT10M
    grade-ttl: PT30M
    school-class-ttl: PT10M
  command:
    idempotency-ttl: PT24H

app:
  datasource:
    mode: ${symbol_dollar}{APP_DATASOURCE_MODE:SHARDING}
  sharding:
    database-name: PUBLIC
    physical-data-sources:
      - name: master_data
        logical-name: master_data
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${symbol_dollar}{ORGANIZATION_SHARDING_MASTER_DATA_URL:jdbc:h2:mem:${rootArtifactId}-test-master-data;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${symbol_dollar}{ORGANIZATION_SHARDING_USERNAME:sa}
        password: "${symbol_dollar}{ORGANIZATION_SHARDING_PASSWORD:}"
      - name: shard_0
        logical-name: shard_0
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${symbol_dollar}{ORGANIZATION_SHARDING_SHARD_0_URL:jdbc:h2:mem:${rootArtifactId}-test-shard-0;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${symbol_dollar}{ORGANIZATION_SHARDING_USERNAME:sa}
        password: "${symbol_dollar}{ORGANIZATION_SHARDING_PASSWORD:}"
      - name: shard_1
        logical-name: shard_1
        role: PRIMARY
        driver-class-name: org.h2.Driver
        jdbc-url: ${symbol_dollar}{ORGANIZATION_SHARDING_SHARD_1_URL:jdbc:h2:mem:${rootArtifactId}-test-shard-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
        username: ${symbol_dollar}{ORGANIZATION_SHARDING_USERNAME:sa}
        password: "${symbol_dollar}{ORGANIZATION_SHARDING_PASSWORD:}"
    flyway:
      targets:
        - data-source-name: master_data
          locations:
            - classpath:db/migration/sharding/master-data
        - data-source-name: shard_0
          locations:
            - classpath:db/migration/sharding/shard
        - data-source-name: shard_1
          locations:
            - classpath:db/migration/sharding/shard
