#set( $symbol_dollar = '$' )
databaseName: ${symbol_dollar}{app.sharding.database-name:${symbol_dollar}{EVALUATION_SHARDING_DATABASE_NAME:evaluation}}

rules:
  - !SHARDING
    tables:
      evaluation_course:
        actualDataNodes: master_data.evaluation_course
        databaseStrategy:
          none:
        tableStrategy:
          none:
      evaluation_course_schedule:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.evaluation_course_schedule_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_database_bucket
        tableStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      evaluation_exam:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.evaluation_exam_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_database_bucket
        tableStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      evaluation_exam_paper:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.evaluation_exam_paper_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_database_bucket
        tableStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      evaluation_score:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.evaluation_score_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_database_bucket
        tableStrategy:
          standard:
            shardingColumn: tenant_id
            shardingAlgorithmName: tenant_long_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
    bindingTables:
      - evaluation_exam,evaluation_exam_paper,evaluation_score
    shardingAlgorithms:
      tenant_long_database_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.LongTenantShardingAlgorithm
          target: database
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
      tenant_long_table_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.LongTenantShardingAlgorithm
          target: table
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}


    auditors:
      sharding_key_required_auditor:
        type: DML_SHARDING_CONDITIONS

props:
  sql-show: ${symbol_dollar}{SHARDING_SQL_SHOW:false}
