#set( $symbol_dollar = '$' )
databaseName: ${symbol_dollar}{app.sharding.database-name:${symbol_dollar}{EVALUATION_SHARDING_DATABASE_NAME:evaluation}}

rules:
  - !READWRITE_SPLITTING
    dataSourceGroups:
      master_data:
        writeDataSourceName: master_data_primary
        readDataSourceNames:
          - master_data_replica_0
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: round_robin
      shard_0:
        writeDataSourceName: shard_0_primary
        readDataSourceNames:
          - shard_0_replica_0
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: round_robin
      shard_1:
        writeDataSourceName: shard_1_primary
        readDataSourceNames:
          - shard_1_replica_0
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: round_robin
    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

  - !SHARDING
    tables:
      course:
        actualDataNodes: master_data.course
        databaseStrategy:
          none:
        tableStrategy:
          none:
      course_schedule:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.course_schedule_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: course_id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: course_id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      exam:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.exam_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      exam_paper:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.exam_paper_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: exam_id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: exam_id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      score:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.score_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: exam_id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: exam_id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
    bindingTables:
      - exam,exam_paper,score
    shardingAlgorithms:
      uuid_v7_database_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.UuidV7BucketShardingAlgorithm
          target: database
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
      uuid_v7_table_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.UuidV7BucketShardingAlgorithm
          target: table
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}


    auditors:
      sharding_key_required_auditor:
        type: DML_SHARDING_CONDITIONS

props:
  sql-show: ${symbol_dollar}{SHARDING_SQL_SHOW:false}
