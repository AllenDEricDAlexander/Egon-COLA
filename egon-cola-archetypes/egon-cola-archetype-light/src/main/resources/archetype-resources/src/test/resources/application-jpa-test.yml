#set( $symbol_dollar = '$' )
spring:
  datasource:
    url: ${symbol_dollar}{DB_URL:jdbc:h2:mem:${artifactId}-jpa-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${symbol_dollar}{DB_USERNAME:sa}
    password: ${symbol_dollar}{DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
