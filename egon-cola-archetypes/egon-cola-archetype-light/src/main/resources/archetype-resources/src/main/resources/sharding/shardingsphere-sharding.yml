#set( $symbol_dollar = '$' )
databaseName: student_management

rules:
  - !SHARDING
    tables:
      users:
        actualDataNodes: master_data.public.users
        databaseStrategy:
          none:
        tableStrategy:
          none:
      roles:
        actualDataNodes: master_data.public.roles
        databaseStrategy:
          none:
        tableStrategy:
          none:
      permissions:
        actualDataNodes: master_data.public.permissions
        databaseStrategy:
          none:
        tableStrategy:
          none:
      user_roles:
        actualDataNodes: master_data.public.user_roles
        databaseStrategy:
          none:
        tableStrategy:
          none:
      role_permissions:
        actualDataNodes: master_data.public.role_permissions
        databaseStrategy:
          none:
        tableStrategy:
          none:
      courses:
        actualDataNodes: master_data.public.courses
        databaseStrategy:
          none:
        tableStrategy:
          none:
      school_classes:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.public.school_classes_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      class_course_schedules:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.public.class_course_schedules_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: school_class_id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: school_class_id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
    bindingTables:
      - school_classes,class_course_schedules
    shardingAlgorithms:
      uuid_v7_database_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.UuidV7BucketShardingAlgorithm
          target: database
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
      uuid_v7_table_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.UuidV7BucketShardingAlgorithm
          target: table
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
    auditors:
      sharding_key_required_auditor:
        type: DML_SHARDING_CONDITIONS

props:
  proxy-frontend-database-protocol-type: PostgreSQL
  sql-show: ${symbol_dollar}{SHARDING_SQL_SHOW:false}
