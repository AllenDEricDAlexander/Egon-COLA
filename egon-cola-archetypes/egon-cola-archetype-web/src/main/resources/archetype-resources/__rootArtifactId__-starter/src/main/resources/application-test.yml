#set( $symbol_dollar = '$' )
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

dubbo:
  application:
    qos-enable: false
  registry:
    address: N/A
  protocol:
    name: injvm
    port: -1

organization:
  integrations:
    evaluation:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
  cache:
    user-ttl: PT10M
    grade-ttl: PT30M
    school-class-ttl: PT10M
  command:
    idempotency-ttl: PT24H
