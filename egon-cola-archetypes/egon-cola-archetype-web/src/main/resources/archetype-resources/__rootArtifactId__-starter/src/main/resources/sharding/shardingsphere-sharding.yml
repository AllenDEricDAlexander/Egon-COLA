#set( $symbol_dollar = '$' )
databaseName: ${symbol_dollar}{app.sharding.database-name:${symbol_dollar}{ORGANIZATION_SHARDING_DATABASE_NAME:organization}}

rules:
  - !SHARDING
    tables:
      users:
        actualDataNodes: master_data.users
        databaseStrategy:
          none:
        tableStrategy:
          none:
      roles:
        actualDataNodes: master_data.roles
        databaseStrategy:
          none:
        tableStrategy:
          none:
      permissions:
        actualDataNodes: master_data.permissions
        databaseStrategy:
          none:
        tableStrategy:
          none:
      user_roles:
        actualDataNodes: master_data.user_roles
        databaseStrategy:
          none:
        tableStrategy:
          none:
      role_permissions:
        actualDataNodes: master_data.role_permissions
        databaseStrategy:
          none:
        tableStrategy:
          none:
      grades:
        actualDataNodes: master_data.grades
        databaseStrategy:
          none:
        tableStrategy:
          none:
      school_classes:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.school_classes_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: grade_id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: grade_id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
      school_class_users:
        actualDataNodes: shard_${symbol_dollar}->{0..1}.school_class_users_${symbol_dollar}->{0..1}
        databaseStrategy:
          standard:
            shardingColumn: grade_id
            shardingAlgorithmName: uuid_v7_database_bucket
        tableStrategy:
          standard:
            shardingColumn: grade_id
            shardingAlgorithmName: uuid_v7_table_bucket
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: false
    bindingTables:
      - school_classes,school_class_users
    shardingAlgorithms:
      uuid_v7_database_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.UuidV7BucketShardingAlgorithm
          target: database
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
      uuid_v7_table_bucket:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: ${package}.infrastructure.config.datasource.UuidV7BucketShardingAlgorithm
          target: table
          node-count: ${symbol_dollar}{app.sharding.routing.node-count}
          node-map: ${symbol_dollar}{app.sharding.routing.node-map}
    auditors:
      sharding_key_required_auditor:
        type: DML_SHARDING_CONDITIONS

props:
  sql-show: ${symbol_dollar}{SHARDING_SQL_SHOW:false}
