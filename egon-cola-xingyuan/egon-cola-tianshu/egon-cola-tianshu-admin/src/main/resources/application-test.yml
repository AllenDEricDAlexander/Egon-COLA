spring:
  datasource:
    url: ${TIANSHU_TEST_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/egon_tianshu_test}
    username: ${TIANSHU_DB_USERNAME:postgres}
    password: ${TIANSHU_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

egon:
  cola:
    component:
      tianshu:
        enabled: false
        registry:
          enabled: false
        admin:
          ai:
            optimization:
              enabled: false
              scan-interval: 60s
              run-lease: 10m
              max-concurrent-runs: 1
              sample-limit: 20
            judge:
              scan-interval: 30s
              batch-size: 50
              max-attempts: 3
              max-context-bytes: 16384
              lease: 5m
            model:
              base-url: http://127.0.0.1:1
              resource-uri: https://yuheng.test/llm
              registration-id: tianshu-ai-test
              app-id: tianshu-admin-test
              scopes: yuheng:llm:invoke
              connect-timeout: 3s
              read-timeout: 120s
              max-output-tokens: 8192
              temperature: 0.2
            feedback:
              retention: 30d
              retention-scan-interval: 1h
              max-batch: 100
              max-clock-skew: 5m
              max-input-excerpt-bytes: 8192
              max-output-excerpt-bytes: 32768
          security:
            local-dev: true
          rpc:
            signature-enabled: false
          redis:
            enabled: false
      transactional-outbox:
        enabled: true
        polling:
          enabled: false
          fixed-delay: 1s
          batch-size: 100
          concurrency: 4
        delivery:
          timeout: 10s
          lease-duration: 60s
          queue-capacity: 1000
        retry:
          max-attempts: 10
          initial-delay: 1s
          multiplier: 2.0
          max-delay: 5m
          jitter: 0.2
        payload:
          max-bytes: 8MB
          max-header-count: 64
          max-header-bytes: 16KB
      rpc:
        provider:
          port: 0
        tls:
          development-plaintext: true

egon.cola.platform.tianquan.jianshen.user-scope-policy:
  enabled: false
  permission-scopes: {}

egon.cola.platform.tianquan.shoubing.usage-observation:
  enabled: false
  receiver: TIANSHU
  fallback-issuer: https://idp.invalid/tenants/1
  allow-local-plaintext: false
