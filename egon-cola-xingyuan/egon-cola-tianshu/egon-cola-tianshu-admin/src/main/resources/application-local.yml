spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/egon_tianshu_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

egon:
  cola:
    platform:
      tianquan-shoubing:
        issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
      tianquan-jianshen:
        runtime:
          redis-address: ${TIANSHU_AUTHORIZATION_REDIS_ADDRESS:redis://127.0.0.1:6379}
          password-file: ${UNIFIED_IDENTITY_REDIS_PASSWORD_FILE:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/secrets/redis.password}
        authorization:
          endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
          service-token:
            enabled: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_ENABLED:false}
            resource-uri: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_RESOURCE_URI:}
            scopes: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_SCOPES:}
    component:
      tianshu:
        admin:
          redis:
            password: ${TIANSHU_REDIS_PASSWORD}
      rpc:
        tls:
          development-plaintext: true
      yuheng:
        reporting:
          enabled: ${TIANSHU_YUHENG_REPORTING_ENABLED:false}
          env: local
          namespace: default
          application-code: tianshu
          artifact-version: local
