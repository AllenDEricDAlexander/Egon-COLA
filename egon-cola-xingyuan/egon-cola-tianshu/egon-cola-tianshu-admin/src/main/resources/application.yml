server:
  port: 18080

springdoc:
  api-docs:
    enabled: ${TIANSHU_HTTP_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: tianshu
      paths-to-match:
        - /api/v1/tianshu/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${sdk.version}

spring:
  application:
    name: egon-cola-tianshu-admin
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  config:
    import:
      - classpath:META-INF/egon-cola-tianshu.properties
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/tianshu.properties
      - optional:tianshu:application.yml
  flyway:
    locations: classpath:db/postgresql

egon:
  cola:
    platform:
      tianquan-shoubing:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER:}
        jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
        resource-server-id: ${TIANSHU_RESOURCE_SERVER_ID:}
        resource-uri: ${TIANSHU_RESOURCE_URI:}
      tianquan-jianshen:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        system-code: tianshu-admin
        runtime:
          redis-enabled: true
          redis-address: ${TIANSHU_AUTHORIZATION_REDIS_ADDRESS:}
          database: ${TIANSHU_AUTHORIZATION_REDIS_DATABASE:0}
        authorization:
          endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:}
          service-token:
            enabled: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_ENABLED:true}
            resource-uri: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_RESOURCE_URI:}
            scopes: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_SCOPES:}
    component:
      tianshu:
        enabled: ${TIANSHU_SELF_REGISTRATION_ENABLED:false}
        biz-code: ${TIANSHU_RESOURCE_BIZ_CODE:xingyuan}
        app-code: ${TIANSHU_RESOURCE_APP_CODE:tianshu}
        env: ${DEPLOYMENT_ENV:local}
        namespace: ${DEPLOYMENT_NAMESPACE:default}
        max-config-bytes: ${TIANSHU_MAX_CONFIG_BYTES:1048576}
        instance:
          id: ${TIANSHU_INSTANCE_ID:tianshu-admin-local-1}
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///127.0.0.1:19080}
          tls:
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: false
          host: ${TIANSHU_REDIS_HOST:127.0.0.1}
          port: ${TIANSHU_REDIS_PORT:6379}
          password: ${TIANSHU_REDIS_PASSWORD:}
          database: ${TIANSHU_REDIS_DATABASE:0}
        registry:
          enabled: ${TIANSHU_SELF_REGISTRATION_ENABLED:false}
          http:
            enabled: ${TIANSHU_SELF_REGISTRATION_ENABLED:false}
            instance-id: ${TIANSHU_INSTANCE_ID:tianshu-admin-local-1}
            service-name: ${TIANSHU_YUHENG_SERVICE_NAME:tianshu}
            group: default
            version: ${TIANSHU_ARTIFACT_VERSION:local}
            protocol: http
            advertised-host: ${TIANSHU_ADVERTISED_HOST:127.0.0.1}
            port: ${TIANSHU_ADVERTISED_PORT:18150}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: ${TIANSHU_SELF_REGISTRATION_FAIL_FAST:false}
        admin:
          security:
            local-dev: ${TIANSHU_ADMIN_SECURITY_LOCAL_DEV:false}
            jwt:
              issuer: ${TIANSHU_ADMIN_JWT_ISSUER:}
              audience: ${TIANSHU_ADMIN_JWT_AUDIENCE:}
              jwk-set-uri: ${TIANSHU_ADMIN_JWT_JWK_SET_URI:}
          transport-security:
            mode: DEVELOPMENT_PLAINTEXT
          max-config-bytes: ${TIANSHU_MAX_CONFIG_BYTES:1048576}
          registration:
            resource-server-id: ${TIANSHU_RESOURCE_SERVER_ID:}
            resource-uri: ${TIANSHU_RESOURCE_URI:}
            required-scope: tianshu:registration:write
          redis:
            mode: SINGLE
            nodes: []
            master-name:
            host: 127.0.0.1
            port: 6379
            database: 0
          rpc:
            signature-enabled: ${TIANSHU_RPC_SIGNATURE_ENABLED:true}
            credentials:
              - credential-id: ${TIANSHU_RPC_RUNTIME_CREDENTIAL_ID:runtime}
                access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY:}
                secret: ${TIANSHU_RPC_RUNTIME_SECRET_KEY:}
                client-type: SDK
                app-code-patterns: ${TIANSHU_RPC_RUNTIME_APP_CODE_PATTERNS:*}
                env-patterns: ${TIANSHU_RPC_RUNTIME_ENV_PATTERNS:*}
                biz-code-patterns: ${TIANSHU_RPC_RUNTIME_BIZ_CODE_PATTERNS:*}
                namespace-patterns: ${TIANSHU_RPC_RUNTIME_NAMESPACE_PATTERNS:*}
                allowed-operations: SDK_REGISTER,SDK_HEARTBEAT,SDK_OFFLINE,CONFIG_PULL,PUBLISH_ACK
              - credential-id: ${TIANSHU_RPC_REGISTRY_CREDENTIAL_ID:registry}
                access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY:}
                secret: ${TIANSHU_RPC_REGISTRY_SECRET_KEY:}
                client-type: REGISTRY
                app-code-patterns: ${TIANSHU_RPC_REGISTRY_APP_CODE_PATTERNS:*}
                env-patterns: ${TIANSHU_RPC_REGISTRY_ENV_PATTERNS:*}
                biz-code-patterns: ${TIANSHU_RPC_REGISTRY_BIZ_CODE_PATTERNS:*}
                namespace-patterns: ${TIANSHU_RPC_REGISTRY_NAMESPACE_PATTERNS:*}
                allowed-operations: REGISTRY_REGISTER,REGISTRY_HEARTBEAT,REGISTRY_DEREGISTER,REGISTRY_READ
              - credential-id: ${TIANSHU_RPC_MANAGEMENT_CREDENTIAL_ID:management}
                access-key: ${TIANSHU_RPC_MANAGEMENT_ACCESS_KEY:}
                secret: ${TIANSHU_RPC_MANAGEMENT_SECRET_KEY:}
                client-type: MANAGEMENT
                app-code-patterns: ${TIANSHU_RPC_MANAGEMENT_APP_CODE_PATTERNS:*}
                env-patterns: ${TIANSHU_RPC_MANAGEMENT_ENV_PATTERNS:*}
                biz-code-patterns: ${TIANSHU_RPC_MANAGEMENT_BIZ_CODE_PATTERNS:*}
                namespace-patterns: ${TIANSHU_RPC_MANAGEMENT_NAMESPACE_PATTERNS:*}
                allowed-operations: MANAGEMENT_CONFIG_READ,MANAGEMENT_CONFIG_WRITE,MANAGEMENT_PUBLISH,MANAGEMENT_TASK_READ,MANAGEMENT_TASK_RETRY,MANAGEMENT_INSTANCE_READ,MANAGEMENT_SCOPE_READ,MANAGEMENT_REGISTRY_READ,MANAGEMENT_CATALOG_READ
            allowed-clock-skew-seconds: 300
            nonce-cache-max-size: 10000
          publish:
            dispatch-timeout-ms: 5000
            default-timeout-ms: 30000
            max-timeout-ms: 60000
            scan-interval-ms: 1000
            completion-poll-interval-ms: 100
            recovery-stale-ms: 120000
      yuheng:
        openapi:
          enabled: ${TIANSHU_HTTP_OPENAPI_ENABLED:false}
          publish-to-tianshu: true
          published-groups:
            - tianshu
          biz-code: ${TIANSHU_RESOURCE_BIZ_CODE:xingyuan}
          application-code: ${TIANSHU_RESOURCE_APP_CODE:tianshu}
          resource-uri: ${TIANSHU_RESOURCE_URI:}
          artifact-version: ${TIANSHU_ARTIFACT_VERSION:local}
          build-id: ${TIANSHU_BUILD_ID:local}
        reporting:
          enabled: ${TIANSHU_YUHENG_REPORTING_ENABLED:true}
          admin-base-url: ${YUHENG_ADMIN_BASE_URL:}
          biz-code: ${TIANSHU_RESOURCE_BIZ_CODE:xingyuan}
          application-code: ${TIANSHU_RESOURCE_APP_CODE:tianshu}
          application-name: Tianshu Admin
          env: ${DEPLOYMENT_ENV:local}
          namespace: ${DEPLOYMENT_NAMESPACE:default}
          artifact-version: ${TIANSHU_ARTIFACT_VERSION:local}
          build-id: ${TIANSHU_BUILD_ID:local}
          declared-hosts: ${TIANSHU_DECLARED_HOSTS:127.0.0.1}
          fail-fast: true
          access-key: ${YUHENG_REPORT_ACCESS_KEY:}
          secret-key: ${YUHENG_REPORT_SECRET_KEY:}
          state-file: ${YUHENG_REPORT_STATE_FILE:}
      rpc:
        enabled: true
        provider:
          enabled: true
          port: ${TIANSHU_RPC_PORT:19080}
          registration-mode: DISABLED
        consumer:
          enabled: false
        tls:
          enabled: ${TIANSHU_RPC_TLS_ENABLED:false}
          development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}
          certificate-chain-path: ${TIANSHU_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${TIANSHU_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
