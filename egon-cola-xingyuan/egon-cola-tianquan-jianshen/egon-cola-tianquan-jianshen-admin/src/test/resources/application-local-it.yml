spring:
  config:
    activate:
      on-profile: local-it

tianquan-jianshen:
  integration-test:
    postgres:
      url: ${TIANQUAN_JIANSHEN_IT_POSTGRES_URL}
      user: ${TIANQUAN_JIANSHEN_IT_POSTGRES_USER}
      password-file: ${TIANQUAN_JIANSHEN_IT_POSTGRES_PASSWORD_FILE}

egon.cola.platform:
  tianquan:
    shoubing:
      revocation:
        primary-endpoint: ${TIANQUAN_SHOUBING_REVOCATION_PRIMARY_ENDPOINT}
      usage-observation:
        receiver: JIANSHEN
        enabled: false
        fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
        allow-local-plaintext: false
      audit:
        delivery:
          receipt-ttl: PT1H
          confirmation-timeout: PT30S
          batch-size: 100

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping

egon.cola.component:
  rpc:
    enabled: false
    tls:
      enabled: false
      development-plaintext: false
  tianshu:
    enabled: false
    rpc:
      tls:
        enabled: false
        development-plaintext: false

egon.cola.platform.tianquan.jianshen.user-scope-policy:
  enabled: false
  permission-scopes: {}
