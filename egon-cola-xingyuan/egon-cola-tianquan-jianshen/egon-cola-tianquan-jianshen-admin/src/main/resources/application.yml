spring:
  application:
    name: tianquan-jianshen-admin
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/tianquan-jianshen.properties
      - optional:tianshu:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    url: ${TIANQUAN_JIANSHEN_POSTGRES_URL}
    username: ${TIANQUAN_JIANSHEN_POSTGRES_USER}
    password: ${TIANQUAN_JIANSHEN_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${TIANQUAN_JIANSHEN_ADVERTISED_PORT:0}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${TIANQUAN_JIANSHEN_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: iam
      paths-to-match:
        - /api/tianquan-jianshen/v1/**
        - /api/v1/auth/about
      paths-to-exclude:
        - /api/tianquan-jianshen/v1/registration/**
        - /api/tianquan-jianshen/v1/internal/business-participations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,rbac3Readiness,tianquanAuditReadiness

egon.cola.platform:
  tianquan:
    shoubing:
      revocation:
        primary-endpoint: ${TIANQUAN_SHOUBING_REVOCATION_PRIMARY_ENDPOINT}
      usage-observation:
        receiver: JIANSHEN
        enabled: true
        fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
        allow-local-plaintext: false
      enabled: ${UNIFIED_IDENTITY_ENABLED:true}
      register-filter: false
      issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      resource-server-id: ${TIANQUAN_JIANSHEN_RESOURCE_SERVER_ID}
      resource-uri: ${TIANQUAN_JIANSHEN_RESOURCE_URI}
      audit:
        delivery:
          receipt-ttl: PT1H
          confirmation-timeout: PT30S
          batch-size: 100
        stream: egon:oauth:audit:v1
        spool-directory: ${EGON_TIANQUAN_JIANSHEN_OAUTH_AUDIT_SPOOL_DIRECTORY}
        spool-max-bytes: ${EGON_TIANQUAN_JIANSHEN_OAUTH_AUDIT_SPOOL_MAX_BYTES:1073741824}
        hmac-key-file: ${EGON_TIANQUAN_SHOUBING_OAUTH_AUDIT_HMAC_KEY_FILE}
    jianshen:
      user-scope-policy:
        enabled: true
        permission-scopes:
          "[system:about:read]": ["system:about:read"]
          "[system:application:manage]": ["system:application:manage"]
          "[system:application:read]": ["system:application:read"]
          "[system:audit:read]": ["system:audit:read"]
          "[system:authorization-constraint:manage]": ["system:authorization-constraint:manage"]
          "[system:authorization-constraint:read]": ["system:authorization-constraint:read"]
          "[system:authorization-runtime:operate]": ["system:authorization-runtime:operate"]
          "[system:authorization-runtime:read]": ["system:authorization-runtime:read"]
          "[system:authorization-simulation:execute]": ["system:authorization-simulation:execute"]
          "[system:business:read]": ["system:business:read"]
          "[system:data-rule:manage]": ["system:data-rule:manage"]
          "[system:data-rule:read]": ["system:data-rule:read"]
          "[system:directory-snapshot:read]": ["system:directory-snapshot:read"]
          "[system:directory:read]": ["system:directory:read"]
          "[system:directory:sync]": ["system:directory:sync"]
          "[system:field-definition:manage]": ["system:field-definition:manage"]
          "[system:field-definition:read]": ["system:field-definition:read"]
          "[system:field-rule:manage]": ["system:field-rule:manage"]
          "[system:field-rule:read]": ["system:field-rule:read"]
          "[system:management-policy:manage]": ["system:management-policy:manage"]
          "[system:management-policy:read]": ["system:management-policy:read"]
          "[system:operation-sod:manage]": ["system:operation-sod:manage"]
          "[system:operation-sod:read]": ["system:operation-sod:read"]
          "[system:organization:manage]": ["system:organization:manage"]
          "[system:organization:read]": ["system:organization:read"]
          "[system:permission:manage]": ["system:permission:manage"]
          "[system:permission:read]": ["system:permission:read"]
          "[system:position:manage]": ["system:position:manage"]
          "[system:position:read]": ["system:position:read"]
          "[system:resource-permission:manage]": ["system:resource-permission:manage"]
          "[system:resource-permission:read]": ["system:resource-permission:read"]
          "[system:resource:archive]": ["system:resource:archive"]
          "[system:resource:read]": ["system:resource:read"]
          "[system:role-activation:read]": ["system:role-activation:read"]
          "[system:role-activation:use]": ["system:role-activation:use"]
          "[system:role-assignment:manage]": ["system:role-assignment:manage"]
          "[system:role-inheritance:manage]": ["system:role-inheritance:manage"]
          "[system:role-resource:manage]": ["system:role-resource:manage"]
          "[system:role-resource:read]": ["system:role-resource:read"]
          "[system:role:create]": ["system:role:create"]
          "[system:role:read]": ["system:role:read"]
          "[system:role:update]": ["system:role:update"]
          "[system:user-application-access:read]": ["system:user-application-access:read"]
          "[system:user-business-access:manage]": ["system:user-business-access:manage"]
          "[system:user-business-access:read]": ["system:user-business-access:read"]
          "[system:user-organization:manage]": ["system:user-organization:manage"]
          "[system:user-organization:read]": ["system:user-organization:read"]
          "[system:user-position:manage]": ["system:user-position:manage"]
          "[system:user-position:read]": ["system:user-position:read"]
          "[system:user-status:manage]": ["system:user-status:manage"]
          "[system:user:manage]": ["system:user:manage"]
          "[system:user:read]": ["system:user:read"]
      enabled: ${UNIFIED_IDENTITY_ENABLED:true}
      register-filter: false
      system-code: tianquan-jianshen-admin
      runtime:
        redis-enabled: true
        redis-address: ${TIANQUAN_JIANSHEN_AUTHORIZATION_REDIS_ADDRESS}
        database: ${TIANQUAN_JIANSHEN_AUTHORIZATION_REDIS_DATABASE:0}
      authorization:
        endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT}
        service-token:
          enabled: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_ENABLED:true}
          resource-uri: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_RESOURCE_URI:}
          scopes: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_SCOPES:}
          renewal-skew: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_RENEWAL_SKEW:30s}

egon:
  tianquan-jianshen:
    maximum-active-roots: 16
    component-keys: ${TIANQUAN_JIANSHEN_COMPONENT_KEYS}
    runtime:
      redis-enabled: true
      redis-address: ${TIANQUAN_JIANSHEN_RUNTIME_REDIS_ADDRESS}
      redis-database: ${TIANQUAN_JIANSHEN_RUNTIME_REDIS_DATABASE:0}
      redis-timeout: ${TIANQUAN_JIANSHEN_RUNTIME_REDIS_TIMEOUT:2s}
      redis-password-file: ${TIANQUAN_JIANSHEN_RUNTIME_REDIS_PASSWORD_FILE}
    yuheng-status:
      admin-base-url: ${YUHENG_ADMIN_BASE_URL}
      yuheng-group-id: ${YUHENG_GROUP_ID}
      release-id: ${YUHENG_RELEASE_ID}
      oauth-token-file: ${YUHENG_STATUS_OAUTH_TOKEN_FILE}
      timeout: ${YUHENG_STATUS_TIMEOUT:3s}
    topology:
      tianshu-registry-client-bean: ddcRedissonClient
      runtime-client-bean: rbac3RuntimeRedissonClient
  cola:
    component:
      id:
        enabled: true
        machine-id: ${TIANQUAN_JIANSHEN_SNOWFLAKE_MACHINE_ID}
      rpc:
        enabled: ${TIANQUAN_JIANSHEN_RPC_ENABLED:true}
        consumer:
          enabled: ${TIANQUAN_JIANSHEN_RPC_CONSUMER_ENABLED:true}
        tls:
          enabled: ${TIANQUAN_SHOUBING_ADMISSION_RPC_TLS_ENABLED:true}
          development-plaintext: ${TIANQUAN_SHOUBING_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}}
          certificate-chain-path: ${TIANQUAN_SHOUBING_ADMISSION_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${TIANQUAN_SHOUBING_ADMISSION_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${TIANQUAN_SHOUBING_ADMISSION_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        enabled: true
        biz-code: ${TIANQUAN_JIANSHEN_RESOURCE_BIZ_CODE:permission}
        app-code: ${TIANQUAN_JIANSHEN_RESOURCE_APP_CODE:tianquan-jianshen}
        env: ${DEPLOYMENT_ENV}
        namespace: ${DEPLOYMENT_NAMESPACE}
        instance:
          id: ${TIANQUAN_JIANSHEN_INSTANCE_ID}
          lease-seconds: 30
          heartbeat-interval-seconds: 10
        consistency:
          fail-fast: true
          reconcile-enabled: true
          reconcile-interval-seconds: 30
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///tianshu-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${TIANSHU_RPC_TLS_ENABLED:true}
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY}
              secret-key: ${TIANSHU_RPC_RUNTIME_SECRET_KEY}
            registry:
              access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY}
              secret-key: ${TIANSHU_RPC_REGISTRY_SECRET_KEY}
            management:
              access-key: ${TIANSHU_RPC_MANAGEMENT_ACCESS_KEY}
              secret-key: ${TIANSHU_RPC_MANAGEMENT_SECRET_KEY}
        redis:
          username: ${TIANSHU_REDIS_USERNAME:}
          enabled: true
          mode: ${TIANSHU_REGISTRY_REDIS_MODE:SINGLE}
          nodes: ${TIANSHU_REGISTRY_REDIS_NODES:}
          master-name: ${TIANSHU_REGISTRY_REDIS_MASTER_NAME:}
          host: ${TIANSHU_REGISTRY_REDIS_HOST}
          port: ${TIANSHU_REGISTRY_REDIS_PORT:6379}
          password: ${TIANSHU_REGISTRY_REDIS_PASSWORD}
          database: ${TIANSHU_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: true
          http:
            enabled: true
            env: ${DEPLOYMENT_ENV}
            namespace: ${DEPLOYMENT_NAMESPACE}
            instance-id: ${TIANQUAN_JIANSHEN_INSTANCE_ID}
            service-name: tianquan-jianshen-admin
            group: default
            version: ${TIANQUAN_JIANSHEN_ARTIFACT_VERSION}
            protocol: http
            advertised-host: ${TIANQUAN_JIANSHEN_ADVERTISED_HOST}
            port: ${TIANQUAN_JIANSHEN_ADVERTISED_PORT}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      yuheng:
        openapi:
          enabled: ${TIANQUAN_JIANSHEN_OPENAPI_ENABLED:false}
          publish-to-tianshu: ${TIANQUAN_JIANSHEN_OPENAPI_PUBLISH_TO_TIANSHU:false}
          published-groups:
            - iam
          biz-code: ${TIANQUAN_JIANSHEN_OPENAPI_BIZ_CODE:${TIANQUAN_JIANSHEN_RESOURCE_BIZ_CODE:permission}}
          application-code: ${TIANQUAN_JIANSHEN_OPENAPI_APPLICATION_CODE:${TIANQUAN_JIANSHEN_RESOURCE_APP_CODE:tianquan-jianshen}}
          resource-uri: ${TIANQUAN_JIANSHEN_OPENAPI_RESOURCE_URI:${TIANQUAN_JIANSHEN_RESOURCE_URI:}}
          artifact-version: ${TIANQUAN_JIANSHEN_OPENAPI_ARTIFACT_VERSION:${TIANQUAN_JIANSHEN_ARTIFACT_VERSION:local}}
          build-id: ${TIANQUAN_JIANSHEN_OPENAPI_BUILD_ID:${TIANQUAN_JIANSHEN_BUILD_ID:local}}
        reporting:
          enabled: ${TIANQUAN_JIANSHEN_YUHENG_REPORTING_ENABLED:true}
          admin-base-url: ${YUHENG_ADMIN_BASE_URL}
          biz-code: ${TIANQUAN_JIANSHEN_RESOURCE_BIZ_CODE:permission}
          application-code: ${TIANQUAN_JIANSHEN_RESOURCE_APP_CODE:tianquan-jianshen}
          application-name: Tianquan-Jianshen Permission Admin
          env: ${DEPLOYMENT_ENV}
          namespace: ${DEPLOYMENT_NAMESPACE}
          artifact-version: ${TIANQUAN_JIANSHEN_ARTIFACT_VERSION}
          build-id: ${TIANQUAN_JIANSHEN_BUILD_ID}
          declared-hosts: ${TIANQUAN_JIANSHEN_DECLARED_HOSTS}
          fail-fast: true
          access-key: ${YUHENG_REPORT_ACCESS_KEY}
          secret-key: ${YUHENG_REPORT_SECRET_KEY}
          state-file: ${YUHENG_REPORT_STATE_FILE}
      transactional-outbox:
        enabled: true
        node-id: ${TIANQUAN_JIANSHEN_INSTANCE_ID}
        storage:
          data-source-bean-name: dataSource
          transaction-manager-bean-name: transactionManager
          validate-schema: true
        polling:
          enabled: true
          fixed-delay: 1s
          batch-size: 100
          concurrency: 4
