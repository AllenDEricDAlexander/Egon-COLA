spring:
  main:
    web-application-type: none

egon:
  cola:
    component:
      rpc:
        enabled: false
        tls:
          enabled: false
          development-plaintext: false
      tianshu:
        rpc:
          tls:
            enabled: false
            development-plaintext: false
        registry:
          http:
            enabled: false
  tianquan-shoubing:
    oauth:
      migration:
        enabled: false

egon.cola.platform:
  tianquan:
    shoubing:
      revocation:
        primary-endpoint: ${TIANQUAN_SHOUBING_REVOCATION_PRIMARY_ENDPOINT}
      usage-observation:
        receiver: SHOUBING
        enabled: false
        fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
        allow-local-plaintext: false
      audit:
        delivery:
          receipt-ttl: PT1H
          confirmation-timeout: PT30S
          batch-size: 100

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping
