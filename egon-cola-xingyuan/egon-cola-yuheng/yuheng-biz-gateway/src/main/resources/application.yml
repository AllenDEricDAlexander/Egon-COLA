spring:
  application:
    name: egon-cola-gateway-engine
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/gateway-engine.properties
      - optional:ddc:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: 18083
  shutdown: graceful

management:
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

egon:
  cola:
    platform:
      idp:
        enabled: ${DDC_ENABLED:true}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${GATEWAY_ENGINE_RESOURCE_SERVER_ID:}
        resource-uri: ${GATEWAY_ENGINE_RESOURCE_URI:}
        gateway:
          enabled: ${IDP_GATEWAY_ENABLED:true}
          issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
          jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
          idp-refresh-uri: ${IDP_REFRESH_URI:http://127.0.0.1:18120/oauth2/token}
          access-token-cookie-name: ${IDP_ACCESS_TOKEN_COOKIE_NAME:__Host-egon_user_at}
          refresh-token-cookie-name: ${IDP_REFRESH_TOKEN_COOKIE_NAME:__Host-egon_user_rt}
          refresh-status-resource-uri: ${IDP_REFRESH_STATUS_RESOURCE_URI:https://api.egon.internal/local/permission/idp}
          refresh-status-scopes: ${IDP_REFRESH_STATUS_SCOPES:idp:refresh-token:validate}
          trusted-origins: ${IDP_GATEWAY_TRUSTED_ORIGINS:}
          user-state-key-prefix: "identity:v1:user:"
          runtime:
            redis-enabled: true
            redis-address: ${IDP_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${IDP_REDIS_DATABASE:0}
            password-file: ${IDP_REDIS_PASSWORD_FILE:}
            timeout: ${IDP_REDIS_TIMEOUT:2s}
      rbac3:
        gateway:
          enabled: ${GATEWAY_RBAC3_SCOPE_ENABLED:true}
          runtime:
            redis-enabled: ${GATEWAY_RBAC3_SCOPE_ENABLED:true}
            redis-address: ${GATEWAY_RBAC3_SCOPE_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${GATEWAY_RBAC3_SCOPE_REDIS_DATABASE:8}
            password-file: ${GATEWAY_RBAC3_SCOPE_REDIS_PASSWORD_FILE:}
            timeout: ${GATEWAY_RBAC3_SCOPE_REDIS_TIMEOUT:2s}
    component:
      rpc:
        tls:
          enabled: ${IDP_ADMISSION_RPC_TLS_ENABLED:false}
          development-plaintext: ${IDP_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}}
          certificate-chain-path: ${IDP_ADMISSION_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${IDP_ADMISSION_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${IDP_ADMISSION_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      ddc:
        enabled: ${DDC_ENABLED:true}
        biz-code: ${DDC_BIZ_CODE:infra}
        env: ${DDC_ENV:local}
        app-code: ${DDC_APP_CODE:ge}
        max-config-bytes: ${DDC_MAX_CONFIG_BYTES:1048576}
        instance:
          id: ${GATEWAY_ENGINE_DDC_INSTANCE_ID:}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///ddc-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:false}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: true
          mode: ${DDC_REDIS_MODE:SINGLE}
          host: ${DDC_REDIS_HOST:127.0.0.1}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:true}
          http:
            enabled: ${GATEWAY_ENGINE_DDC_REGISTRATION_ENABLED:true}
            instance-id: ${GATEWAY_ENGINE_DDC_INSTANCE_ID:}
            service-name: egon-cola-gateway-engine
            version: ${GATEWAY_ENGINE_VERSION:5.3.2}
            protocol: http
            advertised-host: ${GATEWAY_ENGINE_DDC_ADVERTISED_HOST:127.0.0.1}
            port: ${GATEWAY_ENGINE_DDC_ADVERTISED_PORT:18081}
            metadata:
              gateway.component: engine
              gateway.engine.role: API_RPC
      gateway:
        engine:
          tls-reload:
            enabled: false
          http:
            public-tls:
              enabled: false
              development-plaintext: true
            internal-tls:
              enabled: false
              development-plaintext: true
          rpc:
            service-name: egon-gateway-rpc
            group: default
            version: 1.0.0
            tls:
              enabled: false
              development-plaintext: true
          traffic:
            redis:
              enabled: false
              address: redis://127.0.0.1:6379
              database: 0
              password:
          kafka:
            enabled: false
