spring:
  application:
    name: egon-cola-yuheng-biz-gateway
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/yuheng-biz-gateway.properties
      - optional:tianshu:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 127.0.0.1
  port: 18083
  shutdown: graceful

management:
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gatewayTls
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

egon:
  cola:
    platform:
      tianquan-shoubing:
        enabled: ${TIANSHU_ENABLED:true}
        register-filter: false
        issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${YUHENG_ENGINE_RESOURCE_SERVER_ID:}
        resource-uri: ${YUHENG_ENGINE_RESOURCE_URI:}
        yuheng:
          enabled: ${TIANQUAN_SHOUBING_YUHENG_ENABLED:true}
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER:http://127.0.0.1:18120}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
          tianquan-shoubing-refresh-uri: ${TIANQUAN_SHOUBING_REFRESH_URI:http://127.0.0.1:18120/oauth2/token}
          access-token-cookie-name: ${TIANQUAN_SHOUBING_ACCESS_TOKEN_COOKIE_NAME:__Host-egon_user_at}
          refresh-token-cookie-name: ${TIANQUAN_SHOUBING_REFRESH_TOKEN_COOKIE_NAME:__Host-egon_user_rt}
          refresh-status-resource-uri: ${TIANQUAN_SHOUBING_REFRESH_STATUS_RESOURCE_URI:https://api.egon.internal/local/permission/tianquan-shoubing}
          refresh-status-scopes: ${TIANQUAN_SHOUBING_REFRESH_STATUS_SCOPES:tianquan-shoubing:refresh-token:validate}
          trusted-origins: ${TIANQUAN_SHOUBING_YUHENG_TRUSTED_ORIGINS:}
          user-state-key-prefix: "identity:v1:user:"
          runtime:
            redis-enabled: true
            redis-address: ${TIANQUAN_SHOUBING_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${TIANQUAN_SHOUBING_REDIS_DATABASE:0}
            password-file: ${TIANQUAN_SHOUBING_REDIS_PASSWORD_FILE:}
            timeout: ${TIANQUAN_SHOUBING_REDIS_TIMEOUT:2s}
      tianquan-jianshen:
        yuheng:
          enabled: ${YUHENG_TIANQUAN_JIANSHEN_SCOPE_ENABLED:true}
          runtime:
            redis-enabled: ${YUHENG_TIANQUAN_JIANSHEN_SCOPE_ENABLED:true}
            redis-address: ${YUHENG_TIANQUAN_JIANSHEN_SCOPE_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${YUHENG_TIANQUAN_JIANSHEN_SCOPE_REDIS_DATABASE:8}
            password-file: ${YUHENG_TIANQUAN_JIANSHEN_SCOPE_REDIS_PASSWORD_FILE:}
            timeout: ${YUHENG_TIANQUAN_JIANSHEN_SCOPE_REDIS_TIMEOUT:2s}
    component:
      rpc:
        tls:
          enabled: ${TIANQUAN_SHOUBING_ADMISSION_RPC_TLS_ENABLED:false}
          development-plaintext: ${TIANQUAN_SHOUBING_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}}
          certificate-chain-path: ${TIANQUAN_SHOUBING_ADMISSION_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${TIANQUAN_SHOUBING_ADMISSION_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${TIANQUAN_SHOUBING_ADMISSION_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      tianshu:
        enabled: ${TIANSHU_ENABLED:true}
        biz-code: ${TIANSHU_BIZ_CODE:infra}
        env: ${TIANSHU_ENV:local}
        app-code: ${TIANSHU_APP_CODE:ge}
        max-config-bytes: ${TIANSHU_MAX_CONFIG_BYTES:1048576}
        instance:
          id: ${YUHENG_ENGINE_TIANSHU_INSTANCE_ID:}
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///tianshu-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${TIANSHU_RPC_TLS_ENABLED:false}
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: true
          mode: ${TIANSHU_REDIS_MODE:SINGLE}
          host: ${TIANSHU_REDIS_HOST:127.0.0.1}
          port: ${TIANSHU_REDIS_PORT:6379}
          password: ${TIANSHU_REDIS_PASSWORD:}
          database: ${TIANSHU_REDIS_DATABASE:0}
        registry:
          enabled: ${TIANSHU_REGISTRY_ENABLED:true}
          http:
            enabled: ${YUHENG_ENGINE_TIANSHU_REGISTRATION_ENABLED:true}
            instance-id: ${YUHENG_ENGINE_TIANSHU_INSTANCE_ID:}
            service-name: egon-cola-yuheng-biz-gateway
            version: ${YUHENG_ENGINE_VERSION:5.3.2}
            protocol: http
            advertised-host: ${YUHENG_ENGINE_TIANSHU_ADVERTISED_HOST:127.0.0.1}
            port: ${YUHENG_ENGINE_TIANSHU_ADVERTISED_PORT:18081}
            metadata:
              yuheng.component: engine
              yuheng.engine.role: API_RPC
      yuheng:
        engine:
          tls-reload:
            enabled: true
          http:
            public-tls:
              enabled: false
              development-plaintext: true
            internal-tls:
              enabled: false
              development-plaintext: true
          rpc:
            service-name: egon-yuheng-rpc
            group: default
            version: 1.0.0
            tls:
              enabled: false
              development-plaintext: true
          traffic:
            redis:
              enabled: false
              address: redis://127.0.0.1:6379
              database: 0
              password:
          kafka:
            enabled: false
