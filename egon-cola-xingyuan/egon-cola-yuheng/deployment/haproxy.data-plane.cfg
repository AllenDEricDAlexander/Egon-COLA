global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 120s
  timeout server 120s
  timeout tunnel 1h

frontend gateway_data_plane
  bind *:18081
  # Preserve Host, Path, authorization and MCP protocol headers without rewriting.
  acl is_mcp path_beg /mcp/ /legacy/mcp/ /.well-known/oauth-protected-resource/mcp/
  use_backend gateway_mcp_engines if is_mcp
  default_backend gateway_api_rpc_engines

backend gateway_api_rpc_engines
  balance roundrobin
  option httpchk
  http-check connect port 18083
  http-check send meth GET uri /actuator/health/readiness ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  server api-1 yuheng-biz-gateway:18081 check
  server api-2 yuheng-biz-gateway-2:18081 check

backend gateway_mcp_engines
  balance roundrobin
  option httpchk
  http-check connect port 18085
  http-check send meth GET uri /actuator/health/readiness ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  server mcp-1 yuheng-mcp-gateway:18084 check
  server mcp-2 yuheng-mcp-gateway-2:18084 check
