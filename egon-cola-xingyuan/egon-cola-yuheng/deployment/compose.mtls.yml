name: egon-cola-yuheng

services:
  tianshu-admin:
    environment:
      EGON_COLA_COMPONENT_TIANSHU_ADMIN_TRANSPORT_SECURITY_MODE: MTLS
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CLIENT_AUTH: need
      SERVER_SSL_BUNDLE: management
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_RELOAD_ON_UPDATE: "true"
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_CERTIFICATE: file:/run/egon-tls/tianshu-admin.crt
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_PRIVATE_KEY: file:/run/egon-tls/tianshu-admin.key
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_TRUSTSTORE_CERTIFICATE: file:/run/egon-tls/ca.crt
      TIANSHU_RPC_TLS_ENABLED: "true"
      TIANSHU_RPC_DEVELOPMENT_PLAINTEXT: "false"
      TIANSHU_RPC_CERTIFICATE_CHAIN_PATH: /run/egon-tls/tianshu-admin.crt
      TIANSHU_RPC_PRIVATE_KEY_PATH: /run/egon-tls/tianshu-admin.key
      TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -o pipefail -ec 'printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" |
          openssl s_client -quiet -connect 127.0.0.1:18080 -servername tianshu-admin
          -verify_return_error -verify_hostname tianshu-admin -CAfile /run/egon-tls/ca.crt
          -cert /run/egon-tls/tianshu-admin.crt -key /run/egon-tls/tianshu-admin.key |
          grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-admin:
    environment:
      YUHENG_ADMIN_TRANSPORT_SECURITY_MODE: MTLS
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CLIENT_AUTH: need
      SERVER_SSL_BUNDLE: management
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_RELOAD_ON_UPDATE: "true"
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_CERTIFICATE: file:/run/egon-tls/yuheng-admin.crt
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_PRIVATE_KEY: file:/run/egon-tls/yuheng-admin.key
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_TRUSTSTORE_CERTIFICATE: file:/run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-admin.crt
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-admin.key
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -o pipefail -ec 'printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" |
          openssl s_client -quiet -connect 127.0.0.1:18080 -servername yuheng-admin
          -verify_return_error -verify_hostname yuheng-admin -CAfile /run/egon-tls/ca.crt
          -cert /run/egon-tls/yuheng-admin.crt -key /run/egon-tls/yuheng-admin.key |
          grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-biz-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      EGON_COLA_COMPONENT_YUHENG_ENGINE_TLS_RELOAD_ENABLED: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway.crt
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway.key
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway.key
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway.key
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway.key
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-biz-gateway-2:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      EGON_COLA_COMPONENT_YUHENG_ENGINE_TLS_RELOAD_ENABLED: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway-2.crt
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway-2.key
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway-2.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_PUBLIC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway-2.key
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway-2.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway-2.key
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_HTTP_INTERNAL_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-biz-gateway-2.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-biz-gateway-2.key
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-mcp-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-mcp-gateway.crt
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-mcp-gateway.key
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      YUHENG_MCP_ENGINE_TLS_ENABLED: "true"
      YUHENG_MCP_ENGINE_DEVELOPMENT_PLAINTEXT: "false"
      YUHENG_MCP_ENGINE_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-mcp-gateway.crt
      YUHENG_MCP_ENGINE_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-mcp-gateway.key
      YUHENG_MCP_ENGINE_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      YUHENG_MCP_ENGINE_CLIENT_CERTIFICATE_REQUIRED: "true"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_TLS_ENABLED: "true"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_DEVELOPMENT_PLAINTEXT: "false"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-mcp-gateway.crt
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-mcp-gateway.key
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-mcp-gateway-2:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-mcp-gateway-2.crt
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-mcp-gateway-2.key
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      YUHENG_MCP_ENGINE_TLS_ENABLED: "true"
      YUHENG_MCP_ENGINE_DEVELOPMENT_PLAINTEXT: "false"
      YUHENG_MCP_ENGINE_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-mcp-gateway-2.crt
      YUHENG_MCP_ENGINE_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-mcp-gateway-2.key
      YUHENG_MCP_ENGINE_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      YUHENG_MCP_ENGINE_CLIENT_CERTIFICATE_REQUIRED: "true"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_TLS_ENABLED: "true"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_DEVELOPMENT_PLAINTEXT: "false"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_CERTIFICATE_CHAIN_PATH: /run/egon-tls/yuheng-mcp-gateway-2.crt
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-mcp-gateway-2.key
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-data-plane-proxy:
    volumes:
      - ./haproxy.data-plane.mtls.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro

  yuheng-admin-web:
    environment:
      YUHENG_ADMIN_API_BASE_URL: https://yuheng-admin:18080
      YUHENG_ADMIN_API_DEVELOPMENT_PLAINTEXT: "false"
      YUHENG_ADMIN_API_TLS_CA_PATH: /run/egon-tls/ca.crt
      YUHENG_ADMIN_API_TLS_CERTIFICATE_PATH: /run/egon-tls/yuheng-admin-web.crt
      YUHENG_ADMIN_API_TLS_PRIVATE_KEY_PATH: /run/egon-tls/yuheng-admin-web.key
    volumes:
      - ${YUHENG_TLS_DIRECTORY:?set YUHENG_TLS_DIRECTORY}:/run/egon-tls:ro
