      YUHENG_MCP_ENGINE_RESOURCE_SERVER_ID: ${YUHENG_MCP_RESOURCE_SERVER_ID}
      YUHENG_MCP_ENGINE_RESOURCE_URI: ${YUHENG_MCP_RESOURCE_URI}
      TIANQUAN_SHOUBING_OAUTH_ISSUER: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      TIANQUAN_SHOUBING_JWK_SET_URI: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      YUHENG_MCP_POSTGRES_URL: jdbc:postgresql://postgres:5432/gateway_admin
      YUHENG_MCP_POSTGRES_USER: yuheng
      YUHENG_MCP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      YUHENG_MCP_REDIS_ADDRESS: redis://rate-limit-redis:6379
      YUHENG_MCP_ARTIFACT_ROOT: /var/lib/egon-yuheng-mcp/artifacts
    depends_on:
      yuheng-admin:
        condition: service_started
      tianshu-admin:
        condition: service_started
      postgres:
        condition: service_healthy
      rate-limit-redis:
        condition: service_healthy
    volumes:
      - yuheng-mcp-gateway-2-lkg:/var/lib/egon-yuheng-mcp
      - ${YUHENG_MCP_ARTIFACT_DIRECTORY:?set YUHENG_MCP_ARTIFACT_DIRECTORY}:/var/lib/egon-yuheng-mcp/artifacts
    ports:
      - "127.0.0.1:18184:18084"
      - "127.0.0.1:18185:18085"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18085;
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3;
          grep -q " 200 " <&3'
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

  yuheng-data-plane-proxy:
    image: haproxy:3.1-alpine
    volumes:
      - ./haproxy.data-plane.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - yuheng-biz-gateway
      - yuheng-biz-gateway-2
      - yuheng-mcp-gateway
      - yuheng-mcp-gateway-2
    ports:
      - "18081:18081"
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

  yuheng-admin-web:
    build:
      context: ../yuheng-admin-web
    environment:
      PORT: 8080
      YUHENG_ADMIN_API_BASE_URL: http://yuheng-admin:18080
      YUHENG_ADMIN_API_DEVELOPMENT_PLAINTEXT: "true"
    depends_on:
      yuheng-admin:
        condition: service_started
    ports:
      - "18090:8080"
    restart: unless-stopped

volumes:
  yuheng-postgres:
  yuheng-tianshu-redis:
  yuheng-rate-redis:
  yuheng-kafka:
  yuheng-biz-gateway-lkg:
  yuheng-biz-gateway-2-lkg:
  yuheng-mcp-gateway-lkg:
  yuheng-mcp-gateway-2-lkg:
