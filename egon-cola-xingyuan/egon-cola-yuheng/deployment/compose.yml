      EGON_COLA_COMPONENT_ID_MACHINE_ID: "11"
      EGON_COLA_COMPONENT_TIANSHU_INSTANCE_ID: yuheng-biz-gateway-2
      YUHENG_ENGINE_TIANSHU_INSTANCE_ID: yuheng-biz-gateway-2
