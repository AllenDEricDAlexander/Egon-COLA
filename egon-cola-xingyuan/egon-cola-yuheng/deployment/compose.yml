      TIANQUAN_SHOUBING_OAUTH_ISSUER: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      TIANQUAN_SHOUBING_JWK_SET_URI: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      EGON_COLA_COMPONENT_TIANSHU_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_TIANSHU_APP_CODE: ge
      EGON_COLA_COMPONENT_TIANSHU_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_TIANSHU_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REGISTRY_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      EGON_COLA_COMPONENT_YUHENG_ENGINE_YUHENG_GROUP_CODE: ${YUHENG_GROUP_CODE:-default}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_NODE_ID: yuheng-biz-gateway-2
      EGON_COLA_COMPONENT_YUHENG_ENGINE_INSTANCE_ID: yuheng-biz-gateway-2
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_ADVERTISED_HOST: yuheng-biz-gateway-2
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_SERVICE_NAME: ${YUHENG_RPC_SERVICE_NAME}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_GROUP: ${YUHENG_RPC_GROUP}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_VERSION: ${YUHENG_RPC_VERSION}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_DATA_DIRECTORY: /var/lib/egon-yuheng
      EGON_COLA_COMPONENT_YUHENG_ENGINE_TRAFFIC_REDIS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_TRAFFIC_REDIS_ADDRESS: redis://rate-limit-redis:6379
      EGON_COLA_COMPONENT_YUHENG_ENGINE_KAFKA_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      tianshu-admin:
        condition: service_started
      rate-limit-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - yuheng-biz-gateway-2-lkg:/var/lib/egon-yuheng
    ports:
      - "18181:18081"
      - "18182:18082"
      - "127.0.0.1:18183:18083"
      - "19190:19090"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18083;
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3;
          grep -q " 200 " <&3'
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

  yuheng-mcp-gateway:
