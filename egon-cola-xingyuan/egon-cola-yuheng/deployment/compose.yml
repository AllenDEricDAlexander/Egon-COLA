      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      YUHENG_MCP_ENGINE_TIANSHU_INSTANCE_ID: yuheng-mcp-gateway-2
      YUHENG_MCP_ENGINE_TIANSHU_ADVERTISED_HOST: yuheng-mcp-gateway-2
      YUHENG_MCP_ENGINE_NODE_ID: yuheng-mcp-gateway-2
      YUHENG_MCP_ENGINE_GROUP_CODE: ${YUHENG_GROUP_CODE:-default}
      YUHENG_MCP_ENGINE_ENV: ${YUHENG_ENV:-local}
