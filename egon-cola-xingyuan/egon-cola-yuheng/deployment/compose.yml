name: egon-cola-yuheng

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: yuheng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - yuheng-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuheng -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tianshu-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - yuheng-tianshu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rate-limit-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - yuheng-rate-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - yuheng-kafka:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  tianshu-admin:
    build:
      context: ../../egon-cola-tianshu/egon-cola-tianshu-admin
    environment:
      SERVER_PORT: 18080
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/egon-config/tianshu-rpc-credentials.yml
      YUHENG_MCP_TIANSHU_RUNTIME_ACCESS_KEY: ${YUHENG_MCP_TIANSHU_RUNTIME_ACCESS_KEY}
      YUHENG_MCP_TIANSHU_RUNTIME_SECRET_KEY: ${YUHENG_MCP_TIANSHU_RUNTIME_SECRET_KEY}
      YUHENG_MCP_TIANSHU_REGISTRY_ACCESS_KEY: ${YUHENG_MCP_TIANSHU_REGISTRY_ACCESS_KEY}
      YUHENG_MCP_TIANSHU_REGISTRY_SECRET_KEY: ${YUHENG_MCP_TIANSHU_REGISTRY_SECRET_KEY}
      YUHENG_BIZ_CODE: ${YUHENG_BIZ_CODE}
      YUHENG_ENV: ${YUHENG_ENV:-local}
      YUHENG_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_ID_MACHINE_ID: "1"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway_ddc
      SPRING_DATASOURCE_USERNAME: yuheng
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EGON_COLA_COMPONENT_TIANSHU_ADMIN_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_ADMIN_REDIS_PORT: 6379
      TIANSHU_RPC_PORT: 19080
      TIANSHU_RPC_DEVELOPMENT_PLAINTEXT: "true"
      TIANSHU_RPC_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      TIANSHU_RPC_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      TIANSHU_RPC_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      TIANSHU_RPC_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      TIANSHU_RPC_MANAGEMENT_ACCESS_KEY: ${TIANSHU_MANAGEMENT_ACCESS_KEY}
      TIANSHU_RPC_MANAGEMENT_SECRET_KEY: ${TIANSHU_MANAGEMENT_SECRET_KEY}
    volumes:
      - ./tianshu-rpc-credentials.yml:/run/egon-config/tianshu-rpc-credentials.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      tianshu-redis:
        condition: service_healthy
    ports:
      - "18070:18080"
      - "19080:19080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18080;
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3;
          grep -q " 200 " <&3'
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  yuheng-admin:
    build:
      context: ../yuheng-admin
    environment:
      SERVER_PORT: 18080
      EGON_COLA_COMPONENT_ID_MACHINE_ID: "2"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway_admin
      SPRING_DATASOURCE_USERNAME: yuheng
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      YUHENG_ADMIN_TIANSHU_ENABLED: "true"
      YUHENG_ADMIN_TIANSHU_API_RPC_BIZ_CODE: ${YUHENG_BIZ_CODE}
      YUHENG_ADMIN_TIANSHU_API_RPC_APP_CODE: ge
      YUHENG_ADMIN_TIANSHU_MCP_BIZ_CODE: ${YUHENG_BIZ_CODE}
      YUHENG_ADMIN_TIANSHU_MCP_APP_CODE: gme
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_MANAGEMENT_ACCESS_KEY: ${TIANSHU_MANAGEMENT_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_MANAGEMENT_SECRET_KEY: ${TIANSHU_MANAGEMENT_SECRET_KEY}
      YUHENG_ADMIN_SECRETS_MASTER_KEY_BASE64: ${YUHENG_MASTER_KEY_BASE64}
      YUHENG_ADMIN_SECURITY_HMAC_SECRET_BASE64: ${YUHENG_ADMIN_JWT_HMAC_SECRET_BASE64}
      YUHENG_ADMIN_OBSERVABILITY_KAFKA_ENABLED: "true"
      YUHENG_ADMIN_OBSERVABILITY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      tianshu-admin:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "18080:18080"
    stop_grace_period: 30s
    restart: unless-stopped

  yuheng-biz-gateway:
    build:
      context: ../yuheng-biz-gateway
    environment:
      SERVER_PORT: 18083
      EGON_COLA_COMPONENT_ID_MACHINE_ID: "10"
      EGON_COLA_COMPONENT_TIANSHU_INSTANCE_ID: yuheng-biz-gateway
      YUHENG_ENGINE_TIANSHU_INSTANCE_ID: yuheng-biz-gateway
      YUHENG_ENGINE_TIANSHU_ADVERTISED_HOST: yuheng-biz-gateway
      YUHENG_ENGINE_RESOURCE_SERVER_ID: ${YUHENG_API_RESOURCE_SERVER_ID}
      YUHENG_ENGINE_RESOURCE_URI: ${YUHENG_API_RESOURCE_URI}
      TIANQUAN_SHOUBING_OAUTH_ISSUER: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      TIANQUAN_SHOUBING_JWK_SET_URI: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      EGON_COLA_COMPONENT_TIANSHU_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_TIANSHU_APP_CODE: ge
      EGON_COLA_COMPONENT_TIANSHU_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_TIANSHU_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REGISTRY_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      EGON_COLA_COMPONENT_YUHENG_ENGINE_YUHENG_GROUP_CODE: ${YUHENG_GROUP_CODE:-default}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_NODE_ID: yuheng-biz-gateway
      EGON_COLA_COMPONENT_YUHENG_ENGINE_INSTANCE_ID: yuheng-biz-gateway
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_ADVERTISED_HOST: yuheng-biz-gateway
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_SERVICE_NAME: ${YUHENG_RPC_SERVICE_NAME}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_GROUP: ${YUHENG_RPC_GROUP}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_RPC_VERSION: ${YUHENG_RPC_VERSION}
      EGON_COLA_COMPONENT_YUHENG_ENGINE_DATA_DIRECTORY: /var/lib/egon-yuheng
      EGON_COLA_COMPONENT_YUHENG_ENGINE_TRAFFIC_REDIS_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_TRAFFIC_REDIS_ADDRESS: redis://rate-limit-redis:6379
      EGON_COLA_COMPONENT_YUHENG_ENGINE_KAFKA_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_ENGINE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      tianshu-admin:
        condition: service_started
      rate-limit-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - yuheng-biz-gateway-lkg:/var/lib/egon-yuheng
    ports:
      - "127.0.0.1:18091:18081"
      - "18082:18082"
      - "127.0.0.1:18083:18083"
      - "19090:19090"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18083;
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3;
          grep -q " 200 " <&3'
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

  yuheng-biz-gateway-2:
    build:
