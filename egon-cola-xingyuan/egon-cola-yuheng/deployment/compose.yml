      EGON_COLA_COMPONENT_TIANSHU_INSTANCE_ID: yuheng-mcp-gateway
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${YUHENG_MCP_TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${YUHENG_MCP_TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${YUHENG_MCP_TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${YUHENG_MCP_TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      YUHENG_MCP_ENGINE_TIANSHU_INSTANCE_ID: yuheng-mcp-gateway
      YUHENG_MCP_ENGINE_TIANSHU_ADVERTISED_HOST: yuheng-mcp-gateway
      YUHENG_MCP_ENGINE_NODE_ID: yuheng-mcp-gateway
      YUHENG_MCP_ENGINE_GROUP_CODE: ${YUHENG_GROUP_CODE:-default}
      YUHENG_MCP_ENGINE_ENV: ${YUHENG_ENV:-local}
      YUHENG_MCP_ENGINE_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      YUHENG_MCP_ENGINE_DATA_DIRECTORY: /var/lib/egon-yuheng-mcp/rules
      YUHENG_MCP_ENGINE_PORT: 18084
      YUHENG_MCP_ENGINE_MANAGEMENT_PORT: 18085
      YUHENG_MCP_ENGINE_DEVELOPMENT_PLAINTEXT: "true"
      YUHENG_MCP_ENGINE_OUTBOUND_RPC_DEVELOPMENT_PLAINTEXT: "true"
      YUHENG_MCP_ENGINE_RESOURCE_SERVER_ID: ${YUHENG_MCP_RESOURCE_SERVER_ID}
      YUHENG_MCP_ENGINE_RESOURCE_URI: ${YUHENG_MCP_RESOURCE_URI}
      TIANQUAN_SHOUBING_OAUTH_ISSUER: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      TIANQUAN_SHOUBING_JWK_SET_URI: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      YUHENG_MCP_POSTGRES_URL: jdbc:postgresql://postgres:5432/gateway_admin
      YUHENG_MCP_POSTGRES_USER: yuheng
      YUHENG_MCP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      YUHENG_MCP_REDIS_ADDRESS: redis://rate-limit-redis:6379
      YUHENG_MCP_ARTIFACT_ROOT: /var/lib/egon-yuheng-mcp/artifacts
    depends_on:
      yuheng-admin:
        condition: service_started
      tianshu-admin:
        condition: service_started
      postgres:
        condition: service_healthy
      rate-limit-redis:
        condition: service_healthy
    volumes:
      - yuheng-mcp-gateway-lkg:/var/lib/egon-yuheng-mcp
      - ${YUHENG_MCP_ARTIFACT_DIRECTORY:?set YUHENG_MCP_ARTIFACT_DIRECTORY}:/var/lib/egon-yuheng-mcp/artifacts
    ports:
      - "127.0.0.1:18084:18084"
      - "127.0.0.1:18085:18085"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18085;
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3;
          grep -q " 200 " <&3'
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

