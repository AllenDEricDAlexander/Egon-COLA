services:
  http-provider-mvc:
    build:
      context: ../../..
      dockerfile: egon-cola-xingyuan/egon-cola-yuheng/deployment/Dockerfile.test-app
      args:
        APP_JAR: egon-cola-xingyuan/egon-cola-yuheng/yuheng-test/yuheng-test-http-provider/target/yuheng-test-http-provider-exec.jar
    env_file:
      - path: .demo/http-provider.env
        required: false
    environment:
      SERVER_PORT: 18080
      EGON_COLA_COMPONENT_TIANSHU_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_TIANSHU_APP_CODE: yuheng-test-http-provider
      EGON_COLA_COMPONENT_TIANSHU_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_TIANSHU_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REGISTRY_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      YUHENG_TEST_PROVIDER_ID: http-provider-mvc-demo
      YUHENG_TEST_SERVICE_VERSION: ${DEMO_SERVICE_VERSION:-1.0.0-demo}
      YUHENG_TEST_ADVERTISED_HOST: http-provider-mvc
      YUHENG_TEST_ADVERTISED_PORT: 18080
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ADMIN_BASE_URL: http://yuheng-admin:18080
      EGON_COLA_COMPONENT_YUHENG_REPORTING_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_YUHENG_REPORTING_APPLICATION_CODE: yuheng-test-http-provider
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_YUHENG_REPORTING_NAMESPACE: ${YUHENG_NAMESPACE:-default}
    depends_on:
      yuheng-admin: {condition: service_started}
      tianshu-admin: {condition: service_started}
    ports: ["18094:18080"]

  http-provider-webflux:
    build:
      context: ../../..
      dockerfile: egon-cola-xingyuan/egon-cola-yuheng/deployment/Dockerfile.test-app
      args:
        APP_JAR: egon-cola-xingyuan/egon-cola-yuheng/yuheng-test/yuheng-test-webflux-http-provider/target/yuheng-test-webflux-http-provider-exec.jar
    environment:
      SERVER_PORT: 18080
      EGON_COLA_COMPONENT_TIANSHU_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_TIANSHU_APP_CODE: yuheng-test-http-provider
      EGON_COLA_COMPONENT_TIANSHU_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_TIANSHU_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REGISTRY_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      YUHENG_TEST_PROVIDER_ID: http-provider-webflux-demo
      YUHENG_TEST_SERVICE_VERSION: ${DEMO_SERVICE_VERSION:-1.0.0-demo}
      YUHENG_TEST_ADVERTISED_HOST: http-provider-webflux
      YUHENG_TEST_ADVERTISED_PORT: 18080
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ENABLED: "false"
    depends_on: {tianshu-admin: {condition: service_started}}
    ports: ["18095:18080"]

  rpc-provider:
    build:
      context: ../../..
      dockerfile: egon-cola-xingyuan/egon-cola-yuheng/deployment/Dockerfile.test-app
      args:
        APP_JAR: egon-cola-xingyuan/egon-cola-yuheng/yuheng-test/yuheng-test-rpc-provider/target/yuheng-test-rpc-provider-exec.jar
    env_file:
      - path: .demo/rpc-provider.env
        required: false
    environment:
      SERVER_PORT: 18080
      EGON_COLA_COMPONENT_TIANSHU_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_TIANSHU_APP_CODE: yuheng-test-rpc-provider
      EGON_COLA_COMPONENT_TIANSHU_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_TIANSHU_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REGISTRY_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      EGON_COLA_COMPONENT_RPC_ENABLED: "true"
      EGON_COLA_COMPONENT_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_RPC_PROVIDER_ENABLED: "true"
      EGON_COLA_COMPONENT_RPC_PROVIDER_PORT: 19091
      EGON_COLA_COMPONENT_RPC_PROVIDER_ADVERTISED_HOST: rpc-provider
      EGON_COLA_COMPONENT_RPC_PROVIDER_ADVERTISED_PORT: 19091
      YUHENG_TEST_PROVIDER_ID: rpc-provider-demo
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ENABLED: "true"
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ADMIN_BASE_URL: http://yuheng-admin:18080
      EGON_COLA_COMPONENT_YUHENG_REPORTING_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_YUHENG_REPORTING_APPLICATION_CODE: yuheng-test-rpc-provider
      EGON_COLA_COMPONENT_YUHENG_REPORTING_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_YUHENG_REPORTING_NAMESPACE: ${YUHENG_NAMESPACE:-default}
    depends_on:
      yuheng-admin: {condition: service_started}
      tianshu-admin: {condition: service_started}
    ports: ["18086:18080", "19091:19091"]

  rpc-consumer:
    build:
      context: ../../..
      dockerfile: egon-cola-xingyuan/egon-cola-yuheng/deployment/Dockerfile.test-app
      args:
        APP_JAR: egon-cola-xingyuan/egon-cola-yuheng/yuheng-test/yuheng-test-rpc-consumer/target/yuheng-test-rpc-consumer-exec.jar
    environment:
      SERVER_PORT: 18080
      EGON_COLA_COMPONENT_TIANSHU_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_BIZ_CODE: ${YUHENG_BIZ_CODE}
      EGON_COLA_COMPONENT_TIANSHU_APP_CODE: yuheng-test-rpc-consumer
      EGON_COLA_COMPONENT_TIANSHU_ENV: ${YUHENG_ENV:-local}
      EGON_COLA_COMPONENT_TIANSHU_NAMESPACE: ${YUHENG_NAMESPACE:-default}
      EGON_COLA_COMPONENT_TIANSHU_RPC_TARGET: dns:///tianshu-admin:19080
      EGON_COLA_COMPONENT_TIANSHU_RPC_LOAD_BALANCING_POLICY: round_robin
      EGON_COLA_COMPONENT_TIANSHU_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_ACCESS_KEY: ${TIANSHU_RUNTIME_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_RUNTIME_SECRET_KEY: ${TIANSHU_RUNTIME_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_ACCESS_KEY: ${TIANSHU_REGISTRY_ACCESS_KEY}
      EGON_COLA_COMPONENT_TIANSHU_RPC_AUTH_REGISTRY_SECRET_KEY: ${TIANSHU_REGISTRY_SECRET_KEY}
      EGON_COLA_COMPONENT_TIANSHU_REGISTRY_ENABLED: "true"
      EGON_COLA_COMPONENT_TIANSHU_REDIS_HOST: tianshu-redis
      EGON_COLA_COMPONENT_TIANSHU_REDIS_PORT: 6379
      EGON_COLA_COMPONENT_RPC_ENABLED: "true"
      EGON_COLA_COMPONENT_RPC_TLS_DEVELOPMENT_PLAINTEXT: "true"
      EGON_COLA_COMPONENT_RPC_CONSUMER_ENABLED: "true"
      EGON_COLA_COMPONENT_RPC_CONSUMER_YUHENG_SERVICE_NAME: ${YUHENG_RPC_SERVICE_NAME:-egon-yuheng-rpc}
      EGON_COLA_COMPONENT_RPC_CONSUMER_YUHENG_GROUP: ${YUHENG_RPC_GROUP:-default}
      EGON_COLA_COMPONENT_RPC_CONSUMER_YUHENG_VERSION: ${YUHENG_RPC_VERSION:-1.0.0}
    depends_on:
      yuheng-biz-gateway: {condition: service_started}
      yuheng-biz-gateway-2: {condition: service_started}
    ports: ["18087:18080"]
