spring:
  application:
    name: yuheng-test-webflux-http-provider
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

yuheng:
  test:
    service-version: ${YUHENG_TEST_SERVICE_VERSION:1.0.0-live}

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: inventory-reactive
      paths-to-match:
        - /test/items/**
        - /api/providers/**
        - /test/transport/**

egon:
  cola:
    platform:
      tianquan-shoubing:
        service-client:
          app-id: ${YUHENG_TEST_TIANSHU_APP_ID:yuheng-test-webflux-http-provider}
          registration-id: ${YUHENG_TEST_TIANSHU_REGISTRATION_ID:yuheng-test-webflux-http-provider}
    component:
      id:
        enabled: false
      tianshu:
        enabled: false
        registration-resource-uri: ${TIANSHU_REGISTRATION_RESOURCE_URI:https://tianshu.egon.internal/local}
        biz-code: ${TIANSHU_BIZ_CODE:test-biz}
        app-code: ${TIANSHU_APP_CODE:yuheng-test-http-provider}
        env: test
        namespace: yuheng-test
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_REGISTRY_SECRET_KEY:}
        registry:
          enabled: false
          http:
            enabled: true
            instance-id: ${yuheng.test.provider-id:webflux-http-provider-default}
            service-name: yuheng-test-http-provider
            group: default
            version: ${yuheng.test.service-version}
            protocol: http
            advertised-host: ${yuheng.test.advertised-host:127.0.0.1}
            port: ${yuheng.test.advertised-port:0}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
            metadata:
              yuheng.zone: ${yuheng.test.zone:zone-b}
              yuheng.weight: ${yuheng.test.weight:100}
      yuheng:
        openapi:
          enabled: true
          publish-to-tianshu: true
          published-groups:
            - inventory-reactive
          biz-code: ${YUHENG_TEST_BIZ_CODE:yuheng-test}
          application-code: yuheng-test-webflux-http-provider
          resource-uri: ${YUHENG_TEST_RESOURCE_URI:https://yuheng-test-webflux-http-provider.example.test}
          artifact-version: ${yuheng.test.service-version}
          build-id: ${YUHENG_TEST_BUILD_ID:local-webflux}
