spring:
  application:
    name: gateway-test-http-provider
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  test:
    service-version: ${GATEWAY_TEST_SERVICE_VERSION:1.0.0-live}

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: orders
      paths-to-match:
        - /api/orders/**
        - /api/slow/**
        - /api/fail/**
        - /api/body/**
        - /api/providers/**
    - group: inventory
      paths-to-match:
        - /api/internal/inventory/**

egon:
  cola:
    platform:
      idp:
        service-client:
          app-id: ${GATEWAY_TEST_DDC_APP_ID:gateway-test-http-provider}
          registration-id: ${GATEWAY_TEST_DDC_REGISTRATION_ID:gateway-test-http-provider}
    component:
      id:
        enabled: false
      ddc:
        enabled: false
        registration-resource-uri: ${DDC_REGISTRATION_RESOURCE_URI:https://ddc.egon.internal/local}
        biz-code: ${DDC_BIZ_CODE:test-biz}
        app-code: ${DDC_APP_CODE:gateway-test-http-provider}
        env: ${DDC_ENV:test}
        namespace: ${DDC_NAMESPACE:gateway-test}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
        registry:
          enabled: false
          http:
            enabled: true
            instance-id: ${GATEWAY_TEST_DDC_INSTANCE_ID:${gateway.test.provider-id:http-provider-default}}
            service-name: ${GATEWAY_TEST_SERVICE_NAME:gateway-test-http-provider}
            group: default
            version: ${gateway.test.service-version}
            protocol: http
            advertised-host: ${gateway.test.advertised-host:127.0.0.1}
            port: ${gateway.test.advertised-port:0}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
            metadata:
              gateway.zone: ${gateway.test.zone:zone-a}
              gateway.weight: ${gateway.test.weight:100}
      gateway:
        openapi:
          enabled: true
          publish-to-ddc: true
          published-groups:
            - orders
            - inventory
          biz-code: ${GATEWAY_TEST_BIZ_CODE:gateway-test}
          application-code: gateway-test-http-provider
          resource-uri: ${GATEWAY_TEST_RESOURCE_URI:https://gateway-test-http-provider.example.test}
          artifact-version: ${gateway.test.service-version}
          build-id: ${GATEWAY_TEST_BUILD_ID:local-http}
