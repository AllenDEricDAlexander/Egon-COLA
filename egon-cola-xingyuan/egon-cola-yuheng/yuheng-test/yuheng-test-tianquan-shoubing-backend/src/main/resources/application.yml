spring:
  application:
    name: yuheng-test-tianquan-shoubing-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/mock-backend.properties
      - optional:tianshu:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: ${MOCK_BACKEND_PORT:18160}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: identity
      paths-to-match:
        - /api/mock/**

egon:
  cola:
    platform:
      tianquan-shoubing:
        enabled: true
        register-filter: false
        issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${MOCK_BACKEND_RESOURCE_SERVER_ID:identity-mock-backend-local}
        resource-uri: ${MOCK_BACKEND_RESOURCE_URI:https://api.egon.internal/local/identity/mock-backend}
      tianquan-jianshen:
        enabled: true
        register-filter: false
        system-code: mock-backend
        runtime:
          redis-enabled: true
          redis-address: ${MOCK_BACKEND_REDIS_ADDRESS:redis://127.0.0.1:6379}
          database: ${MOCK_BACKEND_REDIS_DATABASE:0}
        authorization:
          endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
    component:
      id:
        enabled: false
      rpc:
        tls:
          development-plaintext: ${TIANQUAN_SHOUBING_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:true}
      tianshu:
        enabled: ${MOCK_BACKEND_TIANSHU_ENABLED:false}
        biz-code: ${MOCK_BACKEND_RESOURCE_BIZ_CODE:identity}
        app-code: ${MOCK_BACKEND_RESOURCE_APP_CODE:mock-backend}
        env: ${DEPLOYMENT_ENV:local}
        namespace: ${DEPLOYMENT_NAMESPACE:default}
        instance:
          id: ${MOCK_BACKEND_INSTANCE_ID:mock-backend-local-1}
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: ${MOCK_BACKEND_TIANSHU_ENABLED:false}
          mode: SINGLE
          host: ${TIANSHU_REGISTRY_REDIS_HOST:127.0.0.1}
          port: ${TIANSHU_REGISTRY_REDIS_PORT:6379}
          password: ${TIANSHU_REGISTRY_REDIS_PASSWORD:}
          database: ${TIANSHU_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: ${MOCK_BACKEND_TIANSHU_ENABLED:false}
          http:
            enabled: ${MOCK_BACKEND_TIANSHU_ENABLED:false}
            instance-id: ${MOCK_BACKEND_INSTANCE_ID:mock-backend-local-1}
            service-name: mock-backend
            group: default
            version: ${MOCK_BACKEND_ARTIFACT_VERSION:5.3.2}
            protocol: http
            advertised-host: ${MOCK_BACKEND_ADVERTISED_HOST:127.0.0.1}
            port: ${MOCK_BACKEND_PORT:18160}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      yuheng:
        openapi:
          enabled: true
          publish-to-tianshu: true
          published-groups:
            - identity
          biz-code: ${MOCK_BACKEND_RESOURCE_BIZ_CODE:identity}
          application-code: ${MOCK_BACKEND_RESOURCE_APP_CODE:mock-backend}
          resource-uri: ${MOCK_BACKEND_RESOURCE_URI:https://api.egon.internal/local/identity/mock-backend}
          artifact-version: ${MOCK_BACKEND_ARTIFACT_VERSION:5.3.2}
          build-id: ${MOCK_BACKEND_BUILD_ID:local}
