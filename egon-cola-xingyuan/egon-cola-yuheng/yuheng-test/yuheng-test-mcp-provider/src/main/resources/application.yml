spring:
  application:
    name: yuheng-test-mcp-provider
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/mcp-provider.properties
      - optional:tianshu:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: ${MCP_TEST_PROVIDER_PORT:18150}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: jobs
      paths-to-match:
        - /api/mcp-fixtures/**

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          enabled: ${TIANSHU_ENABLED:false}
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER:http://127.0.0.1:18120}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
          resource-server-id: ${MCP_PROVIDER_RESOURCE_SERVER_ID:}
          resource-uri: ${MCP_PROVIDER_RESOURCE_URI:}
        jianshen:
          enabled: true
          register-filter: false
          system-code: mock-backend
          runtime:
            redis-enabled: true
            redis-address: ${MCP_PROVIDER_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${MCP_PROVIDER_REDIS_DATABASE:8}
            password-file: ${MCP_PROVIDER_REDIS_PASSWORD_FILE:}
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
    component:
      id:
        enabled: false
      rpc:
        tls:
          development-plaintext: ${TIANQUAN_SHOUBING_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:true}
      tianshu:
        enabled: ${TIANSHU_ENABLED:false}
        biz-code: ${TIANSHU_BIZ_CODE:test-biz}
        app-code: ${TIANSHU_APP_CODE:yuheng-test-mcp-provider}
        env: ${TIANSHU_ENV:local}
        namespace: ${TIANSHU_NAMESPACE:yuheng-test}
        instance:
          id: ${MCP_TEST_PROVIDER_INSTANCE_ID:mcp-provider-1}
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${TIANSHU_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: ${TIANSHU_REGISTRY_ENABLED:false}
          mode: SINGLE
          host: ${TIANSHU_REGISTRY_REDIS_HOST:127.0.0.1}
          port: ${TIANSHU_REGISTRY_REDIS_PORT:6379}
          password: ${TIANSHU_REGISTRY_REDIS_PASSWORD:}
          database: ${TIANSHU_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: ${TIANSHU_REGISTRY_ENABLED:false}
          http:
            enabled: true
            instance-id: ${MCP_TEST_PROVIDER_INSTANCE_ID:mcp-provider-1}
            service-name: yuheng-test-mcp-provider
            group: default
            version: 1.0.0
            protocol: http
            advertised-host: ${MCP_TEST_PROVIDER_HOST:127.0.0.1}
            port: ${MCP_TEST_PROVIDER_PORT:18150}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      yuheng:
        openapi:
          enabled: true
          publish-to-tianshu: true
          published-groups:
            - jobs
          biz-code: ${TIANSHU_BIZ_CODE:test-biz}
          application-code: yuheng-test-mcp-provider
          resource-uri: ${MCP_PROVIDER_RESOURCE_URI:https://api.egon.internal/local/yuheng-test-mcp-provider}
          artifact-version: 1.0.0
          build-id: ${MCP_TEST_PROVIDER_BUILD_ID:local}
