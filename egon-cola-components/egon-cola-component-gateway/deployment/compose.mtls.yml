name: egon-cola-gateway

services:
  ddc-admin:
    environment:
      EGON_COLA_COMPONENT_DDC_ADMIN_TRANSPORT_SECURITY_MODE: MTLS
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CLIENT_AUTH: need
      SERVER_SSL_BUNDLE: management
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_RELOAD_ON_UPDATE: "true"
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_CERTIFICATE: file:/run/egon-tls/ddc-admin.crt
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_PRIVATE_KEY: file:/run/egon-tls/ddc-admin.key
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_TRUSTSTORE_CERTIFICATE: file:/run/egon-tls/ca.crt
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-admin:
    environment:
      GATEWAY_ADMIN_TRANSPORT_SECURITY_MODE: MTLS
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CLIENT_AUTH: need
      SERVER_SSL_BUNDLE: management
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_RELOAD_ON_UPDATE: "true"
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_CERTIFICATE: file:/run/egon-tls/gateway-admin.crt
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_PRIVATE_KEY: file:/run/egon-tls/gateway-admin.key
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_TRUSTSTORE_CERTIFICATE: file:/run/egon-tls/ca.crt
      GATEWAY_ADMIN_DDC_ENDPOINT: https://ddc-admin:18080
      GATEWAY_ADMIN_DDC_TLS_ENABLED: "true"
      GATEWAY_ADMIN_DDC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_ADMIN_DDC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-admin.crt
      GATEWAY_ADMIN_DDC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-admin.key
      GATEWAY_ADMIN_DDC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-engine:
    environment:
      EGON_COLA_COMPONENT_DDC_ADMIN_ENDPOINT: https://ddc-admin:18080
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-engine-2:
    environment:
      EGON_COLA_COMPONENT_DDC_ADMIN_ENDPOINT: https://ddc-admin:18080
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_DDC_ADMIN_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-admin-web:
    environment:
      GATEWAY_ADMIN_API_BASE_URL: https://gateway-admin:18080
      GATEWAY_ADMIN_API_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_ADMIN_API_TLS_CA_PATH: /run/egon-tls/ca.crt
      GATEWAY_ADMIN_API_TLS_CERTIFICATE_PATH: /run/egon-tls/gateway-admin-web.crt
      GATEWAY_ADMIN_API_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-admin-web.key
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro
