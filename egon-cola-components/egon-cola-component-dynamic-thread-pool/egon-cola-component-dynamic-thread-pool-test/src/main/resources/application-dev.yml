server:
  port: 8093

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

egon:
  cola:
    component:
      dtp:
        context-propagation:
          custom-thread-locals-enabled: true
        exception-handling:
          enabled: true
          log-interval: 1s
          uncaught-enabled: true
          async-void-enabled: true
        observation:
          enabled: true
          slow-task-threshold: 30s
          queue-wait-threshold: 5s
          alarm:
            enabled: false
            queue-usage-threshold: 0.8
            consecutive-samples: 3
            cooldown: 60s
        enabled: true
        app-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${server.port}
        registry:
          type: redis
          redis:
            host: ${DTP_REDIS_HOST:127.0.0.1}
            port: ${DTP_REDIS_PORT:6379}
            password: ${DTP_REDIS_PASSWORD:}
            database: 0
        report:
          enabled: true
          interval: 20s

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
