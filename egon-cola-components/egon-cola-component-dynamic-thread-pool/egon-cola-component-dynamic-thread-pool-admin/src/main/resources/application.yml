spring:
  application:
    name: egon-cola-component-dynamic-thread-pool-admin
  profiles:
    active: dev

egon:
  cola:
    component:
      dtp:
        observation:
          enabled: true
          slow-task-threshold: 30s
          queue-wait-threshold: 5s
          alarm:
            enabled: false
            queue-usage-threshold: 0.8
            consecutive-samples: 3
            cooldown: 60s

springdoc:
  api-docs:
    enabled: false
    version: openapi_3_0
