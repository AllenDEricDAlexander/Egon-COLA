server:
  port: 8089

egon:
  cola:
    component:
      dtp:
        context-propagation:
          custom-thread-locals-enabled: true
        exception-handling:
          enabled: true
          log-interval: 1s
          uncaught-enabled: true
          async-void-enabled: true
        observation:
          enabled: true
          slow-task-threshold: 30s
          queue-wait-threshold: 5s
          alarm:
            enabled: false
            queue-usage-threshold: 0.8
            consecutive-samples: 3
            cooldown: 60s
        registry:
          redis:
            host: 127.0.0.1
            port: 6379
            password: ${EGON_COLA_DTP_REDIS_PASSWORD:}
            pool-size: 10
            min-idle-size: 5
            idle-timeout: 30000
            connect-timeout: 5000
            retry-attempts: 3
            retry-interval: 1000
            ping-interval: 60000
            keep-alive: true

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
