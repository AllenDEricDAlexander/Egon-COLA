server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

egon:
  cola:
    component:
      dtp:
        context-propagation:
          custom-thread-locals-enabled: true
        exception-handling:
          enabled: true
          log-interval: 1s
          uncaught-enabled: true
          async-void-enabled: true
        observation:
          enabled: true
          slow-task-threshold: 30s
          queue-wait-threshold: 5s
          alarm:
            enabled: false
            queue-usage-threshold: 0.8
            consecutive-samples: 3
            cooldown: 60s

springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
