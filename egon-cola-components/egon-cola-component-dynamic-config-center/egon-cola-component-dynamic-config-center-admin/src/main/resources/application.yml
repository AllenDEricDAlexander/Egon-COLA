server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: egon-cola-ddc-admin
  config:
    import: classpath:META-INF/egon-cola-ddc.properties
  flyway:
    locations: classpath:db/postgresql

egon:
  cola:
    component:
      ddc:
        enabled: false
        admin:
          manifest:
            version: ${sdk.version}
          transport-security:
            mode: DEVELOPMENT_PLAINTEXT
          max-value-bytes: 1048576
          redis:
            mode: SINGLE
            nodes: []
            master-name:
            host: 127.0.0.1
            port: 6379
            database: 0
          openapi:
            signature-enabled: false
            access-key:
            secret-key:
            allowed-clock-skew-seconds: 300
            nonce-cache-max-size: 10000
          publish:
            dispatch-timeout-ms: 5000
            default-timeout-ms: 30000
            max-timeout-ms: 60000
            scan-interval-ms: 1000
            completion-poll-interval-ms: 100
            recovery-stale-ms: 120000
