spring:
  application:
    name: egon-cola-gateway-engine
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: 18083
  shutdown: graceful

management:
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

egon:
  cola:
    component:
      ddc:
        enabled: ${DDC_ENABLED:true}
        biz-code: ${DDC_BIZ_CODE:infra}
        env: ${DDC_ENV:local}
        app-code: ${DDC_APP_CODE:ge}
        admin:
          endpoint: ${DDC_ADMIN_ENDPOINT:http://127.0.0.1:18080}
          signature-enabled: ${DDC_OPENAPI_SIGNATURE_ENABLED:true}
          access-key: ${DDC_OPENAPI_ACCESS_KEY:}
          secret-key: ${DDC_OPENAPI_SECRET:}
          tls:
            enabled: false
            development-plaintext: true
        redis:
          enabled: true
          mode: ${DDC_REDIS_MODE:SINGLE}
          host: ${DDC_REDIS_HOST:127.0.0.1}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:true}
      gateway:
        provider:
          http:
            enabled: ${GATEWAY_ENGINE_DDC_REGISTRATION_ENABLED:true}
            instance-id: ${GATEWAY_ENGINE_DDC_INSTANCE_ID:}
            service-name: egon-cola-gateway-engine
            version: ${GATEWAY_ENGINE_VERSION:5.3.2}
            protocol: http
            advertised-host: ${GATEWAY_ENGINE_DDC_ADVERTISED_HOST:127.0.0.1}
            port: ${GATEWAY_ENGINE_DDC_ADVERTISED_PORT:18081}
            metadata:
              gateway.component: engine
        engine:
          http:
            public-tls:
              enabled: false
              development-plaintext: true
            internal-tls:
              enabled: false
              development-plaintext: true
          rpc:
            service-name: egon-gateway-rpc
            group: default
            version: 1.0.0
            tls:
              enabled: false
              development-plaintext: true
          traffic:
            redis:
              enabled: false
              address: redis://127.0.0.1:6379
              database: 0
              password:
          kafka:
            enabled: false
