spring:
  application:
    name: egon-cola-gateway-engine
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/gateway-engine.properties
      - optional:ddc:application.yml
  datasource:
    url: ${GATEWAY_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/gateway_admin}
    username: ${GATEWAY_POSTGRES_USER:postgres}
    password: ${GATEWAY_POSTGRES_PASSWORD:postgres}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: 18083
  shutdown: graceful

management:
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

egon:
  cola:
    platform:
      idp:
        enabled: ${DDC_ENABLED:true}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${GATEWAY_ENGINE_RESOURCE_SERVER_ID:}
        resource-uri: ${GATEWAY_ENGINE_RESOURCE_URI:}
        admission:
          biz-code: ${DDC_BIZ_CODE:identity}
          app-code: ${DDC_APP_CODE:gateway-engine-default}
          environment: ${DDC_ENV:local}
          instance-id: ${GATEWAY_ENGINE_DDC_INSTANCE_ID:}
          management-client-id: ${GATEWAY_ENGINE_RESOURCE_MANAGEMENT_CLIENT_ID:}
          kid: ${GATEWAY_ENGINE_RESOURCE_MANAGEMENT_KEY_ID:}
          private-key-path: ${GATEWAY_ENGINE_RESOURCE_MANAGEMENT_PRIVATE_KEY_FILE:}
          endpoint: ${GATEWAY_ENGINE_RESOURCE_ADMISSION_ENDPOINT:}
          renewal-skew: ${GATEWAY_ENGINE_RESOURCE_ADMISSION_RENEWAL_SKEW:30s}
        gateway:
          enabled: ${IDP_GATEWAY_ENABLED:true}
          issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
          jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
          user-state-key-prefix: "identity:v1:user:"
          runtime:
            redis-enabled: true
            redis-address: ${IDP_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${IDP_REDIS_DATABASE:0}
            password-file: ${IDP_REDIS_PASSWORD_FILE:}
            timeout: ${IDP_REDIS_TIMEOUT:2s}
      rbac3:
        enabled: ${GATEWAY_MCP_RBAC3_ENABLED:false}
        register-filter: false
        system-code: ${GATEWAY_MCP_RBAC3_SYSTEM_CODE:mock-backend}
        runtime:
          redis-enabled: ${GATEWAY_MCP_RBAC3_ENABLED:false}
          redis-address: ${GATEWAY_MCP_RBAC3_REDIS_ADDRESS:redis://127.0.0.1:6379}
          database: ${GATEWAY_MCP_RBAC3_REDIS_DATABASE:0}
          password-file: ${GATEWAY_MCP_RBAC3_REDIS_PASSWORD_FILE:}
        authorization:
          endpoint: ${GATEWAY_MCP_RBAC3_AUTHORIZATION_ENDPOINT:}
          service-credential-file: ${GATEWAY_MCP_RBAC3_SERVICE_CREDENTIAL_FILE:}
    component:
      ddc:
        enabled: ${DDC_ENABLED:true}
        biz-code: ${DDC_BIZ_CODE:infra}
        env: ${DDC_ENV:local}
        app-code: ${DDC_APP_CODE:ge}
        instance:
          id: ${GATEWAY_ENGINE_DDC_INSTANCE_ID:}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///ddc-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:false}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: true
          mode: ${DDC_REDIS_MODE:SINGLE}
          host: ${DDC_REDIS_HOST:127.0.0.1}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:true}
          http:
            enabled: ${GATEWAY_ENGINE_DDC_REGISTRATION_ENABLED:true}
            instance-id: ${GATEWAY_ENGINE_DDC_INSTANCE_ID:}
            service-name: egon-cola-gateway-engine
            version: ${GATEWAY_ENGINE_VERSION:5.3.2}
            protocol: http
            advertised-host: ${GATEWAY_ENGINE_DDC_ADVERTISED_HOST:127.0.0.1}
            port: ${GATEWAY_ENGINE_DDC_ADVERTISED_PORT:18081}
            metadata:
              gateway.component: engine
      gateway:
        engine:
          mcp:
            enabled: ${GATEWAY_MCP_ENABLED:true}
            artifact-root: ${GATEWAY_MCP_ARTIFACT_ROOT:${java.io.tmpdir}/egon-cola/gateway-mcp-artifacts}
            session-ttl: ${GATEWAY_MCP_SESSION_TTL:PT30M}
            stream-wait: ${GATEWAY_MCP_STREAM_WAIT:PT15S}
            maximum-request-bytes: ${GATEWAY_MCP_MAXIMUM_REQUEST_BYTES:16777216}
            maximum-resource-bytes: ${GATEWAY_MCP_MAXIMUM_RESOURCE_BYTES:67108864}
            maximum-app-artifact-bytes: ${GATEWAY_MCP_MAXIMUM_APP_ARTIFACT_BYTES:16777216}
            maximum-subscriptions-per-client: ${GATEWAY_MCP_MAXIMUM_SUBSCRIPTIONS_PER_CLIENT:100}
            maximum-active-tasks-per-client: ${GATEWAY_MCP_MAXIMUM_ACTIVE_TASKS_PER_CLIENT:100}
            tasks:
              lease-duration: ${GATEWAY_MCP_TASK_LEASE_DURATION:PT30S}
              poll-interval: ${GATEWAY_MCP_TASK_POLL_INTERVAL:PT2S}
              default-ttl: ${GATEWAY_MCP_TASK_DEFAULT_TTL:PT24H}
              cleanup-interval: ${GATEWAY_MCP_TASK_CLEANUP_INTERVAL:PT10M}
              service-token:
                enabled: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_ENABLED:false}
                token-endpoint: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_ENDPOINT:http://127.0.0.1:18120/oauth2/token}
                client-id: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_CLIENT_ID:}
                key-id: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_KEY_ID:}
                private-key-file: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_PRIVATE_KEY_FILE:}
                scopes: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_SCOPES:mcp:operation:invoke}
                renewal-skew: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_RENEWAL_SKEW:30s}
            remote:
              discovery-timeout: ${GATEWAY_MCP_REMOTE_DISCOVERY_TIMEOUT:PT20S}
              call-timeout: ${GATEWAY_MCP_REMOTE_CALL_TIMEOUT:PT60S}
              health-interval: ${GATEWAY_MCP_REMOTE_HEALTH_INTERVAL:PT30S}
              capability-sync-interval: ${GATEWAY_MCP_REMOTE_CAPABILITY_SYNC_INTERVAL:PT5M}
              circuit-open-duration: ${GATEWAY_MCP_REMOTE_CIRCUIT_OPEN_DURATION:PT30S}
              maximum-concurrent-calls: ${GATEWAY_MCP_REMOTE_MAXIMUM_CONCURRENT_CALLS:32}
              failure-threshold: ${GATEWAY_MCP_REMOTE_FAILURE_THRESHOLD:3}
              token-forwarding: false
            security:
              origin-validation: true
              protected-resource-metadata: true
              token-forwarding: false
            audit:
              enabled: ${GATEWAY_MCP_AUDIT_ENABLED:true}
              body-log-enabled: false
            redis:
              enabled: ${GATEWAY_MCP_REDIS_ENABLED:true}
              address: ${GATEWAY_MCP_REDIS_ADDRESS:redis://127.0.0.1:6379}
              database: ${GATEWAY_MCP_REDIS_DATABASE:0}
              password: ${GATEWAY_MCP_REDIS_PASSWORD:}
              key-prefix: ${GATEWAY_MCP_REDIS_KEY_PREFIX:gateway:mcp:}
              stream-max-length: ${GATEWAY_MCP_STREAM_MAX_LENGTH:256}
          http:
            public-tls:
              enabled: false
              development-plaintext: true
            internal-tls:
              enabled: false
              development-plaintext: true
          rpc:
            service-name: egon-gateway-rpc
            group: default
            version: 1.0.0
            tls:
              enabled: false
              development-plaintext: true
          traffic:
            redis:
              enabled: false
              address: redis://127.0.0.1:6379
              database: 0
              password:
          kafka:
            enabled: false
