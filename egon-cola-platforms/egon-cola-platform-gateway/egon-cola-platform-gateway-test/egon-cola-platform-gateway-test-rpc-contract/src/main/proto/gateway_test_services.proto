syntax = "proto3";

package egon.gateway.test.v1;

option java_multiple_files = true;
option java_package = "top.egon.cola.component.gateway.test.rpc.contract.proto";

import "egon/gateway/schema_options.proto";

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc SlowCall(SlowCallRequest) returns (OrderResponse);
  rpc Fail(FailRequest) returns (OrderResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string provider_id = 1;
  string message = 2;
  string invocation_id = 3;
  string trace_id = 4;
}

message GetOrderRequest {
  string order_id = 1;
}

message CreateOrderRequest {
  string customer_id = 1 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "客户编号"
    required: GATEWAY_REQUIRED
    example: "customer-1001"
  }];
  repeated string sku = 2 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "商品 SKU 列表"
  }];
  Address delivery_address = 3 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "配送地址"
  }];
}

message Address {
  string province = 1 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "配送省份"
  }];
  string city = 2 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "配送城市"
  }];
}

message SlowCallRequest {
  string order_id = 1;
  int64 delay_millis = 2;
}

message FailRequest {
  string code = 1;
}

message OrderResponse {
  string order_id = 1 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "订单编号"
  }];
  string status = 2 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "订单状态"
  }];
  string provider_id = 3 [(egon.gateway.schema.v1.gateway_schema) = {
    description: "服务提供者实例编号"
  }];
}
