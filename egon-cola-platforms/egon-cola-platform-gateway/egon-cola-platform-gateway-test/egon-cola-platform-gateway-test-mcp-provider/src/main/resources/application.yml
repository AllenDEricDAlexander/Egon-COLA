spring:
  application:
    name: gateway-test-mcp-provider
  config:
    import: optional:ddc:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: ${MCP_TEST_PROVIDER_PORT:18150}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

egon:
  cola:
    platform:
      idp:
        enabled: ${DDC_ENABLED:false}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${MCP_PROVIDER_RESOURCE_SERVER_ID:}
        resource-uri: ${MCP_PROVIDER_RESOURCE_URI:}
        admission:
          biz-code: ${DDC_BIZ_CODE:identity}
          app-code: ${DDC_APP_CODE:gateway-test-mcp-provider}
          environment: ${DDC_ENV:local}
          instance-id: ${MCP_TEST_PROVIDER_INSTANCE_ID:mcp-provider-1}
          management-client-id: ${MCP_PROVIDER_RESOURCE_MANAGEMENT_CLIENT_ID:}
          kid: ${MCP_PROVIDER_RESOURCE_MANAGEMENT_KEY_ID:}
          private-key-path: ${MCP_PROVIDER_RESOURCE_MANAGEMENT_PRIVATE_KEY_FILE:}
          endpoint: ${MCP_PROVIDER_RESOURCE_ADMISSION_ENDPOINT:}
          renewal-skew: ${MCP_PROVIDER_RESOURCE_ADMISSION_RENEWAL_SKEW:30s}
      rbac3:
        enabled: true
        register-filter: false
        system-code: mock-backend
        runtime:
          redis-enabled: true
          redis-address: ${MCP_PROVIDER_REDIS_ADDRESS:redis://127.0.0.1:6379}
          database: ${MCP_PROVIDER_REDIS_DATABASE:8}
          password-file: ${MCP_PROVIDER_REDIS_PASSWORD_FILE:}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
    component:
      id:
        enabled: false
      ddc:
        enabled: ${DDC_ENABLED:false}
        biz-code: ${DDC_BIZ_CODE:test-biz}
        app-code: ${DDC_APP_CODE:gateway-test-mcp-provider}
        env: ${DDC_ENV:local}
        namespace: ${DDC_NAMESPACE:gateway-test}
        instance:
          id: ${MCP_TEST_PROVIDER_INSTANCE_ID:mcp-provider-1}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: ${DDC_REGISTRY_ENABLED:false}
          mode: SINGLE
          host: ${DDC_REGISTRY_REDIS_HOST:127.0.0.1}
          port: ${DDC_REGISTRY_REDIS_PORT:6379}
          password: ${DDC_REGISTRY_REDIS_PASSWORD:}
          database: ${DDC_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:false}
          http:
            enabled: true
            instance-id: ${MCP_TEST_PROVIDER_INSTANCE_ID:mcp-provider-1}
            service-name: gateway-test-mcp-provider
            group: default
            version: 1.0.0
            protocol: http
            advertised-host: ${MCP_TEST_PROVIDER_HOST:127.0.0.1}
            port: ${MCP_TEST_PROVIDER_PORT:18150}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      gateway:
        reporting:
          enabled: ${GATEWAY_REPORTING_ENABLED:false}
          admin-base-url: ${GATEWAY_ADMIN_BASE_URL:http://127.0.0.1:18082}
          biz-code: ${DDC_BIZ_CODE:test-biz}
          application-code: ${DDC_APP_CODE:gateway-test-mcp-provider}
          application-name: Gateway MCP Test Provider
          env: ${DDC_ENV:local}
          namespace: ${DDC_NAMESPACE:gateway-test}
          artifact-version: 1.0.0
          build-id: ${MCP_TEST_PROVIDER_BUILD_ID:local}
          declared-hosts: ${MCP_TEST_PROVIDER_HOST:127.0.0.1}
          access-key: ${GATEWAY_REPORT_ACCESS_KEY:}
          secret-key: ${GATEWAY_REPORT_SECRET_KEY:}
