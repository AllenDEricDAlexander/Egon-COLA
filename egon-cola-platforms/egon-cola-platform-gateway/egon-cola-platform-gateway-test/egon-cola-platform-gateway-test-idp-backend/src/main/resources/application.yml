spring:
  application:
    name: gateway-test-idp-backend
  config:
    import: optional:ddc:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: ${MOCK_BACKEND_PORT:18160}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

egon:
  cola:
    platform:
      idp:
        enabled: true
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${MOCK_BACKEND_RESOURCE_SERVER_ID:identity-mock-backend-local}
        resource-uri: ${MOCK_BACKEND_RESOURCE_URI:https://api.egon.internal/local/identity/mock-backend}
        admission:
          biz-code: ${MOCK_BACKEND_RESOURCE_BIZ_CODE:identity}
          app-code: ${MOCK_BACKEND_RESOURCE_APP_CODE:mock-backend}
          environment: ${DEPLOYMENT_ENV:local}
          instance-id: ${MOCK_BACKEND_INSTANCE_ID:mock-backend-local-1}
          management-client-id: ${MOCK_BACKEND_RESOURCE_MANAGEMENT_CLIENT_ID:mock-backend-service}
          kid: ${MOCK_BACKEND_RESOURCE_MANAGEMENT_KEY_ID:mock-backend-local}
          private-key-path: ${MOCK_BACKEND_RESOURCE_MANAGEMENT_PRIVATE_KEY_FILE:/tmp/egon-cola/mock-backend-private.pem}
          rpc-target: ${MOCK_BACKEND_RESOURCE_ADMISSION_RPC_TARGET:dns:///127.0.0.1:18122}
          rpc-timeout: ${MOCK_BACKEND_RESOURCE_ADMISSION_RPC_TIMEOUT:3s}
          renewal-skew: ${MOCK_BACKEND_RESOURCE_ADMISSION_RENEWAL_SKEW:30s}
      rbac3:
        enabled: true
        register-filter: false
        system-code: mock-backend
        runtime:
          redis-enabled: true
          redis-address: ${MOCK_BACKEND_REDIS_ADDRESS:redis://127.0.0.1:6379}
          database: ${MOCK_BACKEND_REDIS_DATABASE:0}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
          service-credential-file: ${MOCK_BACKEND_RBAC3_SERVICE_CREDENTIAL_FILE:.runtime/unified-identity/mock-backend.service.jwt}
    component:
      id:
        enabled: false
      rpc:
        tls:
          development-plaintext: ${IDP_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:true}
      ddc:
        enabled: ${MOCK_BACKEND_DDC_ENABLED:false}
        biz-code: ${MOCK_BACKEND_RESOURCE_BIZ_CODE:identity}
        app-code: ${MOCK_BACKEND_RESOURCE_APP_CODE:mock-backend}
        env: ${DEPLOYMENT_ENV:local}
        namespace: ${DEPLOYMENT_NAMESPACE:default}
        instance:
          id: ${MOCK_BACKEND_INSTANCE_ID:mock-backend-local-1}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: ${MOCK_BACKEND_DDC_ENABLED:false}
          mode: SINGLE
          host: ${DDC_REGISTRY_REDIS_HOST:127.0.0.1}
          port: ${DDC_REGISTRY_REDIS_PORT:6379}
          password: ${DDC_REGISTRY_REDIS_PASSWORD:}
          database: ${DDC_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: ${MOCK_BACKEND_DDC_ENABLED:false}
          http:
            enabled: ${MOCK_BACKEND_DDC_ENABLED:false}
            instance-id: ${MOCK_BACKEND_INSTANCE_ID:mock-backend-local-1}
            service-name: mock-backend
            group: default
            version: ${MOCK_BACKEND_ARTIFACT_VERSION:5.3.2}
            protocol: http
            advertised-host: ${MOCK_BACKEND_ADVERTISED_HOST:127.0.0.1}
            port: ${MOCK_BACKEND_PORT:18160}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      gateway:
        reporting:
          enabled: ${MOCK_BACKEND_GATEWAY_REPORTING_ENABLED:false}
          admin-base-url: ${GATEWAY_ADMIN_BASE_URL:http://127.0.0.1:18082}
          biz-code: ${MOCK_BACKEND_RESOURCE_BIZ_CODE:identity}
          application-code: ${MOCK_BACKEND_RESOURCE_APP_CODE:mock-backend}
          application-name: Unified Identity Mock Backend
          env: ${DEPLOYMENT_ENV:local}
          namespace: ${DEPLOYMENT_NAMESPACE:default}
          artifact-version: ${MOCK_BACKEND_ARTIFACT_VERSION:5.3.2}
          build-id: ${MOCK_BACKEND_BUILD_ID:local}
          declared-hosts: ${MOCK_BACKEND_DECLARED_HOSTS:127.0.0.1}
          access-key: ${GATEWAY_REPORT_ACCESS_KEY:}
          secret-key: ${GATEWAY_REPORT_SECRET_KEY:}
