spring:
  application:
    name: gateway-test-http-provider
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  test:
    service-version: ${GATEWAY_TEST_SERVICE_VERSION:1.0.0-live}

egon:
  cola:
    component:
      id:
        enabled: false
      ddc:
        enabled: false
        biz-code: ${DDC_BIZ_CODE:test-biz}
        app-code: ${DDC_APP_CODE:gateway-test-http-provider}
        env: ${DDC_ENV:test}
        namespace: ${DDC_NAMESPACE:gateway-test}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          load-balancing-policy: round_robin
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
        registry:
          enabled: false
      gateway:
        reporting:
          enabled: false
          biz-code: ${DDC_BIZ_CODE:test-biz}
          application-code: ${DDC_APP_CODE:gateway-test-http-provider}
          artifact-version: ${gateway.test.service-version}
        provider:
          http:
            enabled: true
            instance-id: ${GATEWAY_TEST_DDC_INSTANCE_ID:${gateway.test.provider-id:http-provider-default}}
            service-name: ${GATEWAY_TEST_SERVICE_NAME:gateway-test-http-provider}
            group: default
            version: ${egon.cola.component.gateway.reporting.artifact-version}
            protocol: http
            advertised-host: ${gateway.test.advertised-host:127.0.0.1}
            port: ${gateway.test.advertised-port:0}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
            metadata:
              gateway.zone: ${gateway.test.zone:zone-a}
              gateway.weight: ${gateway.test.weight:100}
