spring:
  application:
    name: egon-cola-gateway-admin
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${GATEWAY_ADMIN_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

gateway:
  admin:
    transport-security:
      mode: DEVELOPMENT_PLAINTEXT
    security:
      issuer: ${GATEWAY_ADMIN_JWT_ISSUER:}
      jwk-set-uri: ${GATEWAY_ADMIN_JWT_JWK_SET_URI:}
    ddc:
      enabled: false
      endpoint: http://127.0.0.1:18080
      access-key:
      secret-key:
      connect-timeout: 3s
      read-timeout: 10s
      tls:
        enabled: false
        development-plaintext: true
      target-biz-code: ${GATEWAY_ADMIN_DDC_TARGET_BIZ_CODE:infra}
      target-app-code: ${GATEWAY_ADMIN_DDC_TARGET_APP_CODE:ge}
    hmac:
      allowed-skew: 5m
    observability:
      retention: 168h
      kafka:
        enabled: false
        topic: egon.gateway.call.v1
        group-id: gateway-admin-call-events-v1

egon:
  cola:
    platform:
      idp:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER}
        jwk-set-uri: ${IDP_JWK_SET_URI}
        audiences: [gateway-admin-web]
        client-ids: [gateway-admin-web]
      rbac3:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        system-code: gateway-admin
        runtime:
          redis-enabled: true
          redis-address: ${GATEWAY_AUTHORIZATION_REDIS_ADDRESS}
          database: ${GATEWAY_AUTHORIZATION_REDIS_DATABASE:0}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT}
          service-credential-file: ${GATEWAY_RBAC3_SERVICE_CREDENTIAL_FILE}
    component:
      ddc:
        enabled: ${DDC_ENABLED:false}
        biz-code: ${DDC_BIZ_CODE:infra}
        env: ${DDC_ENV:local}
        app-code: ${DDC_APP_CODE:ga}
        admin:
          endpoint: ${DDC_ADMIN_ENDPOINT:http://127.0.0.1:18080}
          signature-enabled: ${DDC_OPENAPI_SIGNATURE_ENABLED:true}
          access-key: ${DDC_OPENAPI_ACCESS_KEY:}
          secret-key: ${DDC_OPENAPI_SECRET:}
          tls:
            enabled: false
            development-plaintext: true
        redis:
          enabled: true
          mode: ${DDC_REDIS_MODE:SINGLE}
          host: ${DDC_REDIS_HOST:127.0.0.1}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:false}
      gateway:
        provider:
          http:
            enabled: ${GATEWAY_ADMIN_DDC_REGISTRATION_ENABLED:false}
            service-name: egon-cola-gateway-admin
            version: ${GATEWAY_ADMIN_VERSION:5.3.2}
            protocol: http
            advertised-host: ${GATEWAY_ADMIN_DDC_ADVERTISED_HOST:127.0.0.1}
            port: ${GATEWAY_ADMIN_DDC_ADVERTISED_PORT:0}
            metadata:
              gateway.component: admin
