spring:
  application:
    name: egon-cola-gateway-admin
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/gateway-admin.properties
      - optional:ddc:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${GATEWAY_ADMIN_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${GATEWAY_ADMIN_HTTP_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: gateway-admin
      paths-to-match:
        - /api/v1/gateway/admin/**
        - /api/v1/auth/bootstrap

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

gateway:
  admin:
    release-reconcile-enabled: ${GATEWAY_ADMIN_RELEASE_RECONCILE_ENABLED:true}
    mcp:
      artifact-root: ${GATEWAY_MCP_ARTIFACT_ROOT:${java.io.tmpdir}/egon-cola/gateway-mcp-artifacts}
    transport-security:
      mode: DEVELOPMENT_PLAINTEXT
    ddc:
      enabled: false
      target-biz-code: ${GATEWAY_ADMIN_DDC_TARGET_BIZ_CODE:infra}
      target-app-code: ${GATEWAY_ADMIN_DDC_TARGET_APP_CODE:ge}
    openapi:
      enabled: ${GATEWAY_ADMIN_OPENAPI_ENABLED:false}
      allow-development-http: ${GATEWAY_ADMIN_OPENAPI_ALLOW_DEVELOPMENT_HTTP:false}
      reconcile-delay: ${GATEWAY_ADMIN_OPENAPI_RECONCILE_DELAY:PT30S}
      batch-size: ${GATEWAY_ADMIN_OPENAPI_BATCH_SIZE:50}
      maximum-instance-attempts: ${GATEWAY_ADMIN_OPENAPI_MAX_INSTANCE_ATTEMPTS:3}
      claim-timeout: ${GATEWAY_ADMIN_OPENAPI_CLAIM_TIMEOUT:PT2M}
      connect-timeout: ${GATEWAY_ADMIN_OPENAPI_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${GATEWAY_ADMIN_OPENAPI_READ_TIMEOUT:PT10S}
      maximum-document-bytes: ${GATEWAY_ADMIN_OPENAPI_MAX_DOCUMENT_BYTES:5242880}
      maximum-operations: ${GATEWAY_ADMIN_OPENAPI_MAX_OPERATIONS:5000}
      maximum-schema-nodes: ${GATEWAY_ADMIN_OPENAPI_MAX_SCHEMA_NODES:50000}
      maximum-ref-depth: ${GATEWAY_ADMIN_OPENAPI_MAX_REF_DEPTH:64}
      retry-initial-delay: ${GATEWAY_ADMIN_OPENAPI_RETRY_INITIAL_DELAY:PT5S}
      retry-maximum-delay: ${GATEWAY_ADMIN_OPENAPI_RETRY_MAXIMUM_DELAY:PT5M}
      retry-jitter: ${GATEWAY_ADMIN_OPENAPI_RETRY_JITTER:0.20}
      drift-sample-interval: ${GATEWAY_ADMIN_OPENAPI_DRIFT_SAMPLE_INTERVAL:PT5M}
      allowed-cidrs:
        - ${GATEWAY_ADMIN_OPENAPI_ALLOWED_CIDR:}
      required-scope: ${GATEWAY_ADMIN_OPENAPI_REQUIRED_SCOPE:gateway.openapi.read}
    observability:
      retention: 168h
      kafka:
        enabled: false
        topic: egon.gateway.call.v1
        group-id: gateway-admin-call-events-v1

egon:
  cola:
    platform:
      idp:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER}
        jwk-set-uri: ${IDP_JWK_SET_URI}
        resource-server-id: ${GATEWAY_ADMIN_RESOURCE_SERVER_ID}
        resource-uri: ${GATEWAY_ADMIN_RESOURCE_URI}
      rbac3:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        system-code: gateway-admin
        runtime:
          redis-enabled: true
          redis-address: ${GATEWAY_AUTHORIZATION_REDIS_ADDRESS}
          database: ${GATEWAY_AUTHORIZATION_REDIS_DATABASE:0}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT}
          service-token:
            enabled: ${GATEWAY_RBAC3_SERVICE_TOKEN_ENABLED:true}
            resource-uri: ${GATEWAY_RBAC3_SERVICE_TOKEN_RESOURCE_URI}
            scopes: ${GATEWAY_RBAC3_SERVICE_TOKEN_SCOPES}
    component:
      rpc:
        tls:
          enabled: ${IDP_ADMISSION_RPC_TLS_ENABLED:false}
          development-plaintext: ${IDP_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}}
          certificate-chain-path: ${IDP_ADMISSION_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${IDP_ADMISSION_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${IDP_ADMISSION_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      ddc:
        enabled: ${DDC_ENABLED:false}
        biz-code: ${GATEWAY_ADMIN_RESOURCE_BIZ_CODE:platform}
        env: ${DEPLOYMENT_ENV}
        app-code: ${GATEWAY_ADMIN_RESOURCE_APP_CODE:gateway-admin}
        max-config-bytes: ${DDC_MAX_CONFIG_BYTES:1048576}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///ddc-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:false}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
            management:
              access-key: ${DDC_RPC_MANAGEMENT_ACCESS_KEY:}
              secret-key: ${DDC_RPC_MANAGEMENT_SECRET_KEY:}
        redis:
          enabled: true
          mode: ${DDC_REDIS_MODE:SINGLE}
          host: ${DDC_REDIS_HOST:127.0.0.1}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:false}
          http:
            enabled: ${GATEWAY_ADMIN_DDC_REGISTRATION_ENABLED:false}
            service-name: gateway-admin
            version: ${GATEWAY_ADMIN_VERSION:5.3.2}
            protocol: http
            advertised-host: ${GATEWAY_ADMIN_DDC_ADVERTISED_HOST:127.0.0.1}
            port: ${GATEWAY_ADMIN_DDC_ADVERTISED_PORT:0}
            metadata:
              gateway.component: admin
      gateway:
        openapi:
          enabled: ${GATEWAY_ADMIN_HTTP_OPENAPI_ENABLED:false}
          publish-to-ddc: ${GATEWAY_ADMIN_HTTP_OPENAPI_PUBLISH_TO_DDC:true}
          published-groups:
            - gateway-admin
          biz-code: ${GATEWAY_ADMIN_RESOURCE_BIZ_CODE:platform}
          application-code: ${GATEWAY_ADMIN_RESOURCE_APP_CODE:gateway-admin}
          resource-uri: ${GATEWAY_ADMIN_RESOURCE_URI:}
          artifact-version: ${GATEWAY_ADMIN_VERSION:local}
          build-id: ${GATEWAY_ADMIN_BUILD_ID:local}
        reporting:
          enabled: ${GATEWAY_ADMIN_GATEWAY_REPORTING_ENABLED:false}
          admin-base-url: ${GATEWAY_ADMIN_BASE_URL:}
          biz-code: ${GATEWAY_ADMIN_RESOURCE_BIZ_CODE:platform}
          application-code: ${GATEWAY_ADMIN_RESOURCE_APP_CODE:gateway-admin}
          application-name: Gateway Admin
          env: ${DEPLOYMENT_ENV:local}
          namespace: ${DEPLOYMENT_NAMESPACE:default}
          artifact-version: ${GATEWAY_ADMIN_VERSION:local}
          build-id: ${GATEWAY_ADMIN_BUILD_ID:local}
          declared-hosts: ${GATEWAY_ADMIN_DECLARED_HOSTS:127.0.0.1}
          fail-fast: true
          access-key: ${GATEWAY_REPORT_ACCESS_KEY:}
          secret-key: ${GATEWAY_REPORT_SECRET_KEY:}
          state-file: ${GATEWAY_REPORT_STATE_FILE:}
