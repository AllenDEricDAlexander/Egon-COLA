spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/egon_gateway_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:HomeLab666}

egon:
  cola:
    platform:
      idp:
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
      rbac3:
        runtime:
          redis-address: ${GATEWAY_AUTHORIZATION_REDIS_ADDRESS:redis://127.0.0.1:6379}
          password-file: ${UNIFIED_IDENTITY_REDIS_PASSWORD_FILE:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/secrets/redis.password}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
          service-credential-file: ${GATEWAY_RBAC3_SERVICE_CREDENTIAL_FILE:.runtime/unified-identity/gateway-admin.service.jwt}
    component:
      ddc:
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
        redis:
          password: ${DDC_REDIS_PASSWORD:HomeLab666}
