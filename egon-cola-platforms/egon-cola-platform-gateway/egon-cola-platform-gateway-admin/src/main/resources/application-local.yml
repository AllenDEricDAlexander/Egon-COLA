spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/egon_gateway_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:HomeLab666}

egon:
  cola:
    platform:
      idp:
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
      rbac3:
        runtime:
          redis-address: ${GATEWAY_AUTHORIZATION_REDIS_ADDRESS:redis://127.0.0.1:6379}
          password-file: ${UNIFIED_IDENTITY_REDIS_PASSWORD_FILE:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/secrets/redis.password}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
          service-token:
            enabled: ${GATEWAY_RBAC3_SERVICE_TOKEN_ENABLED:false}
            token-endpoint: ${GATEWAY_RBAC3_SERVICE_TOKEN_TOKEN_ENDPOINT:http://127.0.0.1:18120/oauth2/token}
            client-id: ${GATEWAY_RBAC3_SERVICE_TOKEN_CLIENT_ID:}
            key-id: ${GATEWAY_RBAC3_SERVICE_TOKEN_KEY_ID:}
            private-key-file: ${GATEWAY_RBAC3_SERVICE_TOKEN_PRIVATE_KEY_FILE:}
            resource-uri: ${GATEWAY_RBAC3_SERVICE_TOKEN_RESOURCE_URI:}
            scopes: ${GATEWAY_RBAC3_SERVICE_TOKEN_SCOPES:}
    component:
      ddc:
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
        redis:
          password: ${DDC_REDIS_PASSWORD:HomeLab666}
      gateway:
        reporting:
          enabled: ${GATEWAY_ADMIN_GATEWAY_REPORTING_ENABLED:false}
          env: local
          namespace: default
          application-code: gateway-admin
          artifact-version: local
