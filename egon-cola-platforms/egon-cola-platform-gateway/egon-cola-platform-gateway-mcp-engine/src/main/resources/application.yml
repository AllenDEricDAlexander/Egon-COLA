spring:
  application:
    name: egon-cola-gateway-mcp-engine
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/gateway-mcp-engine.properties
      - optional:ddc:application.yml
  datasource:
    url: ${GATEWAY_MCP_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/gateway_admin}
    username: ${GATEWAY_MCP_POSTGRES_USER:postgres}
    password: ${GATEWAY_MCP_POSTGRES_PASSWORD:postgres}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: ${egon.cola.component.gateway.mcp-engine.management-port}
  shutdown: graceful

management:
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

egon:
  cola:
    platform:
      idp:
        enabled: ${DDC_ENABLED:true}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
        resource-server-id: ${GATEWAY_MCP_ENGINE_RESOURCE_SERVER_ID:}
        resource-uri: ${GATEWAY_MCP_ENGINE_RESOURCE_URI:}
        gateway:
          enabled: ${IDP_GATEWAY_ENABLED:true}
          issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
          jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
          idp-refresh-uri: ${IDP_REFRESH_URI:http://127.0.0.1:18120/oauth2/token}
          access-token-cookie-name: ${IDP_ACCESS_TOKEN_COOKIE_NAME:__Host-egon_user_at}
          refresh-token-cookie-name: ${IDP_REFRESH_TOKEN_COOKIE_NAME:__Host-egon_user_rt}
          refresh-status-resource-uri: ${IDP_REFRESH_STATUS_RESOURCE_URI:https://api.egon.internal/local/permission/idp}
          refresh-status-scopes: ${IDP_REFRESH_STATUS_SCOPES:idp:refresh-token:validate}
          trusted-origins: ${IDP_GATEWAY_TRUSTED_ORIGINS:}
          user-state-key-prefix: "identity:v1:user:"
          runtime:
            redis-enabled: true
            redis-address: ${IDP_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${IDP_REDIS_DATABASE:0}
            password-file: ${IDP_REDIS_PASSWORD_FILE:}
            timeout: ${IDP_REDIS_TIMEOUT:2s}
      rbac3:
        enabled: ${GATEWAY_MCP_RBAC3_ENABLED:false}
        register-filter: false
        system-code: ${GATEWAY_MCP_RBAC3_SYSTEM_CODE:mock-backend}
        runtime:
          redis-enabled: ${GATEWAY_MCP_RBAC3_ENABLED:false}
          redis-address: ${GATEWAY_MCP_RBAC3_REDIS_ADDRESS:redis://127.0.0.1:6379}
          database: ${GATEWAY_MCP_RBAC3_REDIS_DATABASE:0}
          password-file: ${GATEWAY_MCP_RBAC3_REDIS_PASSWORD_FILE:}
        authorization:
          endpoint: ${GATEWAY_MCP_RBAC3_AUTHORIZATION_ENDPOINT:}
        gateway:
          enabled: ${GATEWAY_MCP_RBAC3_SCOPE_ENABLED:true}
          runtime:
            redis-enabled: ${GATEWAY_MCP_RBAC3_SCOPE_ENABLED:true}
            redis-address: ${GATEWAY_MCP_RBAC3_SCOPE_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${GATEWAY_MCP_RBAC3_SCOPE_REDIS_DATABASE:8}
            password-file: ${GATEWAY_MCP_RBAC3_SCOPE_REDIS_PASSWORD_FILE:}
            timeout: ${GATEWAY_MCP_RBAC3_SCOPE_REDIS_TIMEOUT:2s}
    component:
      rpc:
        tls:
          enabled: ${IDP_ADMISSION_RPC_TLS_ENABLED:false}
          development-plaintext: ${IDP_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}}
          certificate-chain-path: ${IDP_ADMISSION_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${IDP_ADMISSION_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${IDP_ADMISSION_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      ddc:
        enabled: ${DDC_ENABLED:true}
        biz-code: ${DDC_BIZ_CODE:infra}
        env: ${DDC_ENV:local}
        app-code: ${DDC_APP_CODE:ge}
        max-config-bytes: ${DDC_MAX_CONFIG_BYTES:1048576}
        instance:
          id: ${GATEWAY_MCP_ENGINE_DDC_INSTANCE_ID:}
        rpc:
          target: ${DDC_RPC_TARGET:dns:///ddc-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:false}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${GATEWAY_MCP_DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${GATEWAY_MCP_DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${GATEWAY_MCP_DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${GATEWAY_MCP_DDC_RPC_REGISTRY_SECRET_KEY:}
        redis:
          enabled: true
          mode: ${DDC_REDIS_MODE:SINGLE}
          host: ${DDC_REDIS_HOST:127.0.0.1}
          port: ${DDC_REDIS_PORT:6379}
          password: ${DDC_REDIS_PASSWORD:}
          database: ${DDC_REDIS_DATABASE:0}
        registry:
          enabled: ${DDC_REGISTRY_ENABLED:true}
          http:
            enabled: ${GATEWAY_MCP_ENGINE_DDC_REGISTRATION_ENABLED:true}
            instance-id: ${GATEWAY_MCP_ENGINE_DDC_INSTANCE_ID:}
            service-name: egon-cola-gateway-mcp-engine
            version: ${GATEWAY_MCP_ENGINE_VERSION:5.3.2}
            protocol: http
            advertised-host: ${GATEWAY_MCP_ENGINE_DDC_ADVERTISED_HOST:127.0.0.1}
            port: ${GATEWAY_MCP_ENGINE_DDC_ADVERTISED_PORT:18084}
            metadata:
              gateway.component: engine
              gateway.engine.role: MCP
      gateway:
        mcp-engine:
          gateway-group-code: ${GATEWAY_MCP_ENGINE_GROUP_CODE:default}
          env: ${GATEWAY_MCP_ENGINE_ENV:dev}
          namespace: ${GATEWAY_MCP_ENGINE_NAMESPACE:default}
          node-id: ${GATEWAY_MCP_ENGINE_NODE_ID:gateway-mcp-engine}
          instance-id: ${GATEWAY_MCP_ENGINE_DDC_INSTANCE_ID:gateway-mcp-engine}
          data-directory: ${GATEWAY_MCP_ENGINE_DATA_DIRECTORY:./data/gateway-mcp-engine}
          management-port: ${GATEWAY_MCP_ENGINE_MANAGEMENT_PORT:18085}
          listener:
            enabled: true
            host: ${GATEWAY_MCP_ENGINE_HOST:0.0.0.0}
            port: ${GATEWAY_MCP_ENGINE_PORT:18084}
            maximum-request-bytes: ${GATEWAY_MCP_ENGINE_MAXIMUM_REQUEST_BYTES:2097152}
            drain-timeout: ${GATEWAY_MCP_ENGINE_DRAIN_TIMEOUT:10s}
            tls:
              enabled: ${GATEWAY_MCP_ENGINE_TLS_ENABLED:false}
              development-plaintext: ${GATEWAY_MCP_ENGINE_DEVELOPMENT_PLAINTEXT:true}
              certificate-chain-path: ${GATEWAY_MCP_ENGINE_CERTIFICATE_CHAIN_PATH:}
              private-key-path: ${GATEWAY_MCP_ENGINE_PRIVATE_KEY_PATH:}
              trust-certificate-collection-path: ${GATEWAY_MCP_ENGINE_TRUST_CERTIFICATE_COLLECTION_PATH:}
              client-certificate-required: ${GATEWAY_MCP_ENGINE_CLIENT_CERTIFICATE_REQUIRED:false}
          outbound:
            max-connections: ${GATEWAY_MCP_ENGINE_OUTBOUND_MAX_CONNECTIONS:512}
            pending-acquire-max-count: ${GATEWAY_MCP_ENGINE_OUTBOUND_PENDING_ACQUIRE_MAX_COUNT:1024}
            idle-timeout: ${GATEWAY_MCP_ENGINE_OUTBOUND_IDLE_TIMEOUT:30s}
            request-timeout: ${GATEWAY_MCP_ENGINE_OUTBOUND_REQUEST_TIMEOUT:5s}
            maximum-request-bytes: ${GATEWAY_MCP_ENGINE_OUTBOUND_MAXIMUM_REQUEST_BYTES:1073741824}
            maximum-response-bytes: ${GATEWAY_MCP_ENGINE_OUTBOUND_MAXIMUM_RESPONSE_BYTES:4194304}
            channel-drain-timeout: ${GATEWAY_MCP_ENGINE_OUTBOUND_CHANNEL_DRAIN_TIMEOUT:5s}
            rpc-tls:
              enabled: ${GATEWAY_MCP_ENGINE_OUTBOUND_RPC_TLS_ENABLED:false}
              development-plaintext: ${GATEWAY_MCP_ENGINE_OUTBOUND_RPC_DEVELOPMENT_PLAINTEXT:true}
              certificate-chain-path: ${GATEWAY_MCP_ENGINE_OUTBOUND_RPC_CERTIFICATE_CHAIN_PATH:}
              private-key-path: ${GATEWAY_MCP_ENGINE_OUTBOUND_RPC_PRIVATE_KEY_PATH:}
              trust-certificate-collection-path: ${GATEWAY_MCP_ENGINE_OUTBOUND_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
              client-certificate-required: ${GATEWAY_MCP_ENGINE_OUTBOUND_RPC_CLIENT_CERTIFICATE_REQUIRED:false}
          active-health:
            enabled: ${GATEWAY_MCP_ENGINE_ACTIVE_HEALTH_ENABLED:false}
            interval: 10s
            jitter-ratio: 0.2
            timeout: 2s
            maximum-concurrency: 16
            failure-threshold: 2
            success-threshold: 2
            http-method: GET
            http-path: /actuator/health
            http-success-statuses: [200]
            rpc-service-name: ""
            rpc-connect-fallback: true
        engine:
          mcp:
            enabled: ${GATEWAY_MCP_ENABLED:true}
            artifact-root: ${GATEWAY_MCP_ARTIFACT_ROOT:${java.io.tmpdir}/egon-cola/gateway-mcp-artifacts}
            session-ttl: ${GATEWAY_MCP_SESSION_TTL:PT30M}
            stream-wait: ${GATEWAY_MCP_STREAM_WAIT:PT15S}
            maximum-request-bytes: ${GATEWAY_MCP_MAXIMUM_REQUEST_BYTES:16777216}
            maximum-resource-bytes: ${GATEWAY_MCP_MAXIMUM_RESOURCE_BYTES:67108864}
            maximum-app-artifact-bytes: ${GATEWAY_MCP_MAXIMUM_APP_ARTIFACT_BYTES:16777216}
            maximum-subscriptions-per-client: ${GATEWAY_MCP_MAXIMUM_SUBSCRIPTIONS_PER_CLIENT:100}
            maximum-active-tasks-per-client: ${GATEWAY_MCP_MAXIMUM_ACTIVE_TASKS_PER_CLIENT:100}
            tasks:
              lease-duration: ${GATEWAY_MCP_TASK_LEASE_DURATION:PT30S}
              poll-interval: ${GATEWAY_MCP_TASK_POLL_INTERVAL:PT2S}
              default-ttl: ${GATEWAY_MCP_TASK_DEFAULT_TTL:PT24H}
              cleanup-interval: ${GATEWAY_MCP_TASK_CLEANUP_INTERVAL:PT10M}
              service-token:
                enabled: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_ENABLED:false}
                scopes: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_SCOPES:mcp:operation:invoke}
                renewal-skew: ${GATEWAY_MCP_TASK_SERVICE_TOKEN_RENEWAL_SKEW:30s}
            remote:
              discovery-timeout: ${GATEWAY_MCP_REMOTE_DISCOVERY_TIMEOUT:PT20S}
              call-timeout: ${GATEWAY_MCP_REMOTE_CALL_TIMEOUT:PT60S}
              health-interval: ${GATEWAY_MCP_REMOTE_HEALTH_INTERVAL:PT30S}
              capability-sync-interval: ${GATEWAY_MCP_REMOTE_CAPABILITY_SYNC_INTERVAL:PT5M}
              circuit-open-duration: ${GATEWAY_MCP_REMOTE_CIRCUIT_OPEN_DURATION:PT30S}
              maximum-concurrent-calls: ${GATEWAY_MCP_REMOTE_MAXIMUM_CONCURRENT_CALLS:32}
              failure-threshold: ${GATEWAY_MCP_REMOTE_FAILURE_THRESHOLD:3}
              token-forwarding: false
            security:
              origin-validation: true
              protected-resource-metadata: true
              token-forwarding: false
            audit:
              enabled: ${GATEWAY_MCP_AUDIT_ENABLED:true}
              body-log-enabled: false
            redis:
              enabled: ${GATEWAY_MCP_REDIS_ENABLED:true}
              address: ${GATEWAY_MCP_REDIS_ADDRESS:redis://127.0.0.1:6379}
              database: ${GATEWAY_MCP_REDIS_DATABASE:0}
              password: ${GATEWAY_MCP_REDIS_PASSWORD:}
              key-prefix: ${GATEWAY_MCP_REDIS_KEY_PREFIX:gateway:mcp:}
              stream-max-length: ${GATEWAY_MCP_STREAM_MAX_LENGTH:256}
