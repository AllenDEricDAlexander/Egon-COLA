name: egon-cola-gateway

services:
  ddc-admin:
    environment:
      EGON_COLA_COMPONENT_DDC_ADMIN_TRANSPORT_SECURITY_MODE: MTLS
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CLIENT_AUTH: need
      SERVER_SSL_BUNDLE: management
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_RELOAD_ON_UPDATE: "true"
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_CERTIFICATE: file:/run/egon-tls/ddc-admin.crt
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_PRIVATE_KEY: file:/run/egon-tls/ddc-admin.key
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_TRUSTSTORE_CERTIFICATE: file:/run/egon-tls/ca.crt
      DDC_RPC_TLS_ENABLED: "true"
      DDC_RPC_DEVELOPMENT_PLAINTEXT: "false"
      DDC_RPC_CERTIFICATE_CHAIN_PATH: /run/egon-tls/ddc-admin.crt
      DDC_RPC_PRIVATE_KEY_PATH: /run/egon-tls/ddc-admin.key
      DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -o pipefail -ec 'printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" |
          openssl s_client -quiet -connect 127.0.0.1:18080 -servername ddc-admin
          -verify_return_error -verify_hostname ddc-admin -CAfile /run/egon-tls/ca.crt
          -cert /run/egon-tls/ddc-admin.crt -key /run/egon-tls/ddc-admin.key |
          grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-admin:
    environment:
      GATEWAY_ADMIN_TRANSPORT_SECURITY_MODE: MTLS
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CLIENT_AUTH: need
      SERVER_SSL_BUNDLE: management
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_RELOAD_ON_UPDATE: "true"
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_CERTIFICATE: file:/run/egon-tls/gateway-admin.crt
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_KEYSTORE_PRIVATE_KEY: file:/run/egon-tls/gateway-admin.key
      SPRING_SSL_BUNDLE_PEM_MANAGEMENT_TRUSTSTORE_CERTIFICATE: file:/run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_DDC_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-admin.crt
      EGON_COLA_COMPONENT_DDC_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-admin.key
      EGON_COLA_COMPONENT_DDC_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -o pipefail -ec 'printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" |
          openssl s_client -quiet -connect 127.0.0.1:18080 -servername gateway-admin
          -verify_return_error -verify_hostname gateway-admin -CAfile /run/egon-tls/ca.crt
          -cert /run/egon-tls/gateway-admin.crt -key /run/egon-tls/gateway-admin.key |
          grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-engine:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_TLS_RELOAD_ENABLED: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_DDC_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_DDC_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-engine-2:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_TLS_RELOAD_ENABLED: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_DDC_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_DDC_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_PUBLIC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_HTTP_INTERNAL_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-engine-2.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-engine-2.key
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      EGON_COLA_COMPONENT_GATEWAY_ENGINE_RPC_TLS_CLIENT_CERTIFICATE_REQUIRED: "true"
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-mcp-engine:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      EGON_COLA_COMPONENT_DDC_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-mcp-engine.crt
      EGON_COLA_COMPONENT_DDC_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-mcp-engine.key
      EGON_COLA_COMPONENT_DDC_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      GATEWAY_MCP_ENGINE_TLS_ENABLED: "true"
      GATEWAY_MCP_ENGINE_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_MCP_ENGINE_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-mcp-engine.crt
      GATEWAY_MCP_ENGINE_PRIVATE_KEY_PATH: /run/egon-tls/gateway-mcp-engine.key
      GATEWAY_MCP_ENGINE_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      GATEWAY_MCP_ENGINE_CLIENT_CERTIFICATE_REQUIRED: "true"
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_TLS_ENABLED: "true"
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-mcp-engine.crt
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_PRIVATE_KEY_PATH: /run/egon-tls/gateway-mcp-engine.key
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-mcp-engine-2:
    environment:
      SPRING_PROFILES_ACTIVE: operations
      SERVER_ADDRESS: 0.0.0.0
      EGON_COLA_COMPONENT_DDC_RPC_TLS_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_DEVELOPMENT_PLAINTEXT: "false"
      EGON_COLA_COMPONENT_DDC_RPC_TLS_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-mcp-engine-2.crt
      EGON_COLA_COMPONENT_DDC_RPC_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-mcp-engine-2.key
      EGON_COLA_COMPONENT_DDC_RPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      GATEWAY_MCP_ENGINE_TLS_ENABLED: "true"
      GATEWAY_MCP_ENGINE_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_MCP_ENGINE_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-mcp-engine-2.crt
      GATEWAY_MCP_ENGINE_PRIVATE_KEY_PATH: /run/egon-tls/gateway-mcp-engine-2.key
      GATEWAY_MCP_ENGINE_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
      GATEWAY_MCP_ENGINE_CLIENT_CERTIFICATE_REQUIRED: "true"
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_TLS_ENABLED: "true"
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_CERTIFICATE_CHAIN_PATH: /run/egon-tls/gateway-mcp-engine-2.crt
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_PRIVATE_KEY_PATH: /run/egon-tls/gateway-mcp-engine-2.key
      GATEWAY_MCP_ENGINE_OUTBOUND_RPC_TRUST_CERTIFICATE_COLLECTION_PATH: /run/egon-tls/ca.crt
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-data-plane-proxy:
    volumes:
      - ./haproxy.data-plane.mtls.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro

  gateway-admin-web:
    environment:
      GATEWAY_ADMIN_API_BASE_URL: https://gateway-admin:18080
      GATEWAY_ADMIN_API_DEVELOPMENT_PLAINTEXT: "false"
      GATEWAY_ADMIN_API_TLS_CA_PATH: /run/egon-tls/ca.crt
      GATEWAY_ADMIN_API_TLS_CERTIFICATE_PATH: /run/egon-tls/gateway-admin-web.crt
      GATEWAY_ADMIN_API_TLS_PRIVATE_KEY_PATH: /run/egon-tls/gateway-admin-web.key
    volumes:
      - ${GATEWAY_TLS_DIRECTORY:?set GATEWAY_TLS_DIRECTORY}:/run/egon-tls:ro
