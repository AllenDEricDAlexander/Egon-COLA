# A higher-precedence Spring list replaces the whole base list: retain all existing capabilities.
egon:
  cola:
    component:
      ddc:
        admin:
          rpc:
            credentials:
              - credential-id: runtime
                access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY}
                secret: ${DDC_RPC_RUNTIME_SECRET_KEY}
                client-type: SDK
                app-code-patterns: "*"
                env-patterns: "*"
                biz-code-patterns: "*"
                namespace-patterns: "*"
                allowed-operations: SDK_REGISTER,SDK_HEARTBEAT,SDK_OFFLINE,CONFIG_PULL,PUBLISH_ACK
              - credential-id: registry
                access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY}
                secret: ${DDC_RPC_REGISTRY_SECRET_KEY}
                client-type: REGISTRY
                app-code-patterns: "*"
                env-patterns: "*"
                biz-code-patterns: "*"
                namespace-patterns: "*"
                allowed-operations: REGISTRY_REGISTER,REGISTRY_HEARTBEAT,REGISTRY_DEREGISTER,REGISTRY_READ
              - credential-id: management
                access-key: ${DDC_RPC_MANAGEMENT_ACCESS_KEY}
                secret: ${DDC_RPC_MANAGEMENT_SECRET_KEY}
                client-type: MANAGEMENT
                app-code-patterns: "*"
                env-patterns: "*"
                biz-code-patterns: "*"
                namespace-patterns: "*"
                allowed-operations: MANAGEMENT_CONFIG_READ,MANAGEMENT_CONFIG_WRITE,MANAGEMENT_PUBLISH,MANAGEMENT_TASK_READ,MANAGEMENT_TASK_RETRY,MANAGEMENT_INSTANCE_READ,MANAGEMENT_SCOPE_READ,MANAGEMENT_REGISTRY_READ,MANAGEMENT_CATALOG_READ
              - credential-id: gateway-mcp-runtime
                access-key: ${GATEWAY_MCP_DDC_RUNTIME_ACCESS_KEY}
                secret: ${GATEWAY_MCP_DDC_RUNTIME_SECRET_KEY}
                client-type: SDK
                app-code-patterns: "*"
                env-patterns: "*"
                biz-code-patterns: "*"
                namespace-patterns: "*"
                allowed-operations: SDK_REGISTER,SDK_HEARTBEAT,SDK_OFFLINE,CONFIG_PULL,PUBLISH_ACK
              - credential-id: gateway-mcp-registry
                access-key: ${GATEWAY_MCP_DDC_REGISTRY_ACCESS_KEY}
                secret: ${GATEWAY_MCP_DDC_REGISTRY_SECRET_KEY}
                client-type: REGISTRY
                app-code-patterns: "*"
                env-patterns: "*"
                biz-code-patterns: "*"
                namespace-patterns: "*"
                allowed-operations: REGISTRY_REGISTER,REGISTRY_HEARTBEAT,REGISTRY_DEREGISTER,REGISTRY_READ
