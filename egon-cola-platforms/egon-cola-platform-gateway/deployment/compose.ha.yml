name: egon-cola-gateway

services:
  ddc-admin:
    profiles: ["ha"]

  ddc-admin-2:
    profiles: ["ha"]
    build:
      context: ../../egon-cola-platform-dynamic-config-center/egon-cola-platform-dynamic-config-center-admin
    environment:
      SERVER_PORT: 18080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway_ddc
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EGON_COLA_COMPONENT_DDC_ADMIN_REDIS_HOST: ddc-redis
      EGON_COLA_COMPONENT_DDC_ADMIN_REDIS_PORT: 6379
      EGON_COLA_COMPONENT_DDC_ADMIN_OPENAPI_SIGNATURE_ENABLED: "true"
      EGON_COLA_COMPONENT_DDC_ADMIN_OPENAPI_ACCESS_KEY: ${DDC_ACCESS_KEY}
      EGON_COLA_COMPONENT_DDC_ADMIN_OPENAPI_SECRET_KEY: ${DDC_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      ddc-redis:
        condition: service_healthy
    ports:
      - "18170:18080"
    restart: unless-stopped

  gateway-admin:
    profiles: ["ha"]
    environment:
      GATEWAY_ADMIN_DDC_ENDPOINT: http://control-plane-proxy:18070

  gateway-admin-2:
    profiles: ["ha"]
    build:
      context: ../egon-cola-platform-gateway-admin
    environment:
      SERVER_PORT: 18080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway_admin
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_ADMIN_DDC_ENABLED: "true"
      GATEWAY_ADMIN_DDC_ENDPOINT: http://control-plane-proxy:18070
      GATEWAY_ADMIN_DDC_ACCESS_KEY: ${DDC_ACCESS_KEY}
      GATEWAY_ADMIN_DDC_SECRET_KEY: ${DDC_SECRET_KEY}
      GATEWAY_ADMIN_SECRETS_MASTER_KEY_BASE64: ${GATEWAY_MASTER_KEY_BASE64}
      GATEWAY_ADMIN_SECURITY_HMAC_SECRET_BASE64: ${GATEWAY_ADMIN_JWT_HMAC_SECRET_BASE64}
      GATEWAY_ADMIN_OBSERVABILITY_KAFKA_ENABLED: "true"
      GATEWAY_ADMIN_OBSERVABILITY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      ddc-admin:
        condition: service_started
      ddc-admin-2:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "18180:18080"
    stop_grace_period: 30s
    restart: unless-stopped

  gateway-engine:
    profiles: ["ha"]
    environment:
      EGON_COLA_COMPONENT_DDC_ADMIN_ENDPOINT: http://control-plane-proxy:18070

  gateway-engine-2:
    profiles: ["ha"]
    environment:
      EGON_COLA_COMPONENT_DDC_ADMIN_ENDPOINT: http://control-plane-proxy:18070

  gateway-admin-web:
    profiles: ["ha"]
    environment:
      GATEWAY_ADMIN_API_BASE_URL: http://control-plane-proxy:18080

  control-plane-proxy:
    profiles: ["ha"]
    image: haproxy:3.1-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - ddc-admin
      - ddc-admin-2
      - gateway-admin
      - gateway-admin-2
    ports:
      - "18270:18070"
      - "18280:18080"
    healthcheck:
      test:
        - CMD
        - haproxy
        - -c
        - -f
        - /usr/local/etc/haproxy/haproxy.cfg
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
