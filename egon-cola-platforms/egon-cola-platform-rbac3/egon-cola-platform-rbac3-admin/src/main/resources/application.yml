spring:
  application:
    name: rbac3-admin
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/rbac3.properties
      - optional:ddc:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    url: ${RBAC3_POSTGRES_URL}
    username: ${RBAC3_POSTGRES_USER}
    password: ${RBAC3_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${RBAC3_ADVERTISED_PORT:0}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,rbac3Readiness

egon.cola.platform:
  idp:
    enabled: ${UNIFIED_IDENTITY_ENABLED:true}
    register-filter: false
    issuer: ${IDP_OAUTH_ISSUER}
    jwk-set-uri: ${IDP_JWK_SET_URI}
    resource-server-id: ${RBAC3_RESOURCE_SERVER_ID}
    resource-uri: ${RBAC3_RESOURCE_URI}
    admission:
      biz-code: ${RBAC3_RESOURCE_BIZ_CODE:permission}
      app-code: ${RBAC3_RESOURCE_APP_CODE:rbac3}
      environment: ${DEPLOYMENT_ENV}
      instance-id: ${RBAC3_INSTANCE_ID}
      management-client-id: ${RBAC3_RESOURCE_MANAGEMENT_CLIENT_ID}
      kid: ${RBAC3_RESOURCE_MANAGEMENT_KEY_ID}
      private-key-path: ${RBAC3_RESOURCE_MANAGEMENT_PRIVATE_KEY_FILE}
      rpc-target: ${RBAC3_RESOURCE_ADMISSION_RPC_TARGET}
      rpc-timeout: ${RBAC3_RESOURCE_ADMISSION_RPC_TIMEOUT:3s}
      renewal-skew: ${RBAC3_RESOURCE_ADMISSION_RENEWAL_SKEW:30s}
  rbac3:
    enabled: ${UNIFIED_IDENTITY_ENABLED:true}
    register-filter: false
    system-code: rbac3-admin
    runtime:
      redis-enabled: true
      redis-address: ${RBAC3_AUTHORIZATION_REDIS_ADDRESS}
      database: ${RBAC3_AUTHORIZATION_REDIS_DATABASE:0}
    authorization:
      endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT}
      service-credential-file: ${RBAC3_ADMIN_SERVICE_CREDENTIAL_FILE}
      service-token:
        enabled: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_ENABLED:false}
        token-endpoint: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_TOKEN_ENDPOINT:}
        client-id: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_CLIENT_ID:}
        key-id: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_KEY_ID:}
        private-key-file: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_PRIVATE_KEY_FILE:}
        resource-uri: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_RESOURCE_URI:}
        scopes: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_SCOPES:}
        renewal-skew: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_RENEWAL_SKEW:30s}

egon:
  rbac3:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    session-idle-timeout: 30m
    session-absolute-timeout: 12h
    maximum-active-roots: 16
    component-keys: ${RBAC3_COMPONENT_KEYS}
    runtime:
      redis-enabled: true
      redis-address: ${RBAC3_RUNTIME_REDIS_ADDRESS}
      redis-database: ${RBAC3_RUNTIME_REDIS_DATABASE:0}
      redis-timeout: ${RBAC3_RUNTIME_REDIS_TIMEOUT:2s}
      redis-password-file: ${RBAC3_RUNTIME_REDIS_PASSWORD_FILE}
    gateway-status:
      admin-base-url: ${GATEWAY_ADMIN_BASE_URL}
      gateway-group-id: ${GATEWAY_GROUP_ID}
      release-id: ${GATEWAY_RELEASE_ID}
      oauth-token-file: ${GATEWAY_STATUS_OAUTH_TOKEN_FILE}
      timeout: ${GATEWAY_STATUS_TIMEOUT:3s}
    security:
      jwt-private-key-file: ${RBAC3_JWT_PRIVATE_KEY_FILE}
      jwt-public-key-file: ${RBAC3_JWT_PUBLIC_KEY_FILE}
      jwt-kid: ${RBAC3_JWT_KID}
      issuer: ${RBAC3_JWT_ISSUER}
      resource-uris: ${RBAC3_JWT_RESOURCE_URIS}
      audit-cursor-secret-file: ${RBAC3_AUDIT_CURSOR_SECRET_FILE}
    topology:
      ddc-registry-client-bean: ddcRedissonClient
      runtime-client-bean: rbac3RuntimeRedissonClient
  cola:
    component:
      id:
        enabled: true
        machine-id: ${RBAC3_SNOWFLAKE_MACHINE_ID}
      rpc:
        tls:
          enabled: ${IDP_ADMISSION_RPC_TLS_ENABLED:false}
          development-plaintext: ${IDP_ADMISSION_RPC_DEVELOPMENT_PLAINTEXT:${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}}
          certificate-chain-path: ${IDP_ADMISSION_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${IDP_ADMISSION_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${IDP_ADMISSION_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      ddc:
        enabled: true
        biz-code: ${RBAC3_RESOURCE_BIZ_CODE:permission}
        app-code: ${RBAC3_RESOURCE_APP_CODE:rbac3}
        env: ${DEPLOYMENT_ENV}
        namespace: ${DEPLOYMENT_NAMESPACE}
        instance:
          id: ${RBAC3_INSTANCE_ID}
          lease-seconds: 30
          heartbeat-interval-seconds: 10
        consistency:
          fail-fast: true
          reconcile-enabled: true
          reconcile-interval-seconds: 30
        rpc:
          target: ${DDC_RPC_TARGET:dns:///ddc-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:false}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY}
        redis:
          enabled: true
          mode: ${DDC_REGISTRY_REDIS_MODE:SINGLE}
          nodes: ${DDC_REGISTRY_REDIS_NODES:}
          master-name: ${DDC_REGISTRY_REDIS_MASTER_NAME:}
          host: ${DDC_REGISTRY_REDIS_HOST}
          port: ${DDC_REGISTRY_REDIS_PORT:6379}
          password: ${DDC_REGISTRY_REDIS_PASSWORD}
          database: ${DDC_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: true
          http:
            enabled: true
            env: ${DEPLOYMENT_ENV}
            namespace: ${DEPLOYMENT_NAMESPACE}
            instance-id: ${RBAC3_INSTANCE_ID}
            service-name: rbac3-admin
            group: default
            version: ${RBAC3_ARTIFACT_VERSION}
            protocol: http
            advertised-host: ${RBAC3_ADVERTISED_HOST}
            port: ${RBAC3_ADVERTISED_PORT}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      gateway:
        reporting:
          enabled: true
          admin-base-url: ${GATEWAY_ADMIN_BASE_URL}
          biz-code: ${RBAC3_RESOURCE_BIZ_CODE:permission}
          application-code: ${RBAC3_RESOURCE_APP_CODE:rbac3}
          application-name: RBAC3 Permission Admin
          env: ${DEPLOYMENT_ENV}
          namespace: ${DEPLOYMENT_NAMESPACE}
          artifact-version: ${RBAC3_ARTIFACT_VERSION}
          build-id: ${RBAC3_BUILD_ID}
          declared-hosts: ${RBAC3_DECLARED_HOSTS}
          fail-fast: true
          access-key: ${GATEWAY_REPORT_ACCESS_KEY}
          secret-key: ${GATEWAY_REPORT_SECRET_KEY}
          state-file: ${GATEWAY_REPORT_STATE_FILE}
      transactional-outbox:
        enabled: true
        node-id: ${RBAC3_INSTANCE_ID}
        storage:
          data-source-bean-name: dataSource
          transaction-manager-bean-name: transactionManager
          validate-schema: true
        polling:
          enabled: true
          fixed-delay: 1s
          batch-size: 100
          concurrency: 4
