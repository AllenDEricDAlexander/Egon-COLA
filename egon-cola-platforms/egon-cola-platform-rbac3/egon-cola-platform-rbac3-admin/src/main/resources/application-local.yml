spring:
  datasource:
    url: ${RBAC3_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/egon_rbac3_unified_identity_local}
    username: ${RBAC3_POSTGRES_USER:postgres}
    password: ${RBAC3_POSTGRES_PASSWORD:HomeLab666}
server:
  port: ${RBAC3_ADVERTISED_PORT:0}

springdoc:
  api-docs:
    enabled: ${RBAC3_OPENAPI_ENABLED:true}
    version: OPENAPI_3_1
  group-configs:
    - group: iam
      paths-to-match:
        - /api/rbac3/v1/**
        - /api/v1/auth/about
      paths-to-exclude:
        - /api/rbac3/v1/registration/**
        - /api/rbac3/v1/internal/business-participations/**

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping

egon.cola.platform:
  idp:
    issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
    jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
    resource-server-id: ${RBAC3_RESOURCE_SERVER_ID:permission-rbac3-local}
    resource-uri: ${RBAC3_RESOURCE_URI:https://api.egon.internal/local/permission/rbac3}
  rbac3:
    runtime:
      redis-address: ${RBAC3_AUTHORIZATION_REDIS_ADDRESS:redis://127.0.0.1:6379}
      password-file: ${UNIFIED_IDENTITY_REDIS_PASSWORD_FILE:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/secrets/redis.password}
    authorization:
      endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
      service-token:
        enabled: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_ENABLED:false}
        resource-uri: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_RESOURCE_URI:}
        scopes: ${RBAC3_AUTHORIZATION_SERVICE_TOKEN_SCOPES:}

egon:
  rbac3:
    initial-context:
      ddc-enabled: ${RBAC3_INITIAL_DDC_BOOTSTRAP_ENABLED:true}
    development-bootstrap:
      enabled: ${RBAC3_DEVELOPMENT_BOOTSTRAP_ENABLED:false}
      auto-activate-local-admin-roles: ${RBAC3_DEVELOPMENT_AUTO_ACTIVATE_LOCAL_ADMIN_ROLES:false}
      tenant-ids: ${RBAC3_DEVELOPMENT_TENANT_IDS:}
      identity-sub: ${RBAC3_DEVELOPMENT_IDENTITY_SUB:}
    component-keys: ${RBAC3_COMPONENT_KEYS:rbac3-page}
    runtime:
      redis-address: ${RBAC3_RUNTIME_REDIS_ADDRESS:redis://localhost:6379}
      redis-password-file: ${RBAC3_RUNTIME_REDIS_PASSWORD_FILE:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/secrets/redis.password}
    gateway-status:
      admin-base-url: ${GATEWAY_ADMIN_BASE_URL:http://localhost:8088}
      gateway-group-id: ${GATEWAY_GROUP_ID:local}
      release-id: ${GATEWAY_RELEASE_ID:local}
      oauth-token-file: ${GATEWAY_STATUS_OAUTH_TOKEN_FILE:build/local-gateway-status-token.json}
    security:
      audit-cursor-secret-file: ${RBAC3_AUDIT_CURSOR_SECRET_FILE:build/local-audit-secret}
  cola:
    component:
      id:
        machine-id: ${RBAC3_SNOWFLAKE_MACHINE_ID:0}
      ddc:
        enabled: ${RBAC3_DDC_ENABLED:false}
        env: local
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
        redis:
          password: ${DDC_REGISTRY_REDIS_PASSWORD:HomeLab666}
        registry:
          enabled: ${RBAC3_DDC_ENABLED:false}
          http:
            enabled: ${RBAC3_HTTP_PROVIDER_ENABLED:false}
            port: 0
      gateway:
        openapi:
          enabled: ${RBAC3_OPENAPI_ENABLED:true}
          publish-to-ddc: ${RBAC3_OPENAPI_PUBLISH_TO_DDC:true}
          published-groups:
            - iam
          biz-code: ${RBAC3_OPENAPI_BIZ_CODE:${RBAC3_RESOURCE_BIZ_CODE:permission}}
          application-code: ${RBAC3_OPENAPI_APPLICATION_CODE:${RBAC3_RESOURCE_APP_CODE:rbac3}}
          resource-uri: ${RBAC3_OPENAPI_RESOURCE_URI:${RBAC3_RESOURCE_URI:https://api.egon.internal/local/permission/rbac3}}
          artifact-version: ${RBAC3_OPENAPI_ARTIFACT_VERSION:${RBAC3_ARTIFACT_VERSION:local}}
          build-id: ${RBAC3_OPENAPI_BUILD_ID:${RBAC3_BUILD_ID:local}}
        reporting:
          enabled: ${RBAC3_GATEWAY_REPORTING_ENABLED:false}
          env: local
          namespace: default
          application-code: ${RBAC3_RESOURCE_APP_CODE:rbac3}
          artifact-version: local
      transactional-outbox:
        node-id: rbac3-local
        polling:
          enabled: false
