spring:
  datasource:
    url: ${IDP_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/egon_identity_local}
    username: ${IDP_POSTGRES_USER:postgres}
    password: ${IDP_POSTGRES_PASSWORD:HomeLab666}
  data:
    redis:
      host: ${IDP_REDIS_HOST:127.0.0.1}
      port: ${IDP_REDIS_PORT:6379}
      password: ${IDP_REDIS_PASSWORD:HomeLab666}
      database: ${IDP_REDIS_DATABASE:0}

egon.cola.platform:
  idp:
    issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
    jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
  rbac3:
    runtime:
      redis-address: ${IDP_AUTHORIZATION_REDIS_ADDRESS:redis://127.0.0.1:6379}
      password-file: ${UNIFIED_IDENTITY_REDIS_PASSWORD_FILE:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/secrets/redis.password}
    authorization:
      endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
      service-credential-file: ${IDP_RBAC3_SERVICE_CREDENTIAL_FILE:.runtime/unified-identity/idp-admin.service.jwt}

egon:
  idp:
    development-bootstrap:
      enabled: ${IDP_DEVELOPMENT_BOOTSTRAP_ENABLED:false}
    oauth:
      issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
      login-uri: ${IDP_OAUTH_LOGIN_URI:http://127.0.0.1:18121/login}
      allowed-origins: ${IDP_OAUTH_ALLOWED_ORIGINS:http://127.0.0.1:18121,http://127.0.0.1:18131,http://127.0.0.1:18141,http://127.0.0.1:18152}
      refresh-cookie-secure: false
  cola:
    component:
      ddc:
        rpc:
          target: ${DDC_RPC_TARGET:dns:///127.0.0.1:19080}
          tls:
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:true}
        redis:
          password: ${DDC_REGISTRY_REDIS_PASSWORD:HomeLab666}
