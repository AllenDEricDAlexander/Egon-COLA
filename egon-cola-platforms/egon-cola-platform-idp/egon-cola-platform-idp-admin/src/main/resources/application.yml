spring:
  application:
    name: idp-admin
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/idp.properties
      - optional:ddc:application.yml
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    url: ${IDP_POSTGRES_URL}
    username: ${IDP_POSTGRES_USER}
    password: ${IDP_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${IDP_REDIS_HOST}
      port: ${IDP_REDIS_PORT:6379}
      password: ${IDP_REDIS_PASSWORD:}
      database: ${IDP_REDIS_DATABASE:0}
      timeout: ${IDP_REDIS_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${IDP_ADVERTISED_PORT:18120}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

egon.cola.platform:
  idp:
    enabled: ${UNIFIED_IDENTITY_ENABLED:true}
    register-filter: false
    issuer: ${IDP_OAUTH_ISSUER}
    jwk-set-uri: ${IDP_JWK_SET_URI}
    resource-server-id: ${IDP_RESOURCE_SERVER_ID}
    resource-uri: ${IDP_RESOURCE_URI}
    admission:
      biz-code: ${IDP_RESOURCE_BIZ_CODE:permission}
      app-code: ${IDP_RESOURCE_APP_CODE:idp}
      environment: ${DEPLOYMENT_ENV}
      instance-id: ${IDP_INSTANCE_ID}
      management-client-id: ${IDP_RESOURCE_MANAGEMENT_CLIENT_ID}
      kid: ${IDP_RESOURCE_MANAGEMENT_KEY_ID}
      private-key-path: ${IDP_RESOURCE_MANAGEMENT_PRIVATE_KEY_FILE}
      rpc-target: ${IDP_RESOURCE_ADMISSION_RPC_TARGET}
      rpc-timeout: ${IDP_RESOURCE_ADMISSION_RPC_TIMEOUT:3s}
      renewal-skew: ${IDP_RESOURCE_ADMISSION_RENEWAL_SKEW:30s}
  rbac3:
    enabled: ${UNIFIED_IDENTITY_ENABLED:true}
    register-filter: false
    system-code: idp-admin
    runtime:
      redis-enabled: true
      redis-address: ${IDP_AUTHORIZATION_REDIS_ADDRESS}
      database: ${IDP_AUTHORIZATION_REDIS_DATABASE:0}
    authorization:
      endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT}

egon:
  idp:
    identity-state-key-prefix: "identity:v1:user:"
    oauth:
      issuer: ${IDP_OAUTH_ISSUER}
      login-uri: ${IDP_OAUTH_LOGIN_URI}
      allowed-origins: ${IDP_OAUTH_ALLOWED_ORIGINS:}
      refresh-cookie-secure: ${IDP_REFRESH_COOKIE_SECURE:true}
      signing-key:
        kid: ${IDP_SIGNING_KEY_KID}
        public-key-file: ${IDP_SIGNING_PUBLIC_KEY_FILE}
        private-key-file: ${IDP_SIGNING_PRIVATE_KEY_FILE}
    rbac3:
      base-url: ${IDP_RBAC3_BASE_URL}
      service-token:
        client-id: ${IDP_RBAC3_SERVICE_CLIENT_ID}
        key-id: ${IDP_RBAC3_SERVICE_KEY_ID}
        private-key-file: ${IDP_RBAC3_SERVICE_PRIVATE_KEY_FILE}
        resource-uri: ${IDP_RBAC3_RESOURCE_URI}
        tenant-id: ${IDP_RBAC3_SERVICE_TENANT_ID}
        scopes: ${IDP_RBAC3_SERVICE_SCOPES}
        ttl-seconds: ${IDP_RBAC3_SERVICE_TOKEN_TTL_SECONDS:300}
        renewal-skew-seconds: ${IDP_RBAC3_SERVICE_TOKEN_RENEWAL_SKEW_SECONDS:30}
  cola:
    component:
      id:
        enabled: true
        machine-id: ${IDP_SNOWFLAKE_MACHINE_ID}
      rpc:
        enabled: ${IDP_RPC_ENABLED:true}
        identity:
          env: ${DEPLOYMENT_ENV:local}
          host: ${IDP_ADVERTISED_HOST:127.0.0.1}
          instance-id: ${IDP_INSTANCE_ID:idp-local-1}
        provider:
          enabled: ${IDP_RPC_PROVIDER_ENABLED:true}
          bind-address: ${IDP_RPC_BIND_ADDRESS:0.0.0.0}
          port: ${IDP_RPC_PORT:18122}
          advertised-host: ${IDP_RPC_ADVERTISED_HOST:${IDP_ADVERTISED_HOST:127.0.0.1}}
          advertised-port: ${IDP_RPC_ADVERTISED_PORT:${IDP_RPC_PORT:18122}}
          registration-mode: DISABLED
        consumer:
          enabled: false
        tls:
          enabled: ${IDP_RPC_TLS_ENABLED:false}
          development-plaintext: ${IDP_RPC_DEVELOPMENT_PLAINTEXT:false}
          certificate-chain-path: ${IDP_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${IDP_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${IDP_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      transactional-outbox:
        enabled: true
        node-id: ${IDP_INSTANCE_ID:idp-local-1}
      ddc:
        enabled: ${IDP_DDC_ENABLED:false}
        biz-code: ${IDP_RESOURCE_BIZ_CODE:permission}
        app-code: ${IDP_RESOURCE_APP_CODE:idp}
        env: ${DEPLOYMENT_ENV:local}
        namespace: ${DEPLOYMENT_NAMESPACE:default}
        instance:
          id: ${IDP_INSTANCE_ID:idp-local-1}
          lease-seconds: 30
          heartbeat-interval-seconds: 10
        consistency:
          fail-fast: true
          reconcile-enabled: true
          reconcile-interval-seconds: 30
        rpc:
          target: ${DDC_RPC_TARGET:dns:///ddc-admin:19080}
          load-balancing-policy: round_robin
          tls:
            enabled: ${DDC_RPC_TLS_ENABLED:false}
            development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          auth:
            runtime:
              access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
              secret-key: ${DDC_RPC_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
              secret-key: ${DDC_RPC_REGISTRY_SECRET_KEY:}
            management:
              access-key: ${DDC_RPC_MANAGEMENT_ACCESS_KEY:}
              secret-key: ${DDC_RPC_MANAGEMENT_SECRET_KEY:}
        redis:
          enabled: ${IDP_DDC_ENABLED:false}
          mode: SINGLE
          host: ${DDC_REGISTRY_REDIS_HOST:127.0.0.1}
          port: ${DDC_REGISTRY_REDIS_PORT:6379}
          password: ${DDC_REGISTRY_REDIS_PASSWORD:}
          database: ${DDC_REGISTRY_REDIS_DATABASE:0}
        registry:
          enabled: ${IDP_DDC_ENABLED:false}
          http:
            enabled: ${IDP_HTTP_PROVIDER_ENABLED:false}
            env: ${DEPLOYMENT_ENV:local}
            namespace: ${DEPLOYMENT_NAMESPACE:default}
            instance-id: ${IDP_INSTANCE_ID:idp-local-1}
            service-name: idp-admin
            group: default
            version: ${IDP_ARTIFACT_VERSION:5.3.2}
            protocol: http
            advertised-host: ${IDP_ADVERTISED_HOST:127.0.0.1}
            port: ${IDP_ADVERTISED_PORT:18120}
            lease-seconds: 30
            heartbeat-interval-seconds: 10
            fail-fast: true
      gateway:
        reporting:
          enabled: ${IDP_GATEWAY_REPORTING_ENABLED:true}
          admin-base-url: ${GATEWAY_ADMIN_BASE_URL:}
          biz-code: ${IDP_RESOURCE_BIZ_CODE:permission}
          application-code: ${IDP_RESOURCE_APP_CODE:idp}
          application-name: IdP Identity Admin
          env: ${DEPLOYMENT_ENV:local}
          namespace: ${DEPLOYMENT_NAMESPACE:default}
          artifact-version: ${IDP_ARTIFACT_VERSION:local}
          build-id: ${IDP_BUILD_ID:local}
          declared-hosts: ${IDP_DECLARED_HOSTS:127.0.0.1}
          fail-fast: true
          access-key: ${GATEWAY_REPORT_ACCESS_KEY:}
          secret-key: ${GATEWAY_REPORT_SECRET_KEY:}
          state-file: ${GATEWAY_REPORT_STATE_FILE:}
