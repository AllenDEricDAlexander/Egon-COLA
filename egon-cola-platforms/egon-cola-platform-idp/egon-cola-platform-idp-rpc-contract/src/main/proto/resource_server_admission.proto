syntax = "proto3";

package egon.idp.v1;

option java_multiple_files = true;
option java_package = "top.egon.cola.platform.idp.rpc.contract.proto.v1";

import "google/protobuf/timestamp.proto";

// IdP 内部资源服务启动准入。 / Internal IdP Resource Server startup admission.
service ResourceServerAdmissionService {
  // 验证管理客户端并签发短期准入票据。 / Authenticates the management client and issues a short-lived ticket.
  rpc IssueAdmission(IssueResourceServerAdmissionRequest)
      returns (IssueResourceServerAdmissionResponse);
}

// 精确绑定业务域、应用、环境和实例的准入请求。 / Admission request exactly bound to business, app, environment, and instance.
message IssueResourceServerAdmissionRequest {
  // RFC 7523 Client Assertion 类型。 / RFC 7523 Client Assertion type.
  string client_assertion_type = 1;
  // 资源绑定的管理客户端标识。 / Resource-bound management client identifier.
  string client_id = 2;
  // RPC Audience 绑定的 private_key_jwt。 / RPC-audience-bound private_key_jwt.
  string client_assertion = 3;
  // Resource Server 唯一标识。 / Unique Resource Server identifier.
  string resource_server_id = 4;
  // RFC 8707 Resource URI。 / RFC 8707 Resource URI.
  string resource = 5;
  // 业务域编码。 / Business-domain code.
  string biz = 6;
  // 应用编码。 / Application code.
  string app = 7;
  // 环境编码。 / Environment code.
  string env = 8;
  // DDC 稳定实例标识。 / Stable DDC instance identifier.
  string instance_id = 9;
}

// 准入 JWT 和本地续签调度所需的过期时间。 / Admission JWT and expiration used for local renewal scheduling.
message IssueResourceServerAdmissionResponse {
  // 紧凑的 rs-admission+jwt。 / Compact rs-admission+jwt.
  string ticket = 1;
  // 票据的权威过期时间。 / Authoritative ticket expiration time.
  google.protobuf.Timestamp expires_at = 2;
}
