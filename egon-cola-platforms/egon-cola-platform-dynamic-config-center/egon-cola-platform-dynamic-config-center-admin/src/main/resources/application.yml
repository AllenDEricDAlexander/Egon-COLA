server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${sdk.version}

spring:
  application:
    name: egon-cola-ddc-admin
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  config:
    import:
      - classpath:META-INF/egon-cola-ddc.properties
      - optional:file:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/env/ddc.properties
  flyway:
    locations: classpath:db/postgresql

egon:
  cola:
    platform:
      idp:
        enabled: ${UNIFIED_IDENTITY_ENABLED:false}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER:}
        jwk-set-uri: ${IDP_JWK_SET_URI:}
        audiences: [ddc-admin-web]
        client-ids: [ddc-admin-web]
      rbac3:
        enabled: ${UNIFIED_IDENTITY_ENABLED:false}
        register-filter: false
        system-code: ddc-admin
        runtime:
          redis-enabled: true
          redis-address: ${DDC_AUTHORIZATION_REDIS_ADDRESS:}
          database: ${DDC_AUTHORIZATION_REDIS_DATABASE:0}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:}
          service-credential-file: ${DDC_RBAC3_SERVICE_CREDENTIAL_FILE:}
    component:
      ddc:
        enabled: false
        registry:
          enabled: false
        admin:
          security:
            local-dev: ${DDC_ADMIN_SECURITY_LOCAL_DEV:false}
            jwt:
              issuer: ${DDC_ADMIN_JWT_ISSUER:}
              audience: ${DDC_ADMIN_JWT_AUDIENCE:}
              jwk-set-uri: ${DDC_ADMIN_JWT_JWK_SET_URI:}
              hmac-secret-base64: ${DDC_ADMIN_JWT_HMAC_SECRET_BASE64:}
          transport-security:
            mode: DEVELOPMENT_PLAINTEXT
          max-config-bytes: 1048576
          redis:
            mode: SINGLE
            nodes: []
            master-name:
            host: 127.0.0.1
            port: 6379
            database: 0
          rpc:
            signature-enabled: ${DDC_RPC_SIGNATURE_ENABLED:true}
            credentials:
              - credential-id: ${DDC_RPC_RUNTIME_CREDENTIAL_ID:runtime}
                access-key: ${DDC_RPC_RUNTIME_ACCESS_KEY:}
                secret: ${DDC_RPC_RUNTIME_SECRET_KEY:}
                client-type: SDK
                app-code-patterns: ${DDC_RPC_RUNTIME_APP_CODE_PATTERNS:*}
                env-patterns: ${DDC_RPC_RUNTIME_ENV_PATTERNS:*}
                biz-code-patterns: ${DDC_RPC_RUNTIME_BIZ_CODE_PATTERNS:*}
                namespace-patterns: ${DDC_RPC_RUNTIME_NAMESPACE_PATTERNS:*}
                allowed-operations: SDK_REGISTER,SDK_HEARTBEAT,SDK_OFFLINE,CONFIG_PULL,PUBLISH_ACK
              - credential-id: ${DDC_RPC_REGISTRY_CREDENTIAL_ID:registry}
                access-key: ${DDC_RPC_REGISTRY_ACCESS_KEY:}
                secret: ${DDC_RPC_REGISTRY_SECRET_KEY:}
                client-type: REGISTRY
                app-code-patterns: ${DDC_RPC_REGISTRY_APP_CODE_PATTERNS:*}
                env-patterns: ${DDC_RPC_REGISTRY_ENV_PATTERNS:*}
                biz-code-patterns: ${DDC_RPC_REGISTRY_BIZ_CODE_PATTERNS:*}
                namespace-patterns: ${DDC_RPC_REGISTRY_NAMESPACE_PATTERNS:*}
                allowed-operations: REGISTRY_REGISTER,REGISTRY_HEARTBEAT,REGISTRY_DEREGISTER,REGISTRY_READ
              - credential-id: ${DDC_RPC_MANAGEMENT_CREDENTIAL_ID:management}
                access-key: ${DDC_RPC_MANAGEMENT_ACCESS_KEY:}
                secret: ${DDC_RPC_MANAGEMENT_SECRET_KEY:}
                client-type: MANAGEMENT
                app-code-patterns: ${DDC_RPC_MANAGEMENT_APP_CODE_PATTERNS:*}
                env-patterns: ${DDC_RPC_MANAGEMENT_ENV_PATTERNS:*}
                biz-code-patterns: ${DDC_RPC_MANAGEMENT_BIZ_CODE_PATTERNS:*}
                namespace-patterns: ${DDC_RPC_MANAGEMENT_NAMESPACE_PATTERNS:*}
                allowed-operations: MANAGEMENT_CONFIG_READ,MANAGEMENT_CONFIG_WRITE,MANAGEMENT_PUBLISH,MANAGEMENT_TASK_READ,MANAGEMENT_TASK_RETRY,MANAGEMENT_INSTANCE_READ,MANAGEMENT_SCOPE_READ,MANAGEMENT_REGISTRY_READ
            allowed-clock-skew-seconds: 300
            nonce-cache-max-size: 10000
          publish:
            dispatch-timeout-ms: 5000
            default-timeout-ms: 30000
            max-timeout-ms: 60000
            scan-interval-ms: 1000
            completion-poll-interval-ms: 100
            recovery-stale-ms: 120000
      rpc:
        enabled: true
        provider:
          enabled: true
          port: ${DDC_RPC_PORT:19080}
          registration-mode: DISABLED
        consumer:
          enabled: false
        tls:
          enabled: ${DDC_RPC_TLS_ENABLED:false}
          development-plaintext: ${DDC_RPC_DEVELOPMENT_PLAINTEXT:false}
          certificate-chain-path: ${DDC_RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${DDC_RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${DDC_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
