server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: egon-cola-ddc-admin
  config:
    import: classpath:META-INF/egon-cola-ddc.properties
  flyway:
    locations: classpath:db/postgresql

egon:
  cola:
    platform:
      idp:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        issuer: ${IDP_OAUTH_ISSUER}
        jwk-set-uri: ${IDP_JWK_SET_URI}
        audiences: [ddc-admin-web]
        client-ids: [ddc-admin-web]
      rbac3:
        enabled: ${UNIFIED_IDENTITY_ENABLED:true}
        register-filter: false
        system-code: ddc-admin
        runtime:
          redis-enabled: true
          redis-address: ${DDC_AUTHORIZATION_REDIS_ADDRESS}
          database: ${DDC_AUTHORIZATION_REDIS_DATABASE:0}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT}
          service-credential-file: ${DDC_RBAC3_SERVICE_CREDENTIAL_FILE}
    component:
      ddc:
        enabled: false
        admin:
          security:
            local-dev: ${DDC_ADMIN_SECURITY_LOCAL_DEV:false}
            jwt:
              issuer: ${DDC_ADMIN_JWT_ISSUER:}
              audience: ${DDC_ADMIN_JWT_AUDIENCE:}
              jwk-set-uri: ${DDC_ADMIN_JWT_JWK_SET_URI:}
              hmac-secret-base64: ${DDC_ADMIN_JWT_HMAC_SECRET_BASE64:}
          manifest:
            version: ${sdk.version}
          transport-security:
            mode: DEVELOPMENT_PLAINTEXT
          max-value-bytes: 1048576
          redis:
            mode: SINGLE
            nodes: []
            master-name:
            host: 127.0.0.1
            port: 6379
            database: 0
          openapi:
            signature-enabled: ${DDC_OPENAPI_SIGNATURE_ENABLED:true}
            credentials:
              - credential-id: ${DDC_OPENAPI_CREDENTIAL_ID:default-service}
                access-key: ${DDC_OPENAPI_ACCESS_KEY:}
                secret: ${DDC_OPENAPI_SECRET:}
                client-type: ${DDC_OPENAPI_CLIENT_TYPE:}
                app-code-patterns: ${DDC_OPENAPI_APP_CODE_PATTERNS:}
                env-patterns: ${DDC_OPENAPI_ENV_PATTERNS:}
                biz-code-patterns: ${DDC_OPENAPI_BIZ_CODE_PATTERNS:}
                namespace-patterns: ${DDC_OPENAPI_NAMESPACE_PATTERNS:}
                allowed-operations: ${DDC_OPENAPI_ALLOWED_OPERATIONS:}
            allowed-clock-skew-seconds: 300
            nonce-cache-max-size: 10000
          publish:
            dispatch-timeout-ms: 5000
            default-timeout-ms: 30000
            max-timeout-ms: 60000
            scan-interval-ms: 1000
            completion-poll-interval-ms: 100
            recovery-stale-ms: 120000
