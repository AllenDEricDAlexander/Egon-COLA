spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/egon_ddc_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

egon:
  cola:
    platform:
      idp:
        issuer: ${IDP_OAUTH_ISSUER:http://127.0.0.1:18120}
        jwk-set-uri: ${IDP_JWK_SET_URI:http://127.0.0.1:18120/oauth2/jwks}
      rbac3:
        runtime:
          redis-address: ${DDC_AUTHORIZATION_REDIS_ADDRESS:redis://127.0.0.1:6379}
          password-file: ${UNIFIED_IDENTITY_REDIS_PASSWORD_FILE:${UNIFIED_PLATFORM_RUNTIME_DIR:target/local-unified-platform}/secrets/redis.password}
        authorization:
          endpoint: ${RBAC3_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
          service-token:
            enabled: ${DDC_RBAC3_SERVICE_TOKEN_ENABLED:false}
            token-endpoint: ${DDC_RBAC3_SERVICE_TOKEN_TOKEN_ENDPOINT:http://127.0.0.1:18120/oauth2/token}
            client-id: ${DDC_RBAC3_SERVICE_TOKEN_CLIENT_ID:}
            key-id: ${DDC_RBAC3_SERVICE_TOKEN_KEY_ID:}
            private-key-file: ${DDC_RBAC3_SERVICE_TOKEN_PRIVATE_KEY_FILE:}
            resource-uri: ${DDC_RBAC3_SERVICE_TOKEN_RESOURCE_URI:}
            scopes: ${DDC_RBAC3_SERVICE_TOKEN_SCOPES:}
    component:
      ddc:
        admin:
          redis:
            password: ${DDC_REDIS_PASSWORD}
      rpc:
        tls:
          development-plaintext: true
      gateway:
        reporting:
          enabled: ${DDC_GATEWAY_REPORTING_ENABLED:false}
          env: local
          namespace: default
          application-code: ddc
          artifact-version: local
