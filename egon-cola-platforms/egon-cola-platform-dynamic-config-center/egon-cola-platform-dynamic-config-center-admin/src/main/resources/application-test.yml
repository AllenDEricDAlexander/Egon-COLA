spring:
  datasource:
    url: jdbc:sqlite:file:ddc_admin_test?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

egon:
  cola:
    component:
      ddc:
        enabled: false
        registry:
          enabled: false
        admin:
          security:
            local-dev: true
          rpc:
            signature-enabled: false
          redis:
            enabled: false
      rpc:
        provider:
          port: 0
        tls:
          development-plaintext: true
